<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1016">
<title>Lingua</title>
<style>
:root{
  --bg:#0c1016;--card:#151b24;--card2:#1c2430;--line:#28323f;--txt:#eef2f7;--mut:#8a96a8;
  --acc:#22c55e;--acc2:#4ade80;--blue:#38bdf8;--warn:#fbbf24;--bad:#f87171;--gold:#facc15;--pur:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(74px + env(safe-area-inset-bottom)) env(safe-area-inset-left);min-height:100vh}
body.lesson{padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px}
h1{font-size:22px;font-weight:750}
h2{font-size:16px;font-weight:650;margin:22px 0 10px}
.mut{color:var(--mut)}.small{font-size:13px}.tiny{font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
.btn{background:var(--acc);color:#04210f;border-radius:14px;padding:13px 16px;font-weight:750;letter-spacing:.2px;box-shadow:0 4px 0 #15803d}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #15803d}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.blue{background:var(--blue);color:#04202e;box-shadow:0 4px 0 #0369a1}
.btn.bad{background:var(--bad);color:#2a0606;box-shadow:0 4px 0 #b91c1c}
.btn.full{width:100%}.btn:disabled{opacity:.4;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600}
.bar{height:10px;background:#0a0e13;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .35s}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(12,16,22,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 10px}
nav button .i{font-size:21px}nav button.on{color:var(--acc2)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
/* path */
.unit{border-radius:16px;padding:14px 16px;margin:18px 0 6px;color:#06210f;font-weight:700}
.unit .small{font-weight:500;opacity:.8}
.path{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.node{width:66px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--card2);border:1px solid var(--line);box-shadow:0 5px 0 #0a0e13;position:relative}
.node.done{background:var(--gold);box-shadow:0 5px 0 #a16207}
.node.cur{background:var(--acc);box-shadow:0 5px 0 #15803d;animation:pulse 1.8s infinite}
.node.locked{opacity:.45}
.node.test{border-radius:18px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.node .lbl{position:absolute;top:100%;margin-top:9px;font-size:11px;color:var(--mut);white-space:nowrap}
/* lesson */
.lhead{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.lhead .bar{flex:1;height:14px}
.prompt{font-size:21px;font-weight:700;margin:6px 0 16px;line-height:1.35}
.target{font-size:22px;font-weight:700}
.rom{font-size:13px;color:var(--mut);font-style:italic}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;font-size:16px;box-shadow:0 3px 0 #0a0e13}
.opt.sel{border-color:var(--blue);background:#0f2533}
.opt.good{border-color:var(--acc);background:#0f2a1b}
.opt.badx{border-color:var(--bad);background:#2a1214}
.tok{display:inline-block;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px 13px;margin:4px;font-size:16px;box-shadow:0 3px 0 #0a0e13}
.tok.used{opacity:.15;pointer-events:none}
.answerline{min-height:64px;border-bottom:2px solid var(--line);margin-bottom:18px;padding:4px 0}
.match{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.match .opt{margin:0;text-align:center;font-size:15px;padding:13px 8px}
.match .opt.gone{opacity:.15;pointer-events:none}
.feedback{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));z-index:20;animation:up .2s}
.feedback.ok{background:#0f2a1b;border-top:2px solid var(--acc)}
.feedback.no{background:#2a1214;border-top:2px solid var(--bad)}
@keyframes up{from{transform:translateY(100%)}}
.checkbar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:15}
.inner{max-width:560px;margin:0 auto}
.speak{width:54px;height:54px;border-radius:14px;background:var(--blue);color:#04202e;font-size:24px;display:grid;place-items:center;box-shadow:0 4px 0 #0369a1;flex:none}
.speak.sm{width:34px;height:34px;font-size:16px;border-radius:10px;box-shadow:0 2px 0 #0369a1}
/* misc */
.list .item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border:0}
.langbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:7px}
.langbtn .fl{font-size:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.lb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px}
.lb.me{background:#0f2a1b;border:1px solid var(--acc)}
.lb .pos{width:22px;text-align:center;font-weight:800}
.zone{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:8px 4px 4px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#14301f;border:1px solid var(--acc);padding:10px 16px;border-radius:12px;font-weight:650;z-index:50;animation:pop .25s;max-width:90vw;text-align:center}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.bubble{max-width:85%;padding:10px 13px;border-radius:16px;margin:6px 0;white-space:pre-wrap}
.bubble.ai{background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble.me{background:#0f2a1b;border:1px solid #1f5c39;margin-left:auto;border-bottom-right-radius:4px}
.fix{font-size:13px;background:#2b2410;border:1px solid #6b5418;border-radius:10px;padding:7px 10px;margin:4px 0 6px}
.spin{display:inline-block;animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.seg button.on{border-color:var(--acc);background:#0f2a1b}
.center{text-align:center}
</style>
</head>

function rivalsFor(week,tier,seed){
  const rnd=seeded(week+"|"+tier+"|"+seed), base=LEAGUES[tier][2];
  const out=[], pool=RIVALS.slice(), pick=[];
  for(let i=0;i<9;i++){ pick.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]); }
  pick.forEach(n=>{const target=Math.round(base*(0.35+rnd()*1.5)), lazy=rnd()<0.15; out.push({name:n,target:lazy?Math.round(target*0.15):target,curve:0.6+rnd()*0.9});});
  return out;
}
function rivalXP(r,p){return Math.round(r.target*Math.pow(p,r.curve));}

  const rows=rivalsFor(week,tier,seed).map(r=>({name:r.name,xp:rivalXP(r,p),bot:true}));
  rows.push({name:"You",xp:myXP,me:true}); rows.sort((a,b)=>b.xp-a.xp||(a.me?-1:1)); return rows;
}

  const lg=state.league, wk=weekKey();
  if(lg.week===wk) return;
  const rows=standings(lg.week,lg.tier,lg.seed,lg.xp,1), pos=rows.findIndex(r=>r.me)+1, old=lg.tier;

}

function lessonPrompt(li,u,l){

Earlier units: ${prevTopics}. Words the learner already knows (reuse some): ${knownWords(50).join(", ")||"(none yet)"}.

Return ONLY JSON in exactly this shape:

  {"type":"mc","dir":"to_target","q":"${base} sentence","options":["target option",...4 total],"tr":["romanization per option or \\"\\""],"answer":2},
  {"type":"build","base":"${base} sentence","target":"correct target sentence","tokens":["target","words","in","correct","order"],"distractors":["2-4 plausible wrong target words"],"r":"romanization or \\"\\""},
  {"type":"type","base":"${base} sentence (short)","answers":["accepted target answer","another accepted variant"]},

  {"type":"listen","target":"short target sentence","r":"romanization or \\"\\"","options":["${base} meaning",... 4 total],"answer":1},
  {"type":"fill","q":"target sentence with ___ for one missing word","r":"romanization or \\"\\"","t":"${base} translation of full sentence","options":["4 target words"],"answer":0}

}
function validLesson(x){
  if(!x||!Array.isArray(x.exercises))return null;
  const ok=[];
  for(const e of x.exercises){
    try{
      if(e.type==="mc"||e.type==="listen"||e.type==="fill"){ if(!Array.isArray(e.options)||e.options.length<2)continue; e.answer=+e.answer; if(!(e.answer>=0&&e.answer<e.options.length))continue; if(e.type!=="listen"&&!e.q)continue; if(e.type==="listen"&&!e.target)continue; ok.push(e); }
      else if(e.type==="build"){ if(!Array.isArray(e.tokens)||e.tokens.length<2||!e.base)continue; e.distractors=Array.isArray(e.distractors)?e.distractors.filter(d=>!e.tokens.includes(d)).slice(0,4):[]; ok.push(e); }
      else if(e.type==="type"){ if(!e.base||!Array.isArray(e.answers)||!e.answers.length)continue; ok.push(e); }
      else if(e.type==="match"){ if(!Array.isArray(e.pairs)||e.pairs.length<3)continue; e.pairs=e.pairs.filter(p=>Array.isArray(p)&&p[0]&&p[1]).slice(0,5); if(e.pairs.length<3)continue; ok.push(e); }
    }catch(err){}
  }
  if(ok.length<5)return null;
  return {title:String(x.title||""),tip:String(x.tip||""),newWords:(Array.isArray(x.newWords)?x.newWords:[]).filter(w=>w&&w.w&&w.t).slice(0,6),exercises:ok};
}
function sshuffle(a,rnd){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildLesson(u,l){
  const C=COURSES[state.cur], U=C.units[u], test=l===LESSONS_PER_UNIT-1, rnd=seeded(state.cur+"|"+u+"|"+l);
  const allW=C.units.slice(0,u+1).flatMap(x=>x.w), near=C.units.slice(Math.max(0,u-2),u+3).flatMap(x=>x.s);
  const newW= test?[]:U.w.slice(l*3,l*3+3);
  const sents= test?sshuffle(U.s,rnd).slice(0,6):U.s.slice(l*2,l*2+2);
  const review= test?U.w:U.w.slice(0,l*3).concat(u>0?C.units[u-1].w:[]);
  const others=(w,n,key)=>sshuffle(allW.filter(x=>x[0]!==w[0]&&x[1]!==w[1]),rnd).slice(0,n).map(x=>x[key]);
  const ex=[], NS=!!C.nospace, J=t=>NS?t.split(" ").join(""):t, R=x=>x&&x[2]?x[2]:"";
  const romOf=t=>{ const w=allW.find(x=>x[0]===t); return w?R(w):""; };
  const mcWord=(w,i)=>{ if(i%2===0){ const opts=sshuffle([w[1]].concat(others(w,3,1)),rnd); ex.push({type:"mc",dir:"to_base",q:w[0],r:R(w),options:opts,answer:opts.indexOf(w[1])}); }
    else { const opts=sshuffle([w[0]].concat(others(w,3,0)),rnd); ex.push({type:"mc",dir:"to_target",q:w[1],options:opts,tr:opts.map(romOf),answer:opts.indexOf(w[0])}); } };
  (test?sshuffle(U.w,rnd).slice(0,4):newW).forEach(mcWord);
  const mp=[]; newW.concat(sshuffle(review,rnd)).forEach(w=>{ if(mp.length<5&&!mp.some(p=>p[0]===w[0]||p[1]===w[1])) mp.push([w[0],w[1]]); });
  if(mp.length>=3) ex.push({type:"match",pairs:mp});
  const strip=t=>t.replace(/[¿?¡!.,]/g,"");
  sents.forEach((st,j)=>{
    const toks=st[0].split(" ");
    const kind= test? ["build","listen","fill","build","type","listen"][j%6] : null;
    if(!test||kind==="build"){
      const dis=sshuffle(U.w.map(w=>w[0]).filter(w=>!w.includes(" ")&&!toks.map(t=>norm(t)).includes(norm(w))),rnd).slice(0,3);
      ex.push({type:"build",base:st[1],target:J(st[0]),tokens:toks,distractors:dis,r:R(st)});
    }
    if(!test||kind==="listen"){
      const opts=sshuffle([st[1]].concat(sshuffle(near.filter(x=>x[1]!==st[1]),rnd).slice(0,3).map(x=>x[1])),rnd);
      ex.push({type:"listen",target:J(st[0]),r:R(st),options:opts,answer:opts.indexOf(st[1])});
    }
    if((!test&&j===0)||kind==="fill"){
      const cand=toks.map((t,i)=>[strip(t),i]).filter(([t])=>t.length>=(NS?1:3)); if(cand.length){
        const [word,idx]=cand.sort((a,b)=>b[0].length-a[0].length)[Math.floor(rnd()*Math.min(2,cand.length))];
        const q=toks.map((t,i)=>i===idx?t.replace(word,"___"):t).join(NS?"":" ");
        const pool=C.units.slice(Math.max(0,u-1),u+2).flatMap(x=>x.s).flatMap(x=>x[0].split(" ")).map(strip).filter(t=>t.length>=(NS?1:3)&&norm(t)!==norm(word));
        const opts=sshuffle([word].concat(sshuffle([...new Set(pool)],rnd).slice(0,3)),rnd);
        ex.push({type:"fill",q,r:R(st),t:st[1],options:opts,answer:opts.indexOf(word)});
      }
    }
    if((!test&&l>=2&&j===1)||kind==="type") ex.push({type:"type",base:st[1],answers:[J(st[0])].concat(R(st)?[R(st)]:[])});
  });
  if(newW.length){ const w=newW[newW.length-1]; ex.push({type:"type",base:w[1],answers:[w[0]].concat(R(w)?[R(w)]:[])}); }
  const exampleFor=w=>{ const s2=U.s.find(x=>norm(x[0]).split(" ").join(" ").includes(norm(w[0]))); return s2||["",""]; };
  const data={title:UNITS[u][2]+" · "+(test?"Unit test":"Lesson "+(l+1)),tip:"",
    newWords:newW.map(w=>{const e=exampleFor(w);return {w:w[0],r:R(w),t:w[1],ex:J(e[0]),exT:e[1]};}),
    exercises:sshuffle(ex,rnd)};
  return validLesson(data);
}
async function getLesson(u,l,onProgress){

function bindLesson(){
  const lz=lesson, it=curItem();
  $app.querySelector("#qx").onclick=()=>{ sheet(`<p style="margin-bottom:16px">Quit this lesson? Your progress in it will be lost.</p><div class="row"><button class="btn ghost full" id="k">Keep learning</button><button class="btn bad full" id="q">Quit</button></div>`,s=>{s.querySelector("#k").onclick=closeSheet;s.querySelector("#q").onclick=()=>{closeSheet();lesson=null;render();};}); };

  $app.querySelectorAll("[data-tk]").forEach(b=>b.onclick=()=>{ const bi=+b.dataset.tk; if(!it._sel.includes(bi)){ it._sel.push(bi); if(canSpeak(state.cur)) speak(it._bank[bi].t,state.cur); render(); } });

    if(side==="L" && canSpeak(state.cur)) speak(it.pairs[i][0],state.cur);
    if(!it._pick||it._pick.side===side){ it._pick={side,i}; render(); return; }
    if(it._pick.i===i){ it._done.push(i); it._pick=null; learnWord(it.pairs[i][0],it.pairs[i][1],""); if(it._done.length===it.pairs.length){ lz.fb={ok:it._err===0,correct:"",note:it._err?"Done – "+it._err+" mistake"+(it._err>1?"s":""):"Perfect match!"}; if(!it._err){lz.correct++; if(!it._retry) lz.firstTry++;} else lz.wrong++; } render(); }

function check(){
  const lz=lesson, it=curItem(); let ok=false, correct="", extra="", note="", show=false;
  if(it.type==="mc"||it.type==="listen"||it.type==="fill"){
    ok=lz.ans===it.answer; correct=it.options[it.answer];
    if(it.type==="listen"){ extra=it.target+(it.r?" ("+it.r+")":""); show=true; }
    if(it.type==="fill"){ correct=it.q.replace("___",it.options[it.answer]); show=!ok; }
  } else if(it.type==="build"){
    const got=it._sel.map(bi=>it._bank[bi].t).join(" "); const want=it.tokens.join(" ");
    ok=norm(got)===norm(want)||norm(got).replace(/ /g,"")===norm(want).replace(/ /g,""); correct=it.target||want; if(it.r) extra=it.r;
  } else if(it.type==="type"){
    const got=norm(lz.ans), answers=it.answers.map(norm);
    if(answers.includes(got) || answers.map(a=>a.replace(/ /g,"")).includes(got.replace(/ /g,""))) ok=true;
    else { const best=Math.min(...answers.map(a=>lev(a,got))); if(best<=Math.max(1,Math.floor(answers[0].length/12))){ ok=true; note="Almost! Watch the spelling:"; show=true; } }
    correct=it.answers[0];
    if(ok && got!==norm(it.answers[0]) && !note){ /* accepted variant */ }
  }
  if(ok){ lz.correct++; if(!it._retry) lz.firstTry++; }
  else { lz.wrong++; if(!it._retry){ const c=Object.assign({},it,{_retry:1,_order:null,_bank:null,_sel:null,_played:0}); lz.retry.push(c); }
    const l=L(); l.mistakes=(l.mistakes||[]).concat([{q:it.q||it.base||it.target||"",a:correct}]).slice(-40); }
  if(it._w){ const w=L().words[it._w]; if(w) w.s=Math.max(0,Math.min(5,(w.s||0)+(ok?1:-1))); }
  lz.fb={ok,correct,extra,note,show}; render();
  if(ok&&(it.type==="mc"&&it.dir!=="to_target"||it.type==="listen")&&canSpeak(state.cur)){ speak(it.type==="listen"?it.target:it.q,state.cur); }
  if(ok&&(it.type==="build"||it.type==="type")&&canSpeak(state.cur)) speak(correct,state.cur);
}
function learnWord(w,t,r){ const W=L().words; const k=String(w).trim(); if(!k) return; const x=W[k]||{t,r:r||"",s:0,seen:0,added:todayKey()}; x.t=x.t||t; x.seen=(x.seen||0)+1; W[k]=x; }
function advance(){
  const lz=lesson, it=curItem();
  if(it.type==="intro") learnWord(it.w.w,it.w.t,it.w.r);
  lz.fb=null; lz.ans=null; lz._focused=0;
  lz.i++;
  if(lz.i>=lz.items.length && lz.retry.length){ lz.items=lz.items.concat(lz.retry); lz.retry=[]; }
  if(lz.i>=lz.items.length) finishLesson(); else render();
  window.scrollTo(0,0);
}
function finishLesson(){
  const lz=lesson, m=lz.meta, total=lz.items.filter(x=>x.type!=="intro"&&!x._retry).length;
  const perfect=lz.wrong===0;
  let xp;
  if(m.kind==="lesson"){ xp=(m.replay?5:10)+lz.firstTry+(perfect?5:0)+(m.l===LESSONS_PER_UNIT-1&&!m.replay?10:0); L().done[lessonKey(m.u,m.l)]=Math.max(L().done[lessonKey(m.u,m.l)]||0,perfect?3:lz.firstTry/total>=.8?2:1); }
  else xp=5+Math.round(lz.firstTry/2)+(perfect?3:0);
  // vocab from lesson exercises
  (lz.data.newWords||[]).forEach(w=>learnWord(w.w,w.t,w.r));
  const before=rankOf(state.totalXP).name, dailyBefore=state.daily[todayKey()]||0;
  addXP(xp); save();
  lz.phase="done"; lz.xp=xp; lz.perfect=perfect; lz.acc=Math.round(lz.firstTry/Math.max(1,total)*100);
  lz.rankUp=rankOf(state.totalXP).name!==before?rankOf(state.totalXP):null;
  lz.goalHit=dailyBefore<state.goal && (state.daily[todayKey()]||0)>=state.goal;
  lz.secs=Math.round((Date.now()-lz.start)/1000);
  render();
  if(m.kind==="lesson") prefetchNext();
}
function renderResults(){

  $app.innerHTML=`<div class="center" style="margin-top:60px"><div style="font-size:64px">${lz.perfect?"🏆":"🎉"}</div>

    <div class="grid2" style="grid-template-columns:repeat(3,1fr);margin-top:22px">
      <div class="stat"><b style="color:var(--gold)">+${lz.xp}</b><span>XP</span></div>
      <div class="stat"><b style="color:var(--acc2)">${lz.acc}%</b><span>Accuracy</span></div>
      <div class="stat"><b style="color:var(--blue)">${Math.floor(lz.secs/60)}:${pad(lz.secs%60)}</b><span>Time</span></div>
    </div>
    ${lz.goalHit?`<div class="card" style="margin-top:14px;border-color:var(--acc)">🎯 Daily goal reached! 🔥 ${streakNow()} day streak</div>`:""}
    ${lz.rankUp?`<div class="card" style="margin-top:14px;border-color:var(--gold)">${lz.rankUp.icon} New rank: <b>${esc(lz.rankUp.name)}</b></div>`:""}
    ${lz.data.tip?`<div class="card small" style="margin-top:14px;text-align:left">💡 ${esc(lz.data.tip)}</div>`:""}
    <button class="btn full" id="go" style="margin-top:24px">Continue</button></div>`;
  $app.querySelector("#go").onclick=()=>{lesson=null;view=lz.meta.kind==="lesson"?"learn":"practice";render();window.scrollTo(0,0);};
}

/* ---------- practice (offline, from your words) ---------- */
function renderPractice(){
  const W=L().words, words=Object.keys(W), li=langInfo(state.cur);
  const weak=words.slice().sort((a,b)=>(W[a].s||0)-(W[b].s||0));
  $app.innerHTML=topbar()+`<h1 style="margin:16px 0 4px">Practice</h1><p class="small mut">Review your ${esc(li.name)} words – works offline, no AI needed.</p>
    <div class="grid2" style="margin-top:14px"><div class="stat"><b>${words.length}</b><span>Words learned</span></div><div class="stat"><b>${words.filter(w=>(W[w].s||0)>=3).length}</b><span>Mastered</span></div></div>
    <button class="btn full" id="pr" style="margin-top:16px" ${words.length<4?"disabled":""}>🔁 Review weak words (+XP)</button>
    ${words.length<4?`<p class="small mut center" style="margin-top:8px">Finish a lesson first – you need at least 4 words.</p>`:""}
    <h2>Your words</h2><div class="card list">${words.length?weak.slice(0,200).map(w=>`<div class="item">${canSpeak(state.cur)?`<button class="speak sm" data-say="${esc(w)}">🔊</button>`:""}<span style="flex:1"><b>${esc(w)}</b>${W[w].r?` <span class="rom">${esc(W[w].r)}</span>`:""}<br><span class="small mut">${esc(W[w].t)}</span></span><span class="tiny">${"●".repeat(Math.min(5,W[w].s||0))}<span class="mut">${"●".repeat(5-Math.min(5,W[w].s||0))}</span></span></div>`).join(""):'<p class="small mut">No words yet.</p>'}</div>`;
  bindTop();
  $app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say,state.cur));
  const pr=$app.querySelector("#pr"); pr&&(pr.onclick=startPractice);
}
function startPractice(){
  const W=L().words, words=Object.keys(W);
  const pool=words.slice().sort((a,b)=>(W[a].s||0)-(W[b].s||0)||(Math.random()-.5)).slice(0,10);
  const ex=[];
  pool.forEach((w,i)=>{
    const others=shuffle(words.filter(x=>x!==w)).slice(0,3);
    if(i%3===0) ex.push({type:"mc",dir:"to_base",q:w,r:W[w].r,options:shuffle([W[w].t].concat(others.map(o=>W[o].t))),_w:w});
    else if(i%3===1) ex.push({type:"mc",dir:"to_target",q:W[w].t,options:shuffle([w].concat(others)),_w:w});
    else ex.push({type:"type",base:W[w].t,answers:[w],_w:w});
  });
  ex.forEach(e=>{ if(e.type==="mc") e.answer=e.options.indexOf(e.dir==="to_base"?W[e._w].t:e._w); });
  if(words.length>=5){ const m=shuffle(words).slice(0,5); ex.splice(4,0,{type:"match",pairs:m.map(w=>[w,W[w].t])}); }
  startPlayer({title:"Word review",tip:"",newWords:[],exercises:ex},{kind:"practice"});
}

/* ---------- talk (AI conversation) ---------- */
let talk={msgs:[],busy:false,scene:null,showT:{}};
const SCENES=[["☕","Order at a café"],["👋","Meet someone new"],["🛍️","Buy something in a shop"],["🗺️","Ask for directions"],["🏨","Check in at a hotel"],["🎲","Free chat about anything"]];
function renderTalk(){
  const li=langInfo(state.cur);
  if(!talk.scene){
    $app.innerHTML=topbar()+`<h1 style="margin:16px 0 4px">Talk</h1><p class="small mut">Chat with an AI partner in ${esc(li.name)} at your level. It gently corrects your mistakes. +2 XP per message.</p>
      ${aiState!=="ok"?`<div class="card small" style="margin-top:12px;border-color:var(--warn)">${aiState==="pending"?"Connecting…":"⚠️ Talk needs Claude – open Lingua in the Claude app or on claude.ai."}</div>`:""}
      <div style="margin-top:14px">${SCENES.map((s,i)=>`<button class="langbtn" data-sc="${i}" ${aiState!=="ok"?"disabled":""}><span class="fl">${s[0]}</span><b style="flex:1">${esc(s[1])}</b><span class="mut">›</span></button>`).join("")}</div>`;
    bindTop();
    $app.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{ talk={msgs:[],busy:false,scene:SCENES[+b.dataset.sc],showT:{}}; render(); talkSend(null); });
    return;
  }
  $app.innerHTML=`<div class="row between" style="margin:6px 0 12px"><button class="btn ghost" style="padding:6px 12px" id="tb">‹</button><b>${talk.scene[0]} ${esc(talk.scene[1])}</b><span></span></div>
    <div id="chat">${talk.msgs.map((m,i)=>m.role==="ai"?`
      <div class="bubble ai"><div class="row" style="align-items:flex-start">${canSpeak(state.cur)?`<button class="speak sm" data-say="${esc(m.reply)}">🔊</button>`:""}<div style="flex:1">${esc(m.reply)}${m.r?`<div class="rom">${esc(m.r)}</div>`:""}
      ${talk.showT[i]?`<div class="small mut" style="margin-top:6px">${esc(m.t)}</div>`:`<button class="tiny" style="color:var(--blue);margin-top:4px" data-tt="${i}">Show translation</button>`}</div></div></div>`:`
      <div class="bubble me">${esc(m.text)}</div>${m.fix?`<div class="fix">✏️ ${esc(m.fix)}</div>`:""}`).join("")}
      ${talk.busy?`<div class="bubble ai mut">…</div>`:""}</div>
    <div class="checkbar"><div class="inner row"><input id="ti" placeholder="Write in ${esc(li.name)}…" ${talk.busy?"disabled":""}><button class="btn" id="ts" style="padding:12px 16px" ${talk.busy?"disabled":""}>➤</button></div></div>
    <div style="height:90px"></div>`;
  $app.querySelector("#tb").onclick=()=>{talk.scene=null;render();};
  $app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say,state.cur));
  $app.querySelectorAll("[data-tt]").forEach(b=>b.onclick=()=>{talk.showT[+b.dataset.tt]=1;render();});
  const ti=$app.querySelector("#ti"), send=()=>{ const v=ti.value.trim(); if(v&&!talk.busy) talkSend(v); };
  $app.querySelector("#ts").onclick=send; ti.onkeydown=e=>{ if(e.key==="Enter") send(); };
  if(!talk.busy) setTimeout(()=>ti.focus(),50);
  window.scrollTo(0,document.body.scrollHeight);
}
async function talkSend(text){
  const li=langInfo(state.cur), base=baseEnglishName(state.base), lvl=(()=>{const n=nextLesson();return n?UNITS[n[0]][0]:"B1";})();
  if(text) talk.msgs.push({role:"me",text});
  talk.busy=true; render();
  const history=talk.msgs.slice(-12).map(m=>m.role==="ai"?"PARTNER: "+m.reply:"LEARNER: "+m.text).join("\n");
  const prompt=`You are a friendly conversation partner helping someone practise ${li.name} (${li.code}). Their level: ${lvl} (CEFR). Their base language: ${base}.
Scenario: ${talk.scene[1]}. Play a natural role in this scenario (e.g. the barista, the new friend). Keep replies short (1–3 sentences), simple enough for ${lvl}, and end with a question or prompt so the learner answers.
Known words they've learned: ${knownWords(40).join(", ")||"(few)"}.
Conversation so far:
${history||"(start the conversation – greet them and open the scenario)"}

Reply with ONLY JSON: {"reply":"your next message in ${li.name}","r":"romanization if non-Latin script else \\"\\"","t":"${base} translation of your reply","fix":"if the learner's LAST message had mistakes: the corrected sentence + a very short ${base} explanation; otherwise \\"\\""}`;
  try{
    const res=await sampleFn.json(prompt,{modelTier:"quick",cache:false});
    if(text && res.fix){ const last=talk.msgs[talk.msgs.length-1]; if(last&&last.role==="me") last.fix=String(res.fix); }
    talk.msgs.push({role:"ai",reply:String(res.reply||"…"),r:String(res.r||""),t:String(res.t||"")});
    if(text){ const t=todayKey(); state.talkXP[t]=state.talkXP[t]||0; if(state.talkXP[t]<30){ state.talkXP[t]+=2; addXP(2); save(); } }
  }catch(e){ talk.msgs.push({role:"ai",reply:e&&e.code==="rate_limited"?"(Usage limit reached – try again later.)":"(Couldn't answer – try again.)",r:"",t:""}); }
  talk.busy=false; render();
}

/* ---------- league ---------- */
function renderLeague(){
  rollLeague();
  const lg=state.league, T=LEAGUES[lg.tier], rows=standings(lg.week,lg.tier,lg.seed,lg.xp,weekProgress());
  const pos=rows.findIndex(r=>r.me)+1, r=rankOf(state.totalXP);
  const d=new Date(), daysLeft=7-((d.getDay()+6)%7);
  $app.innerHTML=topbar()+`
    <div class="center" style="margin:16px 0 4px"><div style="font-size:52px">${T[1]}</div><h1>${T[0]} League</h1>
    <p class="small mut">Top 3 move up · bottom 3 move down · ends in ${daysLeft} day${daysLeft>1?"s":""}</p></div>
    <div class="row" style="justify-content:center;gap:4px;margin:10px 0 14px">${LEAGUES.map((x,i)=>`<span style="font-size:${i===lg.tier?22:14}px;opacity:${i<=lg.tier?1:.3}">${x[1]}</span>`).join("")}</div>
    <div class="card" style="padding:8px">
      ${rows.map((x,i)=>`${i===0&&lg.tier<LEAGUES.length-1?'<div class="zone" style="color:var(--acc2)">▲ Promotion zone</div>':""}${i===3&&lg.tier<LEAGUES.length-1?'<div style="border-top:1px dashed var(--line);margin:6px 4px"></div>':""}${i===7&&lg.tier>0?'<div class="zone" style="color:var(--bad)">▼ Demotion zone</div>':""}
        <div class="lb ${x.me?"me":""}"><span class="pos" style="color:${i<3?"var(--gold)":"var(--mut)"}">${i+1}</span><span style="flex:1;font-weight:${x.me?800:500}">${x.me?(esc(state.name||"You")+" (you)"):esc(x.name)}${x.bot?' <span class="tiny mut">🤖</span>':""}</span><b>${x.xp} XP</b></div>`).join("")}
    </div>
    <p class="tiny mut center" style="margin-top:8px">🤖 = computer rivals whose XP grows through the week. You're #${pos}.</p>
    <h2>Your rank</h2>
    <div class="card"><div class="row"><span style="font-size:34px">${r.icon}</span><div style="flex:1"><b style="font-size:18px">${esc(r.name)}</b><div class="small mut">${state.totalXP} XP total${r.next?" · "+(r.next-state.totalXP)+" XP to next rank":""}</div>
      ${r.next?`<div class="bar" style="margin-top:8px;height:8px"><i style="width:${Math.round((state.totalXP-r.from)/(r.next-r.from)*100)}%"></i></div>`:""}</div></div>
      <div class="row wrapf small mut" style="gap:10px;margin-top:12px">${RANKS.map(x=>`<span style="opacity:${state.totalXP>=x[0]?1:.35}">${x[2]} ${x[1]}</span>`).join("")}</div></div>`;
  bindTop();
}
function showLeagueResult(r){
  const up=r.to>r.from, down=r.to<r.from, T=LEAGUES[r.to];
  sheet(`<div class="center"><div style="font-size:56px">${up?"🎉":down?"😬":T[1]}</div><h1 style="margin:8px 0">${up?"Promoted!":down?"Demoted":"League finished"}</h1>
    <p class="mut">You finished #${r.pos} with ${r.xp} XP.</p><p style="margin-top:8px">${up?"Welcome to the "+T[0]+" League "+T[1]:down?"Back to the "+T[0]+" League. You've got this!":"You stay in the "+T[0]+" League."}</p>
    <button class="btn full" id="ok" style="margin-top:18px">Let's go</button></div>`,s=>{s.querySelector("#ok").onclick=closeSheet;});
}

/* ---------- me ---------- */
function renderMe(){
  const li=langInfo(state.cur), l=L(), W=l.words||{}, r=rankOf(state.totalXP);
  const doneN=Object.keys(l.done).length, totalN=UNITS.length*LESSONS_PER_UNIT, nx=nextLesson();
  const days=[];for(let i=6;i>=0;i--){const k=addDays(todayKey(),-i);days.push([k,state.daily[k]||0]);}
  const mx=Math.max(state.goal,...days.map(d=>d[1]));
  $app.innerHTML=topbar()+`
    <div class="row" style="margin:16px 0"><div style="font-size:44px">${r.icon}</div><div><h1>${esc(state.name||"Learner")}</h1><div class="small mut">${esc(r.name)} · ${LEAGUES[state.league.tier][0]} League</div></div></div>
    <div class="grid2"><div class="stat"><b>🔥 ${streakNow()}</b><span>Day streak</span></div><div class="stat"><b>⚡ ${state.totalXP}</b><span>Total XP</span></div>
      <div class="stat"><b>📚 ${Object.keys(W).length}</b><span>${esc(li.name)} words</span></div><div class="stat"><b>${nx?UNITS[nx[0]][0]:"B1 ✓"}</b><span>Level</span></div></div>
    <h2>${li.flag} ${esc(li.name)} course</h2>
    <div class="card"><div class="row between small"><span>${doneN} / ${totalN} lessons</span><span class="mut">${Math.round(doneN/totalN*100)}%</span></div><div class="bar" style="margin-top:8px"><i style="width:${Math.round(doneN/totalN*100)}%"></i></div>
      <div class="row small mut" style="gap:12px;margin-top:10px"><span>A1 ${pct(0,10)}%</span><span>A2 ${pct(10,20)}%</span><span>B1 ${pct(20,30)}%</span></div></div>
    <h2>Last 7 days</h2>
    <div class="card"><div class="row" style="align-items:flex-end;gap:8px;height:110px">${days.map(([k,v])=>`<div style="flex:1;text-align:center"><div style="height:${Math.round(v/mx*80)}px;background:${v>=state.goal?"var(--acc)":"var(--card2)"};border-radius:6px 6px 2px 2px;min-height:4px"></div><div class="tiny mut" style="margin-top:4px">${parseKey(k).toLocaleDateString(undefined,{weekday:"narrow"})}</div></div>`).join("")}</div>
      <div class="small mut" style="margin-top:8px">🧊 Streak freezes: ${state.streak.freeze} (earn one every 7 days)</div></div>
    <h2>Settings</h2>
    <div class="card">
      <div class="field"><label class="small mut">Name</label><input id="nm" maxlength="24" value="${esc(state.name)}"></div>
      <div class="field" style="margin-top:12px"><label class="small mut">Daily goal</label><div class="seg" style="margin-top:6px">${[10,20,30,50].map(g=>`<button data-g="${g}" class="${state.goal===g?"on":""}">${g} XP</button>`).join("")}</div></div>
      <button class="btn ghost full" id="ll" style="margin-top:14px">🌍 Switch language</button>
    </div>
    ${NATIVE?`<h2>🔔 Daily reminder</h2><div class="card"><div class="row between"><span><b>Practice reminder</b><br><span class="small mut">Only if you haven't reached your daily goal</span></span><button class="btn ${state.rem&&state.rem.on?"":"ghost"}" style="padding:7px 14px" id="remon">${state.rem&&state.rem.on?"On":"Off"}</button></div>
      ${state.rem&&state.rem.on?`<input type="time" id="remt" value="${esc(state.rem.t)}" style="margin-top:10px">`:""}</div>`:""}
    <h2>Backup</h2><div class="card"><p class="small mut" style="margin-bottom:10px">Progress is saved on this phone. Copy a backup now and then.</p>
      <div class="row"><button class="btn ghost full" id="cp">Copy backup</button><button class="btn ghost full" id="rs">Restore…</button></div></div>
    <p class="tiny mut center" style="margin:16px 0">Lingua app ${esc(NATIVE&&NATIVE.apkVersion?NATIVE.apkVersion():"web")} · content v${LINGUA_WEB_VERSION}${NATIVE&&NATIVE.checkUpdates?' · <button id="upd" style="color:var(--blue)">Check for updates</button>':""}</p>`;
  bindTop();
  const nm=$app.querySelector("#nm"); nm.onchange=()=>{state.name=nm.value.trim();save();toast("Saved");};
  $app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{state.goal=+b.dataset.g;save();render();});
  $app.querySelector("#ll").onclick=()=>openLangPicker();
  const ro=$app.querySelector("#remon"); ro&&(ro.onclick=()=>{ state.rem=state.rem||{on:false,t:"19:00"}; state.rem.on=!state.rem.on; if(state.rem.on){ try{NATIVE.askPermission();}catch(e){} toast("Reminder at "+state.rem.t); } save(); nativeSync(); render(); });
  const rt=$app.querySelector("#remt"); rt&&(rt.onchange=()=>{ if(/^\d\d:\d\d$/.test(rt.value)){ state.rem.t=rt.value; save(); nativeSync(); toast("Reminder at "+rt.value); } });
  const up=$app.querySelector("#upd"); up&&(up.onclick=()=>{ try{NATIVE.checkUpdates(); toast("Checking for updates…");}catch(e){} });
  $app.querySelector("#cp").onclick=async()=>{ const txt=JSON.stringify(state);
    try{ await navigator.clipboard.writeText(txt); toast("Backup copied – paste it into a note"); }
    catch(e){ sheet('<h2 style="margin-top:0">Your backup</h2><textarea rows="8" readonly>'+esc(txt)+'</textarea><button class="btn full" style="margin-top:10px" id="dn">Done</button>',s2=>{s2.querySelector("#dn").onclick=closeSheet;const ta=s2.querySelector("textarea");ta.focus();ta.select();}); } };
  $app.querySelector("#rs").onclick=()=>sheet('<h2 style="margin-top:0">Restore backup</h2><textarea id="rt2" rows="8" placeholder="Paste backup here"></textarea><button class="btn full" style="margin-top:10px" id="rok">Restore</button>',s2=>{
    s2.querySelector("#rok").onclick=()=>{ try{ const d=JSON.parse(s2.querySelector("#rt2").value); if(!d||!d.langs||!d.cur) throw 0; state=fix(d); save(); closeSheet(); render(); toast("Restored ✓"); }catch(e){ toast("That doesn't look like a Lingua backup"); } }; });
  function pct(a,b){let n=0;for(let u=a;u<b;u++)for(let x=0;x<LESSONS_PER_UNIT;x++)if(l.done[lessonKey(u,x)])n++;return Math.round(n/((b-a)*LESSONS_PER_UNIT)*100);}
}


/* ================= Android bridge ================= */
let apkUpdate=null;
window.ascendApkUpdate=function(v){ apkUpdate=v; if(state&&!lesson) render(); };
window.ascendToast=function(m){ toast(m); };
function nativeSync(){
  if(!NATIVE||!state||!state.cur) return;
  try{ const t=todayKey(); NATIVE.report(t, state.daily[t]||0, state.goal, streakNow(), state.name||"");
       const r=state.rem||{on:false,t:"19:00"}; NATIVE.setReminders(JSON.stringify({m:{on:false,t:"08:00"},e:{on:!!r.on,t:r.t}})); }catch(e){}
}
const _save=save; save=function(){ _save(); nativeSync(); };
/* ================= boot ================= */
state=fix(lsGet(LS));
if(state && !state.rem) state.rem={on:false,t:"19:00"};
aiState="native";
render();
nativeSync();
try{ const seen=+localStorage.getItem("lingua_seen_ver")||0; if(state&&seen&&seen<LINGUA_WEB_VERSION) setTimeout(()=>toast("✨ Lingua updated"),400); localStorage.setItem("lingua_seen_ver",String(LINGUA_WEB_VERSION)); }catch(e){}
window.addEventListener("focus",()=>{ if(state&&!lesson) render(); });
window.__lingua={get state(){return state;},get lesson(){return lesson;},render,validLesson,standings,weekKey,buildLesson};
})();
</script>
