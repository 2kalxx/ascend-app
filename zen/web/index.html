<!DOCTYPE html>
<html lang="en">
<head>

<title>Zen Drop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{background:#2a2c31;color:#f2f2f2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100%;overflow:hidden;touch-action:manipulation}

.icon.off{opacity:.4}.icon.off:after{content:"";position:absolute;width:22px;height:2.5px;background:#ff6b6b;transform:rotate(-45deg)}

.money{flex:1;line-height:1.05}.money b{font-size:21px;font-weight:900;color:#fff}.money small{display:block;font-size:11px;color:#9aa0aa;font-weight:700}

@keyframes pulse{50%{transform:scale(1.08)}}

canvas{display:block;touch-action:none}

#tabs button.t.on{background:#2f3137;color:#ffd400}
#modes{display:flex;gap:4px;margin-left:4px}#modes button{padding:5px 7px;border-radius:7px;border:0;background:#2f3137;color:#aaa;font:inherit;font-weight:900;font-size:11px}#modes button.on{background:#ffd400;color:#222}

#jump button{width:36px;height:36px;border-radius:10px;border:0;background:rgba(20,21,24,.85);color:#ffd400;font-size:16px;font-weight:900}

.srow2 .num{width:26px;height:26px;border-radius:7px;background:#141518;color:#ffd400;display:grid;place-items:center;font-weight:900;font-size:12px;flex:none}

<body>
<div id="app">
  <div id="top"><button class="icon" id="menuB">☰</button><div class="money"><b id="coinT">$0</b><small id="rateT">$0/s</small></div>
    <button class="icon" id="cardB">🃏<span class="badge" id="cardN" style="display:none"></span></button><button class="icon" id="perkB">⭐</button><button class="icon" id="musB">🎵</button><button class="icon" id="sndB">🔔</button></div>
  <div id="unlockBar"><button id="unlockB"></button></div>
  <div id="wrap"><canvas id="cv"></canvas><button id="showB">▲ Upgrades</button><div id="jump"><button id="jTop">⤒</button><button id="jEnd">⤓</button></div></div>
  <div id="panel"><div id="tabs"><button class="t on" data-t="balls">BALLS</button><button class="t" data-t="stage">STAGES</button><div id="modes"><button data-m="1" class="on">x1</button><button data-m="10">x10</button><button data-m="max">MAX</button></div><button id="hideB" title="Hide upgrades">▼</button></div><div id="list"></div></div>
</div>
<div id="layer"></div>
<script>
(function(){
"use strict";
const ZEN_WEB_VERSION = 6; // bump on every web update (the Android app reads this)
const NATIVE=(typeof window.AppNative!=="undefined")?window.AppNative:null;
const UNITS=["K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","Ud","Dd","Td","Qad","Qid","Sxd","Spd","Ocd","Nod","Vg"];
function fmt(n){ if(!isFinite(n)) return "∞"; if(n<1000) return (n<10&&n%1?n.toFixed(1):String(Math.floor(n))); let i=-1; while(n>=1000&&i<UNITS.length-1){ n/=1000; i++; } if(n>=1000) return n.toExponential(2)+UNITS[i]; return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+UNITS[i]; }
const $=id=>document.getElementById(id);
const money=n=>"$"+fmt(n);
const NST=50;

/* ================= balls & economy ================= */
const TYPES=[{name:"White",col:"#f4f4f4"},{name:"Cyan",col:"#3fd6e8"},{name:"Lime",col:"#a6e33b"},{name:"Orange",col:"#ff9f1c"},{name:"Purple",col:"#b86bff"},{name:"Red",col:"#ff4d5e"},{name:"Pink",col:"#ff7fd1"},{name:"Gold",col:"#ffd400"}];
const GATE=[1,2,4,7,11,16,22,30]; // stages you need to own to unlock each ball
const RMAX=25;
const spawnTime=r=>3.2/(1+0.22*(r-1));
const costRate=(k,r)=>8*Math.pow(7,k)*Math.pow(1.5,r-1)*perkCost("ballCost");
const costVal=(k,v)=>10*Math.pow(7,k)*Math.pow(1.3,v-1)*perkCost("ballCost");
const costUnlock=k=>60*Math.pow(9,k);
let PRICES=[0,60,926,3.21e+07,7.6e+11,2.06e+13,1.36e+14,1.2e+15,5.8e+15,1.8e+16,4.92e+16,4.22e+17,1.6e+18,9e+18,3.39e+19,1.53e+20,1.34e+21,7.15e+21,3.71e+22,1.69e+23,1.83e+23,7.2e+23,5.35e+24,2.86e+25,9.3e+25,3.26e+26,9.95e+26,2.7e+27,5.75e+27,1.6e+28,8.15e+28,2.38e+29,8.15e+29,2.06e+30,6.2e+30,1.38e+31,2.56e+31,5.4e+31,1.03e+32,2.58e+32,4.22e+32,9.95e+32,2.08e+33,3.38e+33,6.5e+33,1.13e+34,2.58e+34,5.05e+34,7.9e+34,1.81e+35]; // price to unlock stage L (index L-1)
const priceOf=L=>PRICES[L-1];
const basis=L=>Math.max(50,PRICES[L-1]||50);
const OMAX=30, GMAX=10;
const costObs=(L,l)=>basis(L)*0.05*Math.pow(1.55,l)*perkCost("stageCost");
const costGate=(L,l)=>basis(L)*0.15*Math.pow(1.9,l)*perkCost("stageCost");
/* perks: pick 1 of 3 after every cleared stage */
const PERKS=[
 {id:"rate",ic:"⏩",name:"Faster drops",d:"All balls spawn 15% faster"},
 {id:"value",ic:"💰",name:"Rich balls",d:"All ball values ×1.3"},
 {id:"ballCost",ic:"🏷️",name:"Ball discount",d:"Ball upgrades cost 12% less"},
 {id:"stageCost",ic:"🧱",name:"Builder",d:"Stage upgrades cost 20% less"},
 {id:"gates",ic:"🚪",name:"Wide gates",d:"Gate multipliers +0.25"},
 {id:"hits",ic:"⚫",name:"Hard hits",d:"Obstacle bonus +2% per hit"},
 {id:"offline",ic:"🌙",name:"Night shift",d:"Offline earnings +25%"},
 {id:"tap",ic:"👆",name:"Double tap",d:"Tapping drops one more ball"}];
const P=id=>(S.perks&&S.perks[id])||0;
function perkCost(id){ return Math.pow(id==="ballCost"?0.88:0.8,P(id)); }

/* cards: 1 card for every cleared stage, duplicates level them up */
const CARDS=[
 {id:"gm",r:1,ic:"🚪",name:"Gate Multipliers",d:l=>`Gates ×${(1+0.1*l).toFixed(1)}`},
 {id:"sr",r:1,ic:"⏱️",name:"Spawn Rate",d:l=>`Spawns +${5*l}%`},
 {id:"cr",r:1,ic:"🪙",name:"Coin Rain",d:l=>`All values +${10*l}%`},
 {id:"hh",r:2,ic:"🔨",name:"Heavy Hitters",d:l=>`Hit bonus +${15*l}%`},
 {id:"gw",r:2,ic:"🌀",name:"Gravity Well",d:l=>`Balls fall ${5*l}% slower (more hits)`},
 {id:"wp",r:2,ic:"⚪",name:"White Power",d:l=>`White balls ×${1+l}`},
 {id:"td",r:3,ic:"👯",name:"Twin Drop",d:l=>`${4*l}% chance to drop 2 balls`},
 {id:"md",r:3,ic:"👑",name:"Midas",d:l=>`All values ×${(1+0.25*l).toFixed(2)}`},
 {id:"ff",r:3,ic:"🔥",name:"Fever",d:l=>`Taps last ${l} s longer`}];
const C=id=>(S.cards&&S.cards[id])||0; // level
const cardNeed=l=>l; // copies needed to go from level l to l+1


const valueMult=()=>Math.pow(1.3,P("value"))*(1+0.1*C("cr"))*(1+0.25*C("md"));
const rateMult=()=>Math.pow(1.15,P("rate"))*(1+0.05*C("sr"));
const ballVal=k=>Math.pow(6,k)*Math.pow(1.2,S.val[k]-1)*valueMult()*(k===0?1+C("wp"):1);
const stOf=L=>{ S.st[L]=S.st[L]||{o:1,g:0}; return S.st[L]; };
const hitPct=L=>(0.04*stOf(L).o+0.02*P("hits"))*(1+0.15*C("hh"))*(STG[L]?STG[L].bf:1);
const gateMult=L=>(1.5+0.35*stOf(L).g+0.25*P("gates"))*(1+0.1*C("gm"));

/* ================= state ================= */
const LS="zen_state_v3";
function fresh(){ return {coins:0,unlocked:1,rate:[1,0,0,0,0,0,0,0],val:[1,1,1,1,1,1,1,1],st:{},perks:{},cards:{},copies:{},pendPerk:0,newCards:0,mode:"1",tab:"balls",panelHidden:false,sound:true,music:true,haptic:true,last:Date.now(),avg:0,total:0,seen:0,cam:0}; }
let S; try{ S=Object.assign(fresh(),JSON.parse(localStorage.getItem(LS))||{}); }catch(e){ S=fresh(); }
let saveT=0; function save(force){ const n=Date.now(); if(!force&&n-saveT<3000) return; saveT=n; S.last=n; S.cam=cam; try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }

/* ================= stages ================= */
const W=360, H=620, HS=620, G0=520;
const NAMES=["Start","Dots","Path","Funnel","Roofs","Pyramid","Pillars","Rings","Zigzag","Spinners","Hourglass","Scatter","Stairs","Orbit","Comb","Diamonds","Twister","Lanes","Bubbles","Chevrons"];
function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
// average bounces per ball on each layout (measured) → bounce bonus is scaled so every stage pays about the same
const AVGHITS={start:3.5,dots:4.2,path:10,funnel:2.9,cross:1.6,pyramid:2.8,pillars:2,rings:3.8,zigzag:3,spinners:2.2,hourglass:2.3,scatter:2.5,stairs:3.9,orbit:0.8,comb:2.1,diamonds:1.2,twister:3.7,lanes:2.5,bubbles:5.3,chevrons:9.1};
const LAYS=["dots","path","funnel","cross","pyramid","pillars","rings","zigzag","spinners","hourglass","scatter","stairs","orbit","comb","diamonds","twister","lanes","bubbles","chevrons"];
const stageName=L=>L===1?"Start":NAMES[1+((L-2)%(NAMES.length-1))]+(L>NAMES.length?" "+["II","III","IV","V"][Math.floor((L-2)/(NAMES.length-1))-1]:"");
// gates go into open space (never through obstacles) where balls actually fall
function ptSeg(px,py,s){ const dx=s.x2-s.x1, dy=s.y2-s.y1, t=Math.max(0,Math.min(1,((px-s.x1)*dx+(py-s.y1)*dy)/(dx*dx+dy*dy))); return Math.hypot(px-(s.x1+dx*t),py-(s.y1+dy*t)); }
// rotating shapes: bar, cross (2 bars) or triangle; sliders: horizontal beams moving left/right
function spinEdges(s){ const L=s.len, a=s.a;
  if(s.kind==="tri"){ const v=[0,1,2].map(i=>[s.x+Math.cos(a+i*2.0944)*L,s.y+Math.sin(a+i*2.0944)*L]); return [0,1,2].map(i=>({x1:v[i][0],y1:v[i][1],x2:v[(i+1)%3][0],y2:v[(i+1)%3][1],w:7})); }
  const e=[{x1:s.x-Math.cos(a)*L,y1:s.y-Math.sin(a)*L,x2:s.x+Math.cos(a)*L,y2:s.y+Math.sin(a)*L,w:8}];
  if(s.kind==="cross") e.push({x1:s.x+Math.sin(a)*L,y1:s.y-Math.cos(a)*L,x2:s.x-Math.sin(a)*L,y2:s.y+Math.cos(a)*L,w:8});
  return e; }
// gates slide to one side, wait 0.5 s, slide back, wait 0.5 s …
function moveGate(q,t){ const d=q.xb-q.xa, run=d/q.sp, per=2*run+1; let u=(t+q.ph)%per, x;
  if(u<run) x=q.xa+d*(u/run); else if(u<run+0.5) x=q.xb; else if(u<2*run+0.5) x=q.xb-d*((u-run-0.5)/run); else x=q.xa;
  q.x1=x; q.x2=x+q.w; }
function sliderSeg(s){ return {x1:s.x-s.len,y1:s.y,x2:s.x+s.len,y2:s.y,w:8}; }
function moveSlider(s,t){ s.x=s.x0+Math.sin(t*s.sp+s.ph)*s.amp; s.vx=Math.cos(t*s.sp+s.ph)*s.sp*s.amp; }
// is a round area free of everything already placed?
function areaFree(b,x,y,rad){
  if(x-rad<28||x+rad>W-28||y-rad<70||y+rad>H-40) return false;
  for(const g of b.gates||[]) if(Math.abs(g.y-y)<rad+22&&x+rad>g.xa-10&&x-rad<g.xb+g.w+10) return false;
  for(const c of b.circ) if(Math.hypot(c.x-x,c.y-y)<c.r+rad+30) return false;
  for(const m of b.movers) if(Math.abs(m.cy-y)<m.ay+m.r+rad+30&&Math.abs(m.cx-x)<m.ax+m.r+rad+30) return false;
  for(const sg of b.segs) if(ptSeg(x,y,sg)<rad+30) return false;
  for(const s of b.spins) if(Math.hypot(s.x-x,s.y-y)<s.len+rad+30) return false;
  for(const s of b.sliders) if(Math.abs(s.y-y)<rad+34&&Math.abs(s.x0-x)<s.amp+s.len+rad+30) return false;
  return true; }
function gateFree(b,y,x1,x2){
  for(const s of b.sliders) if(Math.abs(s.y-y)<20&&s.x0+s.amp+s.len+8>x1&&s.x0-s.amp-s.len-8<x2) return false;
  for(let x=x1;x<=x2;x+=5){ for(const sg of b.segs) if(ptSeg(x,y,sg)<16) return false; }
  for(const c of b.circ) if(Math.abs(c.y-y)<c.r+14&&c.x+c.r+8>x1&&c.x-c.r-8<x2) return false;
  for(const s of b.spins) if(Math.abs(s.y-y)<s.len+14&&s.x+s.len+8>x1&&s.x-s.len-8<x2) return false;
  for(const m of b.movers) if(Math.abs(m.cy-y)<m.ay+m.r+14&&m.cx+m.ax+m.r+8>x1&&m.cx-m.ax-m.r-8<x2) return false;
  return true; }
function placeGates(b,ng,wdt,r){
  // trace some balls through the stage to learn where they fall
  const CW=10, CH=10, cols=Math.ceil(W/CW), rows=Math.ceil(H/CH), dens=new Float32Array(cols*rows);
  let hitsSum=0; for(const s of b.sliders){ s.x=s.x0; s.vx=0; } const sp0=b.L===1?b.spawn:[20,W-20]; const saveMov=b.movers.map(m=>{ m.x=m.cx; m.y=m.cy; m.vx=m.vy=0; return m; });
  for(let n=0;n<24;n++){ const q={x:sp0[0]+(n+0.5)/24*(sp0[1]-sp0[0]),y:-8,vx:(r()-.5)*20,vy:30,r:6.5};
    for(let t=0;t<8&&q.y<H;t+=1/120){ const dt=1/120; q.vy+=G0*dt; q.x+=q.vx*dt; q.y+=q.vy*dt;

  function hiss(t,freq,q,vol,len){ const n=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); n.buffer=noise(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=q; env(g,t,0.003,vol,len); n.connect(f).connect(g).connect(mg); n.start(t,Math.random()*0.5); n.stop(t+len+0.05); }
  function schedule(){ while(nextT<AC.currentTime+0.35){ const t=nextT+(step%2?SPB*0.18:0); // swing
      const P=PROGS[prog], ch=P[bar%4];
      if(step===0){ ch.forEach((m,i)=>keys(m,t+i*0.025,SPB*7,0.045)); bass(ch[0],t,SPB*3); }
      if(step===5) bass(ch[0]+(Math.random()<0.5?7:12),t,SPB*2);
      if(step===0||step===5&&Math.random()<0.6||step===3&&Math.random()<0.25) kick(t);
      if(step===2||step===6) hiss(t,1800,0.8,0.16,0.18);
      if(step%2===0||Math.random()<0.3) hiss(t,8000,1.2,step%2?0.025:0.045,0.05);
      if(step%2===0&&Math.random()<0.28) keys(PENTA[(Math.random()*PENTA.length)|0],t,SPB*3,0.035);
      step++; if(step>=8){ step=0; bar++; if(bar%8===0) prog=(Math.random()*PROGS.length)|0; } nextT+=SPB; } }
  function startCrackle(){ const n=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); const len=AC.sampleRate*2, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()<0.0007?(Math.random()*2-1):(Math.random()*2-1)*0.012; n.buffer=b; n.loop=true; f.type="highpass"; f.frequency.value=1500; g.gain.value=0.25; n.connect(f).connect(g).connect(mg); n.start(); crackle=n; }

    get on(){ return on; },
    start(){ if(on) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
      mg=AC.createGain(); mg.gain.setValueAtTime(0.0001,AC.currentTime); mg.gain.linearRampToValueAtTime(0.8,AC.currentTime+1.5); mg.connect(AC.destination);
      lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1400; lp.Q.value=0.6; lp.connect(mg);
      nextT=AC.currentTime+0.1; step=0; startCrackle(); timer=setInterval(schedule,90); on=true; }catch(e){} },
    stop(){ if(!on) return; on=false; clearInterval(timer); try{ const g=mg; g.gain.setTargetAtTime(0.0001,AC.currentTime,0.2); setTimeout(()=>{ try{ g.disconnect(); crackle&&crackle.stop(); }catch(e){} },900); }catch(e){} }
  }; })();

    ctx.lineWidth=8; for(const sl of s.sliders){ ctx.beginPath(); ctx.moveTo(sl.x-sl.len,sl.y); ctx.lineTo(sl.x+sl.len,sl.y); ctx.stroke(); ctx.fillStyle="rgba(20,21,24,.35)"; ctx.fillRect(sl.x0-sl.amp-sl.len,sl.y-1,2*(sl.amp+sl.len),2); }
    ctx.globalAlpha=1; ctx.textAlign="left"; ctx.font="900 12px system-ui"; ctx.fillStyle=locked?"#777":"#ffd400"; ctx.fillText(L+" · "+s.name.toUpperCase(),8,oy+18);
    if(!locked){ ctx.font="700 10px system-ui"; ctx.fillStyle="#9aa0aa"; ctx.fillText("+"+(hitPct(L)*100).toFixed(0)+"% per bounce",8,oy+32); }
    if(locked){ ctx.textAlign="center"; ctx.fillStyle="rgba(20,21,24,.85)"; const yy=oy+HS/2-40; ctx.beginPath(); ctx.roundRect?ctx.roundRect(60,yy,W-120,80,14):ctx.rect(60,yy,W-120,80); ctx.fill();
      ctx.font="900 18px system-ui"; ctx.fillStyle=L===S.unlocked+1&&S.coins>=priceOf(L)?"#ffd400":"#ddd"; ctx.fillText("🔒 Stage "+L,W/2,yy+32); ctx.font="800 14px system-ui"; ctx.fillStyle="#bbb"; ctx.fillText(L===S.unlocked+1?"Unlock for "+money(priceOf(L)):money(priceOf(L)),W/2,yy+56); }

function buy(id,quiet){

  if(t==="u"){ const c=costUnlock(k); if(S.coins>=c&&S.unlocked>=GATE[k]&&!S.rate[k]){ S.coins-=c; S.rate[k]=1; n=1; } }
  if(t==="r") run(()=>S.rate[k],v=>S.rate[k]=v,RMAX,l=>costRate(k,l));

  q("#rst").onclick=()=>popup(`<h1>Start over?</h1><p>Money, upgrades, stages, perks and cards are reset.</p><button class="btn" id="yes">Yes, start over</button><button class="btn g" id="no">Cancel</button>`,{yes:()=>{ const keep={sound:S.sound,music:S.music,haptic:S.haptic,seen:1}; S=Object.assign(fresh(),keep); balls=[]; goTo(1); uiList(true); uiTop(); save(true); }}); }
let apkUpdate=null;
window.ascendApkUpdate=v=>{ apkUpdate=v; floatText("📦 Update ready – see ☰",innerWidth/2-90,90); };
window.ascendToast=m=>floatText(m,innerWidth/2-80,90);

/* ================= boot ================= */
buildTower(); uiTop(); uiList(true); resize();
try{ new ResizeObserver(()=>resize()).observe($("wrap")); }catch(e){}
syncPanel();
document.querySelectorAll("#tabs .t").forEach(x=>x.classList.toggle("on",x.dataset.t===S.tab)); document.querySelectorAll("#modes [data-m]").forEach(x=>x.classList.toggle("on",x.dataset.m===S.mode));
// players of the first version keep their progress: stages they reached become owned stages
try{ const old=JSON.parse(localStorage.getItem("zen_state_v2")); if(old&&!localStorage.getItem(LS)){ S.coins=old.coins||0; S.rate=old.rate||S.rate; S.val=old.val||S.val; S.perks=old.perks||{}; S.cards=old.cards||{}; S.copies=old.copies||{}; S.unlocked=Math.max(1,Math.min(NST,(old.max||1)-0)); S.seen=1; S.total=old.total||0; save(true); uiList(true); uiTop(); } }catch(e){}
(function(){ const away=(Date.now()-(S.last||Date.now()))/1000; if(away>60&&S.avg>0){ const secs=Math.min(away,4*3600), gain=S.avg*secs*0.5*(1+0.25*P("offline")); pay(gain); save(true);
  setTimeout(()=>{ if(!document.querySelector(".pop")) popup(`<div style="font-size:38px">🌙</div><h1>Welcome back</h1><p>While you were away (${Math.floor(secs/3600)}h ${Math.floor(secs%3600/60)}m) you earned</p><p style="font-size:26px;font-weight:900;color:#ffd400;margin-top:8px">${money(gain)}</p><button class="btn" id="ok">Collect</button>`); },300); } })();
if(!S.seen){ S.seen=1; setTimeout(()=>popup(`<h1>Zen Drop</h1><p>All ${NST} stages are stacked in one tall tower – <b>scroll</b> to see them. Balls fall through every stage you own.<br><br><b>Every bounce</b> and every <b>yellow gate</b> makes a ball worth more. The more stages a ball falls through, the more it pays when it reaches ▼ COLLECT.<br><br>Unlock the next stage with money (yellow button) → you get a ⭐ perk and a 🃏 card.</p><button class="btn" id="ok">Start</button>`),300); }
if(S.pendPerk) setTimeout(()=>{ if(!document.querySelector(".pop")) choosePerk(); },800);
window.addEventListener("resize",resize);
window.addEventListener("pointerdown",()=>{ if(S.music&&!MUSIC.on) syncMusic(); },{capture:true});
document.addEventListener("visibilitychange",()=>{ syncMusic(); try{ if(AC){ document.hidden?AC.suspend():AC.resume(); } }catch(e){} if(document.hidden) save(true); else lastT=performance.now(); });
window.addEventListener("pagehide",()=>save(true));
let lastT=performance.now(), uiT=0;
function frame(t){ const dt=Math.min(0.05,(t-lastT)/1000); lastT=t; const n=dt>0.025?4:3; for(let i=0;i<n;i++) step(dt/n); render(); uiT+=dt; if(uiT>0.25){ uiT=0; uiTop(); uiList(); save(); } requestAnimationFrame(frame); }
requestAnimationFrame(frame);
/* test hooks */
const simOpts=()=>{ const o=[]; for(let k=0;k<TYPES.length;k++){ if(!S.rate[k]){ if(S.unlocked>=GATE[k]) o.push(["u"+k,costUnlock(k)]); break; } if(S.rate[k]<RMAX) o.push(["r"+k,costRate(k,S.rate[k])]); o.push(["v"+k,costVal(k,S.val[k])]); }
  for(let L=1;L<=S.unlocked;L++){ const st=stOf(L); if(st.o<OMAX) o.push(["o"+L,costObs(L,st.o)]); if(st.g<GMAX) o.push(["g"+L,costGate(L,st.g)]); } return o; };
function simBuy(){ for(let q=0;q<40;q++){ const o=simOpts().sort((a,b)=>a[1]-b[1])[0]; if(o&&S.coins>=o[1]) buy(o[0],true); else break; } }
window.__z={step,buildTower,unlockNext,goTo,MUSIC,get S(){return S;},get STG(){return STG;},get balls(){return balls;},get PRICES(){return PRICES;},setPrices:a=>{ PRICES=a; },
  // calibration: let a greedy player run tgt(L) seconds on L stages, the money earned becomes the price of stage L+1
  calib(N,tgt){ const dt=1/120, out=[0,150]; PRICES=PRICES.map((p,i)=>i<2?p:1e300); const m=S.mode; S.mode="1"; const t0=performance.now();
    for(let L=1;L<N;L++){ const T=tgt(L), c0=S.total; for(let t=0;t<T;t+=dt){ step(dt,true); if(((t*120)|0)%30===0) simBuy(); if(L===1&&S.coins>=150&&S.unlocked===1){} }
      const earned=S.total-c0, price=earned*0.8; out[L]=price; PRICES[L]=price; if(S.coins<price) S.coins=price; unlockNext(true);
      console.log("calib",L+1,price.toExponential(2),Math.round((performance.now()-t0)/1000)+"s",balls.length); }
    S.mode=m; return out; },
  play(seconds){ const dt=1/120; const m=S.mode; S.mode="1"; const times=[]; let last=0;
    for(let t=0;t<seconds;t+=dt){ step(dt,true); if(((t*120)|0)%30===0){ simBuy(); if(unlockNext(true)){ times.push([S.unlocked,Math.round((t-last)/6)/10]); last=t; } } }
    S.mode=m; return times; }};
})();
</script>
