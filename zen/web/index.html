<script>

const UNITS=["K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","Ud","Dd","Td","Qad","Qid","Sxd","Spd","Ocd","Nod","Vg"];

const bst=k=>Math.min(5,(S.bstar&&S.bstar[k])||0), valGrow=k=>1.3+0.02*k+0.03*bst(k), rateGrow=k=>1.5+0.02*k+0.03*bst(k), hardV=v=>v>100?Math.pow(1.001,(v-100)*(v-100)):1;

/* perks: pick 1 of 3 after every cleared stage */
const PERKS=[
 {id:"rate",ic:"⏩",name:"Faster drops",d:"All balls spawn 15% faster"},

function autoShares(){ const st=new Float64Array(NST+2), ty=new Float64Array(20); let tot=0; for(const a of stBk) for(let L=1;L<=S.unlocked;L++){ st[L]+=a[L]; tot+=a[L]; } for(const a of tyBk) for(let k=0;k<20;k++) ty[k]+=a[k]; if(!(tot>0)) return null; for(let L=1;L<=S.unlocked;L++) st[L]/=tot; let tt=0; for(let k=0;k<20;k++) tt+=ty[k]; if(tt>0) for(let k=0;k<20;k++) ty[k]/=tt; return {st,ty}; }
function autoGain(id,sh){ if(id==="next") return 1; const t=id[0], k=+id.slice(1);
  if(t==="u") return 1; if(t==="v"){ const l=S.val[k]; return (sh.ty[k]||0.001)*(0.2+((l+1)%MS_STEP===0&&msN(k)<MS_MAX?0.5:0)); }
  if(t==="r"){ const r=S.rate[k]; return (sh.ty[k]||0.001)*(spawnTime(r)/spawnTime(r+1)-1); }
  if(t==="g") return (sh.st[k]||0.0005)*0.25/(1+0.25*stOf(k).g); if(t==="o") return (sh.st[k]||0.0005)*0.03+0.0005; return 0.005; }
function autoBuy(dt){ if(!S.auto) return; autoT+=dt; if(autoT<0.5) return; autoT=0;

  let c=o[0]; { const sh=autoShares(); if(sh){ let best=-1; for(const x of o){ if(x[1]>S.coins) break; const v=autoGain(x[0],sh)/Math.max(x[1],1e-300); if(v>best){ best=v; c=x; } } } }

hen they run and pay ×1.5.</p><p style="text-align:left;margin-top:10px">• 🔥 Gate combo: a ball that hits the middle of gates in a row pays ×1.1, ×1.2 … up to ×2 (gold trail).</p><p style="text-align:left;margin-top:10px">• 🔧 WORKSHOP tab: machine upgrades (faster spinners, slick ramps, wider buckets, quicker cups, longer hatches, wider sweet spot).</p><p style="text-align:left;margin-top:10px">• The bar on the right edge is a map of your tower – drag it to fly anywhere. Red = pile-up, orange = hot stage.</p><p style="text-align:left;margin-top:10px">• 🔥 Every day one of your stages is the hot stage: its gates pay ×5 until midnight.</p><p style="text-align:left;margin-top:10px">• ✨ Copies of level-10 cards become card dust – 5 dust buys an Epic-or-better card.</p><p style="text-align:left;margin-top:10px">• 🎡 Ferris Wheel stages (15, 25, 35 …): buckets on a slow wheel catch balls at the top and pour them out.</p><p style="text-align:left;margin-top:10px">• 🏆 Trophies are earned automatically for milestones; each one adds +4% to all ball values forever.</p><p style="text-align:left;margin-top:10px">• Shrink makes a stage's obstacles smaller so balls flow faster.</p><button class="btn" id="ok">Got it</button>`);
