// in-world tips like the boxes in the video

  function kick(t){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(42,t+0.12); env(g,t,0.003,0.5,0.25); o.connect(g).connect(mg); o.start(t); o.stop(t+0.35); }
  function hiss(t,freq,q,vol,len){ const n=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); n.buffer=noise(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=q; env(g,t,0.003,vol,len); n.connect(f).connect(g).connect(mg); n.start(t,Math.random()*0.5); n.stop(t+len+0.05); }
  function schedule(){ while(nextT<AC.currentTime+0.35){ const t=nextT+(step%2?SPB*0.18:0); // swing
      const P=PROGS[prog], ch=P[bar%4];
      if(step===0){ ch.forEach((m,i)=>keys(m,t+i*0.025,SPB*7,0.045)); bass(ch[0],t,SPB*3); }
      if(step===5) bass(ch[0]+(Math.random()<0.5?7:12),t,SPB*2);
      if(step===0||step===5&&Math.random()<0.6||step===3&&Math.random()<0.25) kick(t);
      if(step===2||step===6) hiss(t,1800,0.8,0.16,0.18);
      if(step%2===0||Math.random()<0.3) hiss(t,8000,1.2,step%2?0.025:0.045,0.05);
      if(step%2===0&&Math.random()<0.28) keys(PENTA[(Math.random()*PENTA.length)|0],t,SPB*3,0.035);
      step++; if(step>=8){ step=0; bar++; if(bar%8===0) prog=(Math.random()*PROGS.length)|0; } nextT+=SPB; } }
  function startCrackle(){ const n=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); const len=AC.sampleRate*2, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);

  return {
    get on(){ return on; },
    start(){ if(on) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
      mg=AC.createGain(); mg.gain.setValueAtTime(0.0001,AC.currentTime); mg.gain.linearRampToValueAtTime(0.8,AC.currentTime+1.5); mg.connect(AC.destination);
      lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1400; lp.Q.value=0.6; lp.connect(mg);
      nextT=AC.currentTime+0.1; step=0; startCrackle(); timer=setInterval(schedule,90); on=true; }catch(e){} },
    stop(){ if(!on) return; on=false; clearInterval(timer); try{ const g=mg; g.gain.setTargetAtTime(0.0001,AC.currentTime,0.2); setTimeout(()=>{ try{ g.disconnect(); crackle&&crackle.stop(); }catch(e){} },900); }catch(e){} }
  }; })();

const cv=$("cv"), ctx=cv.getContext("2d"); let sc=1, viewH=SCR, cam=+S.cam||0, camV=0, dragging=false;

      ctx.fillStyle="#141518"; ctx.fillRect(q.x1-3,y0-2,6,hgt+4); ctx.fillRect(q.x2-3,y0-2,6,hgt+4); }
    // tips (dark boxes like in the video)

    ctx.globalAlpha=1; ctx.textAlign="left"; ctx.font="900 12px system-ui"; ctx.fillStyle=locked?"#888":"#ffd400"; ctx.fillText(L+" · "+s.name.toUpperCase(),8,oy+18);
    if(locked){ ctx.textAlign="center"; ctx.fillStyle="rgba(20,21,24,.88)"; const yy=oy+60; roundBox(50,yy,W-100,84,14); ctx.fill();
      ctx.font="900 18px system-ui"; ctx.fillStyle=L===S.unlocked+1&&S.coins>=priceOf(L)?"#ffd400":"#ddd"; ctx.fillText("🔒 Stage "+L,W/2,yy+32); ctx.font="800 13px system-ui"; ctx.fillStyle="#bbb"; ctx.fillText(L===S.unlocked+1?"Unlock for "+money(priceOf(L)):money(priceOf(L)),W/2,yy+54); ctx.font="700 10px system-ui"; ctx.fillText("all gates pay ×1.35 more",W/2,yy+72); }
  }

  { const y0=cam-10, y1=cam+viewH+10;

$("menuB").onclick=openMenu;
function openMenu(){ const L=$("layer");
  L.innerHTML=`<div class="menu"><div class="sh"><h2>Zen Drop</h2><p style="color:#9aa0aa;font-size:12px;margin-top:4px">${NST} stages stacked on top of each other. Balls fall through every stage you own – scroll the board to see them all. Unlock the next stage with money.</p>
    <div class="srow"><span>🎵 Lo-fi music</span><button class="tg ${S.music?"on":""}" id="tm">${S.music?"On":"Off"}</button></div>
    <div class="srow"><span>🔔 Sounds</span><button class="tg ${S.sound?"on":""}" id="ts">${S.sound?"On":"Off"}</button></div>
    <div class="srow"><span>📳 Vibration</span><button class="tg ${S.haptic?"on":""}" id="th">${S.haptic?"On":"Off"}</button></div>
    <div class="srow"><span>ℹ️ How to play</span><button class="tg" id="info">Open</button></div>
    <div class="srow"><span>Total earned</span><b>${money(S.total)}</b></div>
    <div class="srow"><span>Version</span><span style="color:#888">app ${NATIVE&&NATIVE.apkVersion?NATIVE.apkVersion():"web"} · v${ZEN_WEB_VERSION}${NATIVE&&NATIVE.checkUpdates?` · <button class="tg" id="upd">Check updates</button>`:""}</span></div>
    ${apkUpdate&&NATIVE&&NATIVE.installApk?`<button class="btn" id="inst">📦 Install app update</button>`:""}
    <button class="btn g" id="rst">Start over</button><button class="btn" id="cl">Close</button></div></div>`;
  const q=s=>L.querySelector(s);
  q("#cl").onclick=()=>{ L.innerHTML=""; };
  q("#info").onclick=()=>popup(`<h1>ℹ️ How to play</h1>${TIPS.map(t=>`<p style="text-align:left;margin-top:10px">• ${t[2]}</p>`).join("")}<p style="text-align:left;margin-top:10px">• Shrink makes a stage's obstacles smaller so balls flow faster.</p><button class="btn" id="ok">Got it</button>`);
  q("#tm").onclick=()=>{ S.music=!S.music; syncMusic(); save(true); uiTop(); openMenu(); };
  q("#ts").onclick=()=>{ S.sound=!S.sound; save(true); uiTop(); openMenu(); };
  q("#th").onclick=()=>{ S.haptic=!S.haptic; save(true); if(S.haptic) buzz(); openMenu(); };
  q("#upd")&&(q("#upd").onclick=()=>{ try{ NATIVE.checkUpdates(); }catch(e){} });
  q("#inst")&&(q("#inst").onclick=()=>{ try{ NATIVE.installApk(); }catch(e){} });
  q("#rst").onclick=()=>popup(`<h1>Start over?</h1><p>Money, upgrades, stages, perks and cards are reset.</p><button class="btn" id="yes">Yes, start over</button><button class="btn g" id="no">Cancel</button>`,{yes:()=>{ const keep={sound:S.sound,music:S.music,haptic:S.haptic,seen:1}; S=Object.assign(fresh(),keep); balls=[]; goTo(1); uiList(true); uiTop(); save(true); }}); }
let apkUpdate=null;
window.ascendApkUpdate=v=>{ apkUpdate=v; floatText("📦 Update ready – see ☰",innerWidth/2-90,90); };
window.ascendToast=m=>floatText(m,innerWidth/2-80,90);

/* ================= boot ================= */
getStage(1); uiTop(); uiList(true); resize();
try{ new ResizeObserver(()=>resize()).observe($("wrap")); }catch(e){}
syncPanel(); syncAuto();
document.querySelectorAll("#tabs .t").forEach(x=>x.classList.toggle("on",x.dataset.t===S.tab)); document.querySelectorAll("#modes [data-m]").forEach(x=>x.classList.toggle("on",x.dataset.m===S.mode));
// players of the first version keep their progress: stages they reached become owned stages
try{ const old=JSON.parse(localStorage.getItem("zen_state_v2")); if(old&&!localStorage.getItem(LS)){ S.coins=old.coins||0; S.rate=old.rate||S.rate; S.val=old.val||S.val; S.perks=old.perks||{}; S.cards=old.cards||{}; S.copies=old.copies||{}; S.unlocked=Math.max(1,Math.min(NST,(old.max||1)-0)); S.seen=1; S.total=old.total||0; save(true); uiList(true); uiTop(); } }catch(e){}
(function(){ const away=(Date.now()-(S.last||Date.now()))/1000; if(away>60&&S.avg>0){ const secs=Math.min(away,4*3600), gain=S.avg*secs*0.5*(1+0.25*P("offline")); pay(gain); save(true);
  setTimeout(()=>{ if(!document.querySelector(".pop")) popup(`<div style="font-size:38px">🌙</div><h1>Welcome back</h1><p>While you were away (${Math.floor(secs/3600)}h ${Math.floor(secs%3600/60)}m) you earned</p><p style="font-size:26px;font-weight:900;color:#ffd400;margin-top:8px">${money(gain)}</p><button class="btn" id="ok">Collect</button>`); },300); } })();
if(!S.seen){ S.seen=1; setTimeout(()=>popup(`<h1>Zen Drop</h1><p>All ${NST} stages are stacked in one tall tower – <b>scroll</b> to see them. Balls fall through every stage you own.<br><br><b>Every bounce</b> and every <b>yellow gate</b> makes a ball worth more. The more stages a ball falls through, the more it pays when it reaches ▼ COLLECT.<br><br>Unlock the next stage with money (yellow button) → you get a ⭐ perk and a 🃏 card.</p><button class="btn" id="ok">Start</button>`),300); }
if(S.pendPerk) setTimeout(()=>{ if(!document.querySelector(".pop")) choosePerk(); },800);
window.addEventListener("resize",resize);
window.addEventListener("pointerdown",()=>{ if(S.music&&!MUSIC.on) syncMusic(); },{capture:true});
document.addEventListener("visibilitychange",()=>{ syncMusic(); try{ if(AC){ document.hidden?AC.suspend():AC.resume(); } }catch(e){} if(document.hidden) save(true); else lastT=performance.now(); });
window.addEventListener("pagehide",()=>save(true));
let lastT=performance.now(), uiT=0;
function frame(t){ const dt=Math.min(0.05,(t-lastT)/1000); lastT=t; const n=(balls.length>2000?2:3)+(dt>0.025?1:0); for(let i=0;i<n;i++) step(dt/n); autoBuy(dt); render(); uiT+=dt; if(uiT>0.25){ uiT=0; uiTop(); uiList(); save(); } requestAnimationFrame(frame); }
requestAnimationFrame(frame);
/* test hooks */
const simOpts=()=>{ const o=[]; for(let k=0;k<TYPES.length;k++){ if(!S.rate[k]){ if(S.unlocked>=GATE[k]) o.push(["u"+k,costUnlock(k)]); break; } if(S.rate[k]<RMAX) o.push(["r"+k,costRate(k,S.rate[k])]); o.push(["v"+k,costVal(k,S.val[k])]); }
  for(let L=1;L<=S.unlocked;L++){ const st=stOf(L); if(st.o<OMAX) o.push(["o"+L,costObs(L,st.o)]); if(st.g<GMAX) o.push(["g"+L,costGate(L,st.g)]); } return o; };
function simBuy(){ for(let q=0;q<40;q++){ const o=simOpts().sort((a,b)=>a[1]-b[1])[0]; if(o&&S.coins>=o[1]) buy(o[0],true); else break; } }
window.__z={step,getStage,OY,stageAt,unlockNext,goTo,MUSIC,get S(){return S;},get STG(){return STG;},get balls(){return balls;},get PRICES(){return PRICES;},setPrices:a=>{ PRICES=a; },
  // calibration: let a greedy player run tgt(L) seconds on L stages, the money earned becomes the price of stage L+1
  calib(N,tgt){ const dt=1/120, out=[0,150]; PRICES=PRICES.map((p,i)=>i<2?p:1e300); const m=S.mode; S.mode="1"; const t0=performance.now();
    for(let L=1;L<N;L++){ const T=tgt(L), c0=S.total; for(let t=0;t<T;t+=dt){ step(dt,true); if(((t*120)|0)%30===0) simBuy(); if(L===1&&S.coins>=150&&S.unlocked===1){} }
      const earned=S.total-c0, price=earned*0.8; out[L]=price; PRICES[L]=price; if(S.coins<price) S.coins=price; unlockNext(true);
      console.log("calib",L+1,price.toExponential(2),Math.round((performance.now()-t0)/1000)+"s",balls.length); }
    S.mode=m; return out; },
  play(seconds){ const dt=1/120; const m=S.mode; S.mode="1"; const times=[]; let last=0;
    for(let t=0;t<seconds;t+=dt){ step(dt,true); if(((t*120)|0)%30===0){ simBuy(); if(unlockNext(true)){ times.push([S.unlocked,Math.round((t-last)/6)/10]); last=t; } } }
    S.mode=m; return times; }};
})();
</script>
