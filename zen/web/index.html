<script>
(function(){
"use strict";
const ZEN_WEB_VERSION = 46; // bump on every web update (the Android app reads this)
const NATIVE=(typeof window.AppNative!=="undefined")?window.AppNative:null;
const UNITS=["K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","Ud","Dd","Td","Qad","Qid","Sxd","Spd","Ocd","Nod","Vg"];
function fmt(n){ if(!isFinite(n)) return "∞"; if(n>=1e66) return n.toExponential(2).replace("e+","e"); if(n<1000) return (n<10&&n%1?n.toFixed(1):String(Math.floor(n))); let i=-1; while(n>=1000&&i<UNITS.length-1){ n/=1000; i++; } if(n>=1000) return n.toExponential(2)+UNITS[i]; return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+UNITS[i]; }
const $=id=>document.getElementById(id);
const money=n=>"$"+fmt(n);
const NST=150;

/* ================= balls & economy ================= */
const TYPES=[{name:"White",col:"#f4f4f4"},{name:"Cyan",col:"#3fd6e8"},{name:"Lime",col:"#a6e33b"},{name:"Orange",col:"#ff9f1c"},{name:"Purple",col:"#b86bff"},{name:"Red",col:"#ff4d5e"},{name:"Pink",col:"#ff7fd1"},{name:"Gold",col:"#ffd400"},{name:"Teal",col:"#1fbf9f"},{name:"Sky",col:"#7ec8ff"},{name:"Coral",col:"#ff8a65"},{name:"Mint",col:"#9dffb0"},{name:"Lavender",col:"#d6b3ff"},{name:"Magenta",col:"#ff3df0"},{name:"Bronze",col:"#c98a4b"},{name:"Silver",col:"#c9d1d9"},{name:"Crimson",col:"#d1124f"},{name:"Royal",col:"#5c6bff"},{name:"Olive",col:"#a3b83b"},{name:"Rainbow",col:"#ffffff",rainbow:1}];
const GATE=[1,3,8,15,25,40,60,85,90,95,100,106,112,118,124,130,136,142,148,150]; // stages you need to own to unlock each ball
const RMAX=25;

const costRate=(k,r)=>8*Math.pow(7,k)*Math.pow(1.5,r-1)*perkCost("ballCost");
const costVal=(k,v)=>10*Math.pow(7,k)*Math.pow(1.3,v-1)*perkCost("ballCost");

let PRICES=[0,149,1.92e+05,5.47e+08,2.62e+10,4.59e+11,6.23e+12,7.25e+13,2.1e+15,3.07e+16,3.3e+17,3.03e+18,2.47e+19,2.01e+20,1.53e+21,2.71e+22,2.94e+23,2.56e+24,1.96e+25,1.39e+26,9.67e+26,6.7e+27,4.56e+28,3.05e+29,1.98e+30,2.74e+31,2.47e+32,1.86e+33,1.28e+34,8.29e+34,5.33e+35,3.35e+36,2.04e+37,1.25e+38,7.74e+38,4.64e+39,2.82e+40,1.73e+41,1.04e+42,6.21e+42,7.77e+43,6.36e+44,4.49e+45,2.85e+46,1.74e+47,1.02e+48,5.97e+48,3.56e+49,2.11e+50,1.21e+51,7e+51,4.08e+52,2.3e+53,1.34e+54,7.73e+54,4.49e+55,2.59e+56,1.49e+57,8.57e+57,4.94e+58,5.58e+59,4.24e+60,2.84e+61,1.76e+62,1.03e+63,5.78e+63,3.33e+64,1.88e+65,1.05e+66,5.91e+66,3.32e+67,1.88e+68,1.04e+69,5.86e+69,3.26e+70,1.84e+71,1.02e+72,5.72e+72,3.2e+73,1.78e+74,9.86e+74,5.44e+75,2.99e+76,1.67e+77,9.18e+77,9.99e+78,7.38e+79,4.8e+80,2.88e+81,1.64e+82,1.85e+83,1.36e+84,8.62e+84,5.22e+85,3e+86,3.32e+87,2.4e+88,1.54e+89,9.24e+89,5.18e+90,5.79e+91,4.23e+92,2.71e+93,1.61e+94,9.06e+94,5.09e+95,5.61e+96,4.09e+97,2.62e+98,1.53e+99,8.6e+99,4.79e+100,5.33e+101,3.82e+102,2.43e+103,1.44e+104,8.13e+104,4.49e+105,5e+106,3.58e+107,2.28e+108,1.36e+109,7.68e+109,4.25e+110,4.69e+111,3.39e+112,2.12e+113,1.25e+114,7.03e+114,3.87e+115,4.33e+116,3.09e+117,1.93e+118,1.14e+119,6.38e+119,3.53e+120,3.96e+121,2.81e+122,1.76e+123,1.03e+124,5.8e+124,3.2e+125,3.59e+126,2.54e+127,1.6e+128,9.31e+128,5.24e+129,2.89e+130,3.26e+131,2.32e+132]; // price to unlock stage L (index L-1)
const priceOf=L=>PRICES[L-1];
const basis=L=>Math.max(50,PRICES[L-1]||50);
const OMAX=8, GMAX=10;
const costObs=(L,l)=>basis(L)*0.08*Math.pow(1.7,l)*perkCost("stageCost"); // shrink obstacles
const costGate=(L,l)=>basis(L)*0.12*Math.pow(1.9,l)*perkCost("stageCost");
/* perks: pick 1 of 3 after every cleared stage */
const PERKS=[
 {id:"rate",ic:"⏩",name:"Faster drops",d:"All balls spawn 15% faster"},
 {id:"value",ic:"💰",name:"Rich balls",d:"All ball values ×1.3"},
 {id:"ballCost",ic:"🏷️",name:"Ball discount",d:"Ball upgrades cost 12% less"},
 {id:"stageCost",ic:"🧱",name:"Builder",d:"Stage upgrades cost 20% less"},
 {id:"gates",ic:"🚪",name:"Rich gates",d:"All gate payouts +10%"},
 {id:"hits",ic:"⚫",name:"Small obstacles",d:"All obstacles 3% smaller"},
 {id:"offline",ic:"🌙",name:"Night shift",d:"Offline earnings +25%"},
 {id:"tap",ic:"👆",name:"Double tap",d:"Tapping drops one more ball"}];
const P=id=>(S.perks&&S.perks[id])||0;
function perkCost(id){ return Math.pow(id==="ballCost"?0.88:0.8,P(id)); }

/* cards: 1 card for every cleared stage, duplicates level them up */
const CARDS=[
 {id:"gm",r:1,ic:"🚪",name:"Gate Multipliers",d:l=>`Gates ×${(1+0.1*l).toFixed(1)}`},
 {id:"sr",r:1,ic:"⏱️",name:"Spawn Rate",d:l=>`Spawns +${5*l}%`},
 {id:"cr",r:1,ic:"🪙",name:"Coin Rain",d:l=>`All values +${10*l}%`},
 {id:"hh",r:2,ic:"🎯",name:"Lucky Middle",d:l=>`Middle gate sections +${10*l}%`},
 {id:"gw",r:2,ic:"🌀",name:"Gravity Well",d:l=>`Balls fall ${5*l}% slower`},
 {id:"wp",r:2,ic:"⚪",name:"White Power",d:l=>`White balls ×${1+l}`},
 {id:"td",r:3,ic:"👯",name:"Twin Drop",d:l=>`${4*l}% chance to drop 2 balls`},
 {id:"md",r:3,ic:"👑",name:"Midas",d:l=>`All values ×${(1+0.25*l).toFixed(2)}`},
 {id:"ff",r:3,ic:"🔥",name:"Fever",d:l=>`Taps last ${l} s longer`}];
const C=id=>(S.cards&&S.cards[id])||0; // level
const cardNeed=l=>l; // copies needed to go from level l to l+1


const valueMult=()=>(S.pm||1)*Math.pow(1.3,P("value"))*(1+0.1*C("cr"))*(1+0.25*C("md"));
const rateMult=()=>Math.pow(1.15,P("rate"))*(1+0.05*C("sr"));
const ballVal=k=>Math.pow(6,k)*Math.pow(1.2,S.val[k]-1)*valueMult()*(S.bpm[k]||1)*(k===0?1+C("wp"):1);
/* prestige: REBIRTH resets stages + ball upgrades for a permanent profit multiplier based on how far you got;
   BALL PRESTIGE resets one ball's value level for a permanent multiplier on that ball */
const REB_MIN=10;
const rebGain=()=>S.unlocked;                   // the button shows ×N → exactly N is added to your multiplier (stage 10 → +10, 25 → +25)
const mx=n=>n<1000?String(+n.toFixed(1)):fmt(n); // multiplier display: 17.8, not 17
const rebAfter=()=>(S.pm||1)+rebGain();
const bpNeed=k=>50+25*(S.bstar[k]||0);          // value level needed for the next ball prestige
const bpGain=k=>1+S.val[k]/25;                  // level 50 → ×3, 100 → ×5
const stOf=L=>{ S.st[L]=S.st[L]||{o:0,g:0}; return S.st[L]; };
// money is paid every time a ball passes a gate: ball value × section × stage gate level × (1.35 per unlocked stage)
const STAGE_MULT=1.35;
const worldMult=()=>Math.pow(STAGE_MULT,S.unlocked-1);
const gateBoost=L=>(1+0.25*stOf(L).g)*(1+0.1*P("gates"))*(1+0.1*C("gm"));
const shrinkOf=L=>(1-0.04*stOf(L).o)*Math.pow(0.97,P("hits"));

/* ================= state ================= */
const LS="zen_state_v3";
function fresh(){ return {ver:2,coins:0,unlocked:1,rate:[1].concat(Array(19).fill(0)),val:Array(20).fill(1),st:{},perks:{},cards:{},copies:{},pendPerk:0,newCards:0,mode:"1",tab:"balls",panelHidden:false,auto:false,sound:true,music:true,haptic:true,last:Date.now(),avg:0,total:0,seen:0,cam:0,pm:1,rebirths:0,best:1,bstar:Array(20).fill(0),bpm:Array(20).fill(1)}; }
let S; try{ S=Object.assign(fresh(),JSON.parse(localStorage.getItem(LS))||{}); }catch(e){ S=fresh(); }
while(S.rate.length<TYPES.length) S.rate.push(0); while(S.val.length<TYPES.length) S.val.push(1);
while(S.bstar.length<TYPES.length) S.bstar.push(0); while(S.bpm.length<TYPES.length) S.bpm.push(1);
if(!(S.pm>0)) S.pm=1; S.best=Math.max(S.best||1,S.unlocked||1);
if((S.ver||0)<2){ for(const k in S.st) S.st[k].o=0; S.ver=2; } // v2: "o" is now obstacle shrink (0..8)
let saveT=0; function save(force){ const n=Date.now(); if(!force&&n-saveT<3000) return; saveT=n; S.last=n; S.cam=cam; try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }

/* ================= the world: 150 tall stages built like the Zen Idle video ================= */
const W=360, SCR=620, G0=300, VMAX=300;
function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
function ptSeg(px,py,s){ const dx=s.x2-s.x1, dy=s.y2-s.y1, t=Math.max(0,Math.min(1,((px-s.x1)*dx+(py-s.y1)*dy)/(dx*dx+dy*dy))); return Math.hypot(px-(s.x1+dx*t),py-(s.y1+dy*t)); }
// themes seen in the video, each several screens tall
const THEMES=[
 {id:"dots",name:"Dots",scr:4},{id:"tri",name:"Triangles",scr:4},{id:"spikes",name:"Spikes",scr:2},{id:"shelves",name:"Shelves",scr:5},
 {id:"cups",name:"Cups",scr:3},{id:"green",name:"Green Dots",scr:4},{id:"diamonds",name:"Diamonds",scr:3},{id:"lanes",name:"Lanes",scr:7},
 {id:"stars",name:"Stars",scr:4},{id:"slants",name:"Slants",scr:5},{id:"trifield",name:"Triangle Field",scr:3},{id:"thin",name:"Ledges",scr:4},{id:"arrows",name:"Arrows",scr:4}];
const ROMAN=["","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
const themeOf=L=>THEMES[(L-1)%THEMES.length];
const variantOf=L=>Math.floor((L-1)/THEMES.length);

function spinEdges(s){ const L=s.len, a=s.a;
  if(s.kind==="fan"){ const o=[]; for(let i=0;i<s.n;i++){ const q=a+i*2*Math.PI/s.n; o.push({x1:s.x,y1:s.y,x2:s.x+Math.cos(q)*L,y2:s.y+Math.sin(q)*L,w:s.th}); } return o; }
  if(s.kind==="drum"){ const o=[], N=18, R=s.len; for(let i=0;i<N;i++){ if(i<3||(s.gaps===2&&i>=9&&i<12)) continue; const q0=s.a+i*2*Math.PI/N, q1=q0+2*Math.PI/N; o.push({x1:s.x+Math.cos(q0)*R,y1:s.y+Math.sin(q0)*R,x2:s.x+Math.cos(q1)*R,y2:s.y+Math.sin(q1)*R,w:s.th}); } return o; }
  if(s.kind==="wiper") return [{x1:s.x,y1:s.y,x2:s.x+Math.cos(a)*L,y2:s.y+Math.sin(a)*L,w:s.th}];
  if(s.kind==="xballs"||s.kind==="plus"){ const w=s.kind==="plus"?s.th:10; return [{x1:s.x-Math.cos(a)*L,y1:s.y-Math.sin(a)*L,x2:s.x+Math.cos(a)*L,y2:s.y+Math.sin(a)*L,w},{x1:s.x+Math.sin(a)*L,y1:s.y-Math.cos(a)*L,x2:s.x-Math.sin(a)*L,y2:s.y+Math.cos(a)*L,w}]; }
  return [{x1:s.x-Math.cos(a)*L,y1:s.y-Math.sin(a)*L,x2:s.x+Math.cos(a)*L,y2:s.y+Math.sin(a)*L,w:12}]; }
function spinBalls(s){ if(s.kind!=="xballs") return null; const L=s.len, a=s.a; return [0,1,2,3].map(i=>[s.x+Math.cos(a+i*Math.PI/2)*L,s.y+Math.sin(a+i*Math.PI/2)*L]); }
// gates: the middle section slides to one side, waits 0.5 s, slides back …
function moveGate(q,t){ const d=q.xb-q.xa, run=d/q.sp, per=2*run+1; let u=(t+q.ph)%per, x;
  if(u<run) x=q.xa+d*(u/run); else if(u<run+0.5) x=q.xb; else if(u<2*run+0.5) x=q.xb-d*((u-run-0.5)/run); else x=q.xa;
  q.x1=x; q.x2=x+q.w; }

(function(){ const away=(Date.now()-(S.last||Date.now()))/1000; if(away>60&&S.avg>0){ const secs=Math.min(away,4*3600), gain=S.avg*secs*0.5*(1+0.25*P("offline")); pay(gain); save(true);
  setTimeout(()=>{ if(!document.querySelector(".pop")) popup(`<div style="font-size:38px">🌙</div><h1>Welcome back</h1><p>While you were away (${Math.floor(secs/3600)}h ${Math.floor(secs%3600/60)}m) you earned</p><p style="font-size:26px;font-weight:900;color:#ffd400;margin-top:8px">${money(gain)}</p><button class="btn" id="ok">Collect</button>`); },300); } })();
if(!S.seen){ S.seen=1; setTimeout(()=>popup(`<h1>Zen Drop</h1><p>All ${NST} stages are stacked in one tall tower – <b>scroll</b> to see them. Balls fall through every stage you own.<br><br><b>Every bounce</b> and every <b>yellow gate</b> makes a ball worth more. The more stages a ball falls through, the more it pays when it reaches ▼ COLLECT.<br><br>Unlock the next stage with money (yellow button) → you get a ⭐ perk and a 🃏 card.</p><button class="btn" id="ok">Start</button>`),300); }

let lastT=performance.now(), uiT=0;
let workA=0, refI=1/60, perfT=0;
function tunePerf(dt,work){ if(dt>0.004&&dt<0.04) refI=Math.min(refI*1.002,dt); workA=workA*0.9+work*0.1; perfT+=dt; if(perfT<1) return; perfT=0;
  const target=Math.max(6.5,Math.min(13,refI*1000*0.8)), cap=S.perfCap||4000, n=balls.length+tankN;
  if(workA>target&&n>800&&n<=cap*1.02) S.perfCap=Math.max(800,Math.round(n*0.92)); /* only while at the cap: extra balls already on the map just drain away */
  else if(workA<target*0.7&&n>cap*0.9) S.perfCap=Math.min(100000,Math.round(cap*1.06)); }

const simOpts=()=>{ const o=[]; for(let k=0;k<TYPES.length;k++){ if(!S.rate[k]){ if(S.unlocked>=GATE[k]) o.push(["u"+k,costUnlock(k)]); break; } if(S.rate[k]<RMAX) o.push(["r"+k,costRate(k,S.rate[k])]); o.push(["v"+k,costVal(k,S.val[k])]); }

window.__z={step,getStage,OY,stageAt,setCam:y=>{ cam=y; camV=0; clampCam(); },unlockNext,goTo,MUSIC,get S(){return S;},get STG(){return STG;},get balls(){return balls;},get PRICES(){return PRICES;},setPrices:a=>{ PRICES=a; },
  // calibration: let a greedy player run tgt(L) seconds on L stages, the money earned becomes the price of stage L+1
  calib(N,tgt){ const dt=1/120, out=[0,150]; PRICES=PRICES.map((p,i)=>i<2?p:1e300); const m=S.mode; S.mode="1"; const t0=performance.now();

      console.log("calib",L+1,price.toExponential(2),Math.round((performance.now()-t0)/1000)+"s",balls.length); }

  play(seconds){ const dt=1/120; const m=S.mode; S.mode="1"; const times=[]; let last=0;
