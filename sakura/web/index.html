<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sakura Gate</title>
<style>
:root{--bg:#120d1f;--pn:#1e1633;--pn2:#2a2045;--ln:#3a2e5c;--tx:#f4eefc;--mu:#a99cc8;--pk:#ff7eb6;--gd:#ffd36b;--sr:#c58bff;--rr:#6fb7ff;--nn:#9aa3b5;--gr:#62e0a1;--rd:#ff5d73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% 0%,#2d1d4f 0%,#120d1f 70%)}
#top{display:flex;gap:4px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:rgba(0,0,0,.25)}
.cur{display:flex;align-items:center;justify-content:center;gap:3px;background:var(--pn);border:1px solid var(--ln);border-radius:20px;padding:3px 6px;font-weight:700;font-size:12px;white-space:nowrap;min-width:0;flex:1 1 auto}
#menuB{flex:none;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:3px 9px;font-size:16px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid #2c2347}
.mrow .btn{min-width:86px;padding:7px 10px}
#main{flex:1;overflow-y:auto;padding:10px 10px 90px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#160f28;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
#nav button{flex:1;background:none;padding:8px 0 7px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
#nav button b{font-size:21px;font-weight:400}
#nav button.on{color:var(--pk)}
.dot{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--rd)}
h2{margin:4px 2px 10px;font-size:18px}
h3{margin:14px 2px 8px;font-size:15px;color:var(--mu);font-weight:600}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.btn{background:linear-gradient(180deg,#ff8cc0,#e25596);border-radius:12px;padding:10px 14px;font-weight:800;box-shadow:0 3px 0 #9c2f63;text-align:center}
.btn.alt{background:linear-gradient(180deg,#8f7bd8,#5f4bb0);box-shadow:0 3px 0 #3b2c78}
.btn.gold{background:linear-gradient(180deg,#ffe08a,#f1a93a);color:#3a2300;box-shadow:0 3px 0 #a86a12}
.btn.gray{background:#3b3355;box-shadow:none;color:var(--mu)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.mu{color:var(--mu)} .sm{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.hc{position:relative;border-radius:12px;overflow:hidden;background:var(--pn2);border:2px solid var(--ln);aspect-ratio:5/6}
.hc svg{width:100%;height:100%;display:block}
.hc .lv{position:absolute;left:3px;bottom:2px;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
.hc .st{position:absolute;right:3px;top:1px;font-size:9px;color:var(--gd);text-shadow:0 1px 2px #000}
.hc .el{position:absolute;left:3px;top:2px;font-size:12px}
.hc.R{border-color:#8d96aa} .hc.B{border-color:#62e0a1} .hc.E{border-color:var(--rr)} .hc.SR{border-color:var(--sr)} .hc.SSR{border-color:var(--gd);box-shadow:0 0 10px rgba(255,211,107,.35)} .hc.SSS{border-color:#ff5d8f;box-shadow:0 0 12px rgba(255,93,143,.55),0 0 4px #fff inset}
.hc .tier{position:absolute;right:3px;bottom:2px;font-size:9px;font-weight:900;border-radius:5px;padding:0 3px;background:#000a}
.hc.lock{filter:grayscale(1) brightness(.45)}
.hc .inT{position:absolute;right:3px;bottom:2px;font-size:10px;background:var(--pk);border-radius:6px;padding:0 4px;font-weight:800}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800}
.tR{background:#2e3342;color:#b9c1d4} .tB{background:#173d2c;color:#62e0a1} .tE{background:#1d3b63;color:var(--rr)} .tSSS{background:linear-gradient(90deg,#ff5d8f,#ffd36b,#6fb7ff);color:#1a0d24} .tGR{background:#1d3b63;color:var(--rr)} .tSR{background:#3b2361;color:var(--sr)} .tSSR{background:#5a4512;color:var(--gd)} .tN{background:#33384a;color:var(--nn)}
.bar{height:7px;background:#0c0816;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gr)}
#layer:empty{display:none}
#layer{position:fixed;inset:0;z-index:20;background:rgba(6,3,14,.82);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--pn);border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
.x{float:right;background:var(--pn2);border-radius:9px;padding:3px 10px;font-size:16px}
.stat{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #2c2347;font-size:13px}
.gi{display:flex;align-items:center;gap:8px;background:var(--pn2);border-radius:10px;padding:7px 9px;margin-bottom:6px;border-left:4px solid var(--nn)}
.gi.R{border-left-color:var(--rr)} .gi.SR{border-left-color:var(--sr)} .gi.SSR{border-left-color:var(--gd)}
.gico{font-size:22px;width:30px;text-align:center}
.seg{display:flex;background:var(--pn2);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;background:none;border-radius:8px;padding:6px;color:var(--mu);font-weight:700;font-size:12px}
.seg button.on{background:var(--ln);color:var(--tx)}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000c;border:1px solid var(--ln);border-radius:12px;padding:8px 14px;z-index:60;font-weight:700;pointer-events:none;transition:opacity .3s;opacity:0;max-width:90%;text-align:center}
/* battle */
#bt{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:linear-gradient(#1b2340,#3a2550 55%,#1a1226)}
#bt .bg{position:absolute;inset:0;opacity:.5;pointer-events:none}
#btTop{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 6px;position:relative;z-index:2}
#foes{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;padding:6px;position:relative;z-index:2}
.foe{width:31%;max-width:150px;position:relative;text-align:center;transition:transform .15s,opacity .4s}
.foe svg{width:100%;height:auto;display:block}
.foe .hp{height:6px;background:#0008;border-radius:4px;overflow:hidden;margin:0 8%}
.foe .hp i{display:block;height:100%;background:var(--rd);transition:width .2s}
.foe .nm{font-size:11px;color:#ddd}
.foe.dead{opacity:0;transform:scale(.6)}
.foe.boss{width:62%;max-width:260px}
.foe.tgt::after{content:"▼";position:absolute;top:-4px;left:50%;transform:translateX(-50%);color:var(--pk);font-size:14px}
#team{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px calc(10px + env(safe-area-inset-bottom));position:relative;z-index:2}
.tm{position:relative;background:#0007;border-radius:12px;padding:4px;border:2px solid #fff2;transition:transform .15s}
.tm .pt{border-radius:9px;overflow:hidden;aspect-ratio:1/1;background:#0005}
.tm .pt svg{width:100%;height:100%;display:block}
.tm .hp,.tm .en,.tm .at{height:5px;border-radius:3px;background:#0009;margin-top:3px;overflow:hidden}
.tm .hp i{display:block;height:100%;background:var(--gr);transition:width .2s}
.tm .en i{display:block;height:100%;background:var(--pk)}
.tm .at i{display:block;height:100%;background:#7fd3ff}
.tm .sk{position:absolute;inset:0;border-radius:10px;display:none;align-items:center;justify-content:center;background:rgba(255,126,182,.25);font-weight:900;font-size:12px;text-shadow:0 1px 3px #000;animation:pulse 1s infinite}
.tm.ready .sk{display:flex}
.tm.dead{filter:grayscale(1) brightness(.4)}
.tm.act,.foe.act{transform:translateY(-8px)}
.tm .shd{position:absolute;top:2px;right:4px;font-size:11px}
@keyframes pulse{50%{background:rgba(255,126,182,.45)}}
.fx{position:fixed;z-index:40;font-weight:900;pointer-events:none;text-shadow:0 2px 3px #000,0 0 2px #000;animation:up 1s forwards;font-size:18px}
.fx.crit{color:var(--gd);font-size:23px} .fx.heal{color:var(--gr)} .fx.weak{color:#ff9f43}
@keyframes up{to{transform:translateY(-46px);opacity:0}}
.shake{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#btLog{position:relative;z-index:2;text-align:center;font-size:12px;color:#ffd9ea;min-height:17px;padding:0 10px}
.sbtn{background:#0008;border:1px solid #fff3;border-radius:9px;padding:4px 9px;font-weight:800;font-size:12px}
.sbtn.on{background:var(--pk);color:#fff}
/* story */
#story{position:fixed;inset:0;z-index:50;background:linear-gradient(#0b0717,#241640);display:flex;flex-direction:column;justify-content:flex-end}
#story .por{flex:1;display:flex;align-items:flex-end;justify-content:center}
#story .por svg{height:min(52vh,420px);width:auto;filter:drop-shadow(0 0 20px #ff7eb655)}
#story .box{background:#1e1633f2;border-top:2px solid var(--pk);padding:14px 16px calc(18px + env(safe-area-inset-bottom));min-height:150px}
#story .who{font-weight:900;color:var(--pk);margin-bottom:6px}
#story .txt{font-size:15px;line-height:1.5}
#story .skip{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px}
/* summon */
.banner{border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(135deg,#ff7eb6 0%,#7b4fd6 60%,#2b1b54 100%);padding:14px;min-height:190px;margin-bottom:10px}
.banner .feat{position:absolute;right:-10px;bottom:0;width:58%}
.banner .feat svg{width:100%;height:auto;display:block}
#pull{position:fixed;inset:0;z-index:55;background:radial-gradient(circle,#3b1f63,#0b0717);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:480px}
.pgrid .hc{animation:pop .45s backwards}
@keyframes pop{from{transform:scale(.2) rotate(-10deg);opacity:0}}
.gate{width:160px;height:200px;border-radius:80px 80px 10px 10px;border:6px solid var(--gd);box-shadow:0 0 50px var(--pk),inset 0 0 40px var(--pk);animation:glow 1.1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 90px var(--gd),inset 0 0 70px var(--gd)}}
.new{position:absolute;top:2px;left:50%;transform:translateX(-50%);background:var(--rd);font-size:9px;font-weight:900;border-radius:5px;padding:0 4px}
.stageGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.stg{background:var(--pn2);border-radius:12px;padding:8px 4px;text-align:center;border:1px solid var(--ln)}
.stg.boss{border-color:var(--rd)}
.stg.lock{opacity:.35}
.stg.now{border-color:var(--pk);box-shadow:0 0 0 2px #ff7eb655}
.stg .s{color:var(--gd);font-size:11px;letter-spacing:1px}
</style>
</head>
<body>

<script>

function seeded(s){ let h=2166136261; for(const c of String(s)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h+=0x6D2B79F5; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }

const CLS={
  blade:{n:"Swordswoman",i:"⚔️",hp:1.0,atk:1.15,def:1.0,spd:102,col:"#e8435f"},
  guard:{n:"Guardian",i:"🛡️",hp:1.45,atk:0.75,def:1.5,spd:92,col:"#5a7dd8"},

// rarity tiers, lowest → highest
const TIERS=["R","B","E","SR","SSR","SSS"];
const RAR={R:{m:1,st:1,shard:4,sk:1,c:"#8d96aa"},B:{m:1.08,st:1,shard:5,sk:1.05,c:"#62e0a1"},E:{m:1.18,st:2,shard:6,sk:1.1,c:"var(--rr)"},SR:{m:1.3,st:2,shard:8,sk:1.18,c:"var(--sr)"},SSR:{m:1.48,st:3,shard:15,sk:1.32,c:"var(--gd)"},SSS:{m:1.75,st:4,shard:25,sk:1.6,c:"#ff5d8f"}};
const tierIx=r=>TIERS.indexOf(r);
// look: [hair color, eye color, hair style, accessory]
const HEROES=[
 ["sakura","Sakura Amane","SR","light","blade","#ffb3d1","#e2557f","long","pin","A cheerful shrine swordswoman who found you at the shattered Sakura Gate.","Petal Iaigiri"],
 ["koharu","Koharu Haruno","R","wind","healer","#c9a46a","#5aa36b","bob","ribbon","Village miko who patches up everyone's scrapes – and your pride.","Spring Prayer"],
 ["natsu","Natsu Hiiragi","R","fire","guard","#c0392b","#f39c12","pony","band","Blacksmith's daughter. Carries a door as a shield. Literally.","Anvil Stance"],
 ["rin","Rin Kazehaya","SSR","wind","ninja","#2fb67c","#1b6b4a","pony","mask","The fastest kunoichi in Hinomoto. Never seen standing still.","Gale Thousand Cuts"],
 ["yuki","Yuki Shirogane","SSR","water","mage","#e9f4ff","#5aa9ff","long","snow","A quiet onmyoji whose talismans freeze rivers mid-flow.","Silver Frost Seal"],
 ["akane","Akane Homura","SSR","fire","blade","#ff4b3a","#ffb03a","twin","horns","Half-oni swordmaster with a temper as hot as her blade.","Crimson Lotus Slash"],
 ["hotaru","Hotaru Yozora","SSR","dark","archer","#3b2a6b","#c58bff","long","moon","Moon archer who only hunts after midnight.","Starfall Volley"],
 ["nozomi","Nozomi Hikari","SSR","light","healer","#ffe7a3","#ffb84d","bun","halo","High priestess of the Sun Shrine. Her prayers turn wounds into light.","Amaterasu's Grace"],
 ["ayame","Ayame Kurogane","SSR","dark","guard","#4a4a5e","#e2557f","bob","horns","Iron-clad gate warden. Has not lost a duel in 300 years.","Black Iron Bastion"],
 ["izumi","Izumi Mikage","SSR","water","ninja","#3a6fd8","#9fe6ff","twin","mask","Mist-walking spy, raised by river spirits.","Riptide Shadow Dance"],
 ["chiyo","Chiyo Inari","SSR","fire","mage","#ff9b42","#ffd36b","long","fox","Fox-eared shrine maiden of Inari. Plays with foxfire like candy.","Nine-Tail Foxfire"],

 ["tamaki","Tamaki Oniwa","R","dark","blade","#3b2a3a","#c0392b","pony","horns","Small oni girl, big club, bigger appetite.","Oni Club"],

 ["nanami","Nanami Umi","R","water","archer","#3fc1c9","#1b6b8a","pony","shell","Fisher-girl with a harpoon bow and endless patience.","Wave Shot"]
,
 ["kaguya","Kaguya Tsukiyomi","SSS","light","mage","#f5f0ff","#c58bff","long","moon","Moon princess who arrived in a stalk of bamboo – and never quite went home.","Moonlit Bamboo Seal"],
 ["tamamo","Tamamo Kuzunoha","SSS","fire","mage","#ffd36b","#ff4b3a","long","fox","The nine-tailed fox of legend, now fighting for the Gate she once mocked.","Nine Suns Foxfire"],
 ["benten","Benten Mizuchi","SSS","water","healer","#4db4ff","#9fe6ff","bun","dragon","Goddess of rivers and music. Her biwa song heals friends and drowns foes.","Divine Biwa Tide"],
 ["sakuya","Sakuya Konohana","SSS","wind","healer","#ffc2da","#5fdc8c","long","flower","Blossom goddess of the sacred mountain. Spring follows wherever she walks.","Thousand Blossom Spring"],
 ["tomoe","Tomoe Akagane","SSS","fire","blade","#2b2b3a","#ff4b3a","pony","band","Warrior of the old wars, returned through the Gate with her red iron blade.","Red Iron Onslaught"],
 ["raika","Raika Narukami","SSS","wind","ninja","#ffe066","#7fd3ff","twin","horns","Daughter of the thunder god. Strikes between two heartbeats.","Heavenly Thunder Drum"],
 ["kurozome","Kurozome Yomi","SSS","dark","mage","#1b1426","#ff4b3a","long","moon","The fallen Gate-keeper, redeemed. Her shadows remember every sin.","Gate of Yomi"],

function heroTheme(a){ const out=musicNode, D3=146.83, sixteenth=60/152/4; let step=0, next=a.currentTime+0.1;

function topBar(){ tickStam(); $("top").innerHTML=`<span class="cur">⚡ ${S.stam}/${STAM_MAX}</span><span class="cur">🪙 ${fmt(S.gold)}</span><span class="cur">💎 ${fmt(S.gems)}</span><span class="cur">📜 ${fmt(S.exp)}</span><button id="menuB">☰</button>`; $("menuB").onclick=menu; }

  $("nav").innerHTML=T.map(([k,i,n])=>`<button data-t="${k}" class="${tab===k?"on":""}"><b>${i}</b>${n}${(k==="quest"&&b.quest)||(k==="home"&&b.afk)?'<span class="dot"></span>':""}</button>`).join("");

/* ---------- home / story ---------- */
function stageInfo(i){ const c=Math.floor(i/SPC), s=i%SPC, ch=CH[c], boss=s===SPC-1; const P=Math.pow(1.047,i)*(1+c*0.04);
  const n=boss?1:(s<3?3:pick([3,3,4])); return {i,c,s,ch,boss,P,lvl:Math.round(1+i*0.85),cost:boss?10:6}; }
function vHome(m){ tickStam(); const cur=Math.min(cleared(),NST-1); const c=Math.floor(cur/SPC); sub.ch=sub.ch==null?c:sub.ch; const ch=CH[sub.ch]; const ap=afkPending();
  let h=`<div class="card" style="background:linear-gradient(135deg,#3a2350,#1e1633)"><div class="row"><div class="grow"><div style="font-weight:900;font-size:16px">🏯 Patrol rewards</div><div class="sm mu">Your heroines patrol cleared lands while you're away (max 12 h).</div><div class="sm" style="margin-top:4px">${Math.floor(ap.m/60)}h ${Math.floor(ap.m%60)}m · 🪙 ${fmt(ap.gold)} · 📜 ${fmt(ap.exp)}${ap.gems?` · 💎 ${ap.gems}`:""}</div></div><button class="btn gold" id="afk" ${ap.m<1?"disabled":""}>Collect</button></div></div>`;
  h+=`<div class="row" style="margin:6px 0 8px"><button class="btn gray" id="pc" ${sub.ch<=0?"disabled":""}>◀</button><div class="grow" style="text-align:center"><div style="font-weight:900">Chapter ${sub.ch+1}</div><div class="mu sm">${ch.n}</div></div><button class="btn gray" id="nc" ${sub.ch>=CH.length-1||sub.ch>=c?"disabled":""}>▶</button></div>`;
  h+=`<div class="row" style="margin-bottom:8px"><button class="btn alt grow" id="intro">📖 Story: Prologue</button>${chapterDone(sub.ch)?`<button class="btn alt grow" id="outro">📖 Epilogue</button>`:""}</div><div class="stageGrid">`;
  for(let s=0;s<SPC;s++){ const i=sub.ch*SPC+s, st=S.stars[i]||0, lock=i>cleared(), boss=s===SPC-1, info=stageInfo(i);
    h+=`<div class="stg ${boss?"boss":""} ${lock?"lock":""} ${i===cleared()?"now":""}" data-i="${i}"><div style="font-size:20px">${boss?"👹":"⛩️"}</div><b>${sub.ch+1}-${s+1}</b><div class="s">${lock?"🔒":"★".repeat(st)+"☆".repeat(3-st)}</div><div class="sm mu">Lv ${info.lvl}</div></div>`; }
  h+=`</div><h3>Abyss Tower</h3><div class="card row"><div class="grow"><b>🗼 Floor ${S.tower+1}</b><div class="sm mu">Endless climb, harder every floor. 💎 every floor, extra every 5th. ${cleared()<16?"Unlocks after Chapter 2.":"No stamina needed."}</div></div><button class="btn alt" id="tw" ${cleared()<16?"disabled":""}>Climb</button></div>
  <div class="card row"><div class="grow"><b>📋 Bounty Board</b><div class="sm mu">${(()=>{ ensureBounty(); const r=S.bnt.list.filter(b=>b.st&&!b.got&&Date.now()>=b.st+b.hrs*3600000).length, f=S.bnt.list.filter(b=>!b.st).length; return (r?`<span style="color:var(--gd)">${r} ready to claim</span> · `:"")+f+" open"; })()}</div></div><button class="btn alt" id="bnt">Open</button></div>
  <div class="card row"><div class="grow"><b>Team power ${fmt(teamPower())}</b><div class="sm" style="color:var(--gd)">${synergy(S.team).b?synergy(S.team).t:""}</div><div class="sm mu">${S.team.filter(Boolean).map(id=>HB[id].name.split(" ")[0]).join(" · ")}</div></div><button class="btn gray" id="tme">Edit team</button></div>`;
  m.innerHTML=h;
  $("afk").onclick=()=>{ const a=afkPending(); S.gold+=a.gold; S.exp+=a.exp; S.gems+=a.gems; S.afkT=Date.now(); bump("afk"); toast(`Collected 🪙 ${fmt(a.gold)} 📜 ${fmt(a.exp)}${a.gems?" 💎 "+a.gems:""}`); render(); };
  $("pc").onclick=()=>{ sub.ch--; render(); }; $("nc").onclick=()=>{ sub.ch++; render(); };
  $("intro").onclick=()=>story(CH[sub.ch].intro); if($("outro")) $("outro").onclick=()=>story(CH[sub.ch].outro);
  $("tw").onclick=()=>prepBattle({tower:S.tower+1}); $("tme").onclick=teamEdit; $("bnt").onclick=bountySheet;
  m.querySelectorAll(".stg").forEach(el=>el.onclick=()=>{ const i=+el.dataset.i; if(i>cleared()) return; stageSheet(i); }); }
function stageSheet(i){ const f=stageInfo(i); const st=S.stars[i]||0;
  sheet(`<button class="x">✕</button><h2>${f.boss?"👹 Boss · ":""}Stage ${f.c+1}-${f.s+1}</h2><div class="mu sm">${f.ch.n} · enemy level ${f.lvl} · elements ${f.ch.el.map(e=>EL[e].i).join(" ")}</div>
   <div class="card" style="margin-top:10px"><div class="sm">Rewards: 🪙 ${fmt(goldRew(i))} · 📜 ${fmt(expRew(i))} · 🎒 gear${st?"":` · <b>first clear 💎 ${f.boss?150:30}</b>`}</div><div class="sm mu" style="margin-top:4px">★★★ = clear with no heroine knocked out. Sweep needs ★★★.</div></div>
   <div class="row"><button class="btn grow" id="go">⚔️ Battle  ⚡${f.cost}</button>${st===3?`<button class="btn alt" id="sw">Sweep ×5 ⚡${f.cost*5}</button>`:""}</div>`,l=>{
    l.querySelector("#go").onclick=()=>{ closeSheet(); prepBattle({stage:i}); };
    const sw=l.querySelector("#sw"); if(sw) sw.onclick=()=>{ tickStam(); const n=Math.min(5,Math.floor(S.stam/f.cost)); if(!n) return noStam(); S.stam-=n*f.cost; let g=0,e=0,gs=[]; for(let k=0;k<n;k++){ g+=goldRew(i); e+=expRew(i); const d=dropGear(i); gs.push(...d); bump("win"); } S.gold+=g; S.exp+=e; closeSheet(); toast(`Swept ×${n}: 🪙 ${fmt(g)} 📜 ${fmt(e)} 🎒 ${gs.length} gear`); render(); }; }); }
const goldRew=i=>Math.round(220*Math.pow(1.055,i));
const expRew=i=>Math.round(260*Math.pow(1.06,i));
function dropGear(i){ const out=[]; const n=Math.random()<0.55?1:Math.random()<0.5?2:0; for(let k=0;k<n;k++){ const g=mkGear(Math.floor(i/3)); S.gear.push(g); out.push(g); } return out; }
function noStam(){ sheet(`<button class="x">✕</button><h2>⚡ Out of stamina</h2><p class="mu">Stamina refills 1 every 3 minutes. Or refill now:</p><button class="btn" id="rf">Refill +60 ⚡ for 💎 50</button>`,l=>l.querySelector("#rf").onclick=()=>{ if(S.gems<50) return toast("Not enough 💎"); S.gems-=50; S.stam+=60; closeSheet(); render(); }); }
function story(lines,done){ let i=0; const d=document.createElement("div"); d.id="story"; document.body.appendChild(d);
  const show=()=>{ if(i>=lines.length){ d.remove(); if(done) done(); return; } const [who,txt]=lines[i]; const h=HB[who];
    d.innerHTML=`<button class="btn gray skip sm">Skip ⏭</button><div class="por">${portrait(h,{nobg:true})}</div><div class="box"><div class="who">${h.name}</div><div class="txt">${txt}</div><div class="sm mu" style="text-align:right;margin-top:8px">tap ▶</div></div>`;
    d.querySelector(".skip").onclick=e=>{ e.stopPropagation(); i=lines.length; show(); }; };
  d.onclick=()=>{ i++; sfx("tap"); show(); }; show(); }
function teamEdit(){ const own=Object.keys(S.heroes).sort((a,b)=>power(b)-power(a));
  
  sheet(`<button class="x">✕</button><h2>Team (5)</h2><p class="sm mu">Tap a heroine to add or remove. Order = left to right.</p><div class="sm" style="margin:-4px 0 8px;color:var(--gd)">${synergy(S.team).t}</div><div class="grid" id="tsel" style="margin-bottom:12px;grid-template-columns:repeat(5,1fr)">${[0,1,2,3,4].map(k=>S.team[k]?heroCard(S.team[k]):`<div class="hc" style="display:flex;align-items:center;justify-content:center;color:var(--mu)">empty</div>`).join("")}</div><div class="grid" id="tall">${own.map(id=>heroCard(id,S.team.includes(id)?'<span class="inT">IN</span>':"")).join("")}</div>`,l=>{
    l.querySelectorAll("#tall .hc").forEach(el=>el.onclick=()=>{ const id=el.dataset.h; const k=S.team.indexOf(id); if(k>=0){ if(S.team.filter(Boolean).length<=1) return toast("Need at least 1 heroine"); S.team[k]=null; } else { const e=S.team.indexOf(null); if(e<0) return toast("Team is full – remove someone first"); S.team[e]=id; } S.team=[...S.team.filter(Boolean),null,null,null,null,null].slice(0,5); teamEdit(); render(); });
    l.querySelectorAll("#tsel .hc[data-h]").forEach(el=>el.onclick=()=>{ const id=el.dataset.h; if(S.team.filter(Boolean).length<=1) return; S.team[S.team.indexOf(id)]=null; S.team=[...S.team.filter(Boolean),null,null,null,null,null].slice(0,5); teamEdit(); render(); }); }); }


/* ---------- bounty board (send heroines on timed missions) ---------- */
const BNAME=["Escort a rice merchant","Clear a haunted well","Hunt a stray oni","Guard the shrine festival","Scout the bamboo paths","Recover a lost talisman","Deliver medicine to Haruno","Investigate strange foxfire","Calm a river spirit","Patrol the capital at night","Repair the mountain torii","Chase off bandit tengu"];
function ensureBounty(force){ const t=today(); if(!S.bnt||S.bnt.d!==t||force){ const r=seeded(t+(force?Date.now():"")); const p=cleared(); const list=[];
   for(let i=0;i<5;i++){ const hrs=[1,2,4,8][Math.floor(r()*4)], n=1+Math.floor(r()*3), el=r()<0.5?ELN[Math.floor(r()*5)]:null, tier=hrs>=4?TIERS[Math.min(4,1+Math.floor(r()*3))]:null;
     const rew={gold:Math.round(900*hrs*(1+p/12)),exp:Math.round(700*hrs*(1+p/10))}; if(hrs>=2) rew.gems=10*hrs; if(hrs===8&&r()<0.5) rew.tickets=1;
     list.push({nm:BNAME[Math.floor(r()*BNAME.length)],hrs,n,el,tier,rew,hs:[],st:0,got:false}); }
   S.bnt={d:t,list,rf:(S.bnt&&S.bnt.d===t?S.bnt.rf:0)}; } }
const bOk=(b,id)=>(!b.el||HB[id].el===b.el)&&(!b.tier||tierIx(HB[id].rar)>=tierIx(b.tier));
const busy=()=>new Set(S.bnt.list.filter(b=>b.st&&!b.got).flatMap(b=>b.hs));
function bountySheet(){ ensureBounty(); const now=Date.now(), B2=busy();
  sheet(`<button class="x">✕</button><h2>📋 Bounty Board</h2><p class="sm mu">Send heroines on missions. They still fight in battles while away. New bounties every day.</p>
   ${S.bnt.list.map((b,i)=>{ const left=b.st?b.st+b.hrs*3600000-now:0, done=b.st&&left<=0;
     return `<div class="card"><div class="row"><div class="grow"><b>${b.nm}</b> <span class="sm mu">· ${b.hrs}h</span><div class="sm">Needs ${b.n} heroine${b.n>1?"s":""}${b.el?" · "+EL[b.el].i+" only":""}${b.tier?` · <span class="tag t${b.tier}">${b.tier}+</span>`:""}</div><div class="sm mu">${Object.entries(b.rew).map(([k,v])=>icon(k)+" "+fmt(v)).join(" ")}</div>${b.st&&!b.got?`<div class="sm" style="color:var(--pk)">${b.hs.map(id=>HB[id].name.split(" ")[0]).join(", ")}${done?"":" · "+Math.ceil(left/60000)+" min left"}</div>`:""}</div>
       ${b.got?'<button class="btn gray" disabled>Done</button>':done?`<button class="btn gold" data-c="${i}">Claim</button>`:b.st?'<button class="btn gray" disabled>Away</button>':`<button class="btn" data-s="${i}">Send</button>`}</div></div>`; }).join("")}
   <button class="btn alt" id="bref" style="width:100%">🔄 New bounties · 💎 ${30+S.bnt.rf*30}</button>`,l=>{
    l.querySelectorAll("[data-s]").forEach(el=>el.onclick=()=>{ const b=S.bnt.list[+el.dataset.s]; const cand=Object.keys(S.heroes).filter(id=>!B2.has(id)&&bOk(b,id)).sort((x,y)=>tierIx(HB[x].rar)-tierIx(HB[y].rar)||power(x)-power(y));
      if(cand.length<b.n) return toast("Not enough free heroines that match"); b.hs=cand.slice(0,b.n); b.st=Date.now(); bountySheet(); });
    l.querySelectorAll("[data-c]").forEach(el=>el.onclick=()=>{ const b=S.bnt.list[+el.dataset.c]; b.got=true; toast(grant(b.rew)); bump("bounty"); bountySheet(); render.keep=true; render(); });
    l.querySelector("#bref").onclick=()=>{ const c=30+S.bnt.rf*30; if(S.gems<c) return toast("Not enough 💎"); if(S.bnt.list.some(b=>b.st&&!b.got)) return toast("Wait until running bounties are back"); S.gems-=c; const rf=S.bnt.rf+1; ensureBounty(true); S.bnt.rf=rf; bountySheet(); render.keep=true; render(); }; }); }

/* ---------- summon ---------- */
function featured(){ const sss=HEROES.filter(h=>h.rar==="SSS"); const d=Math.floor(Date.now()/86400000/3); return sss[d%sss.length].id; }
const RATES=[["SSS",0.007],["SSR",0.03],["SR",0.08],["E",0.16],["B",0.28],["R",0.443]];
// pity: SR+ every 10 pulls · SSR+ rises from pull 60, sure by 80 · SSS sure by pull 200
function rollOne(){ S.pity++; S.pitySR++; S.pitySSS=(S.pitySSS||0)+1; const r=Math.random(); let acc=0, rar="R";
  const sssP=0.007+(S.pitySSS>=160?(S.pitySSS-159)*0.02:0), ssrP=0.03+(S.pity>=60?(S.pity-59)*0.05:0);
  if(r<sssP||S.pitySSS>=200) rar="SSS"; else if(r<sssP+ssrP||S.pity>=80) rar="SSR"; else { acc=sssP+ssrP; for(const [t,p] of RATES.slice(2)){ acc+=p; if(r<acc){ rar=t; break; } } }
  if(S.pitySR>=10&&tierIx(rar)<3) rar="SR";
  if(rar==="SSS"){ S.pitySSS=0; S.pity=0; S.pitySR=0; } else if(rar==="SSR"){ S.pity=0; S.pitySR=0; } else if(rar==="SR") S.pitySR=0;
  if(rar==="SSS"&&Math.random()<0.5) return HB[featured()]; return pick(HEROES.filter(h=>h.rar===rar)); }
function addHero(h){ const o=S.heroes[h.id]; if(o){ o.shards+=RAR[h.rar].shard; return false; } S.heroes[h.id]={lv:1,stars:RAR[h.rar].st,shards:0}; S.newH[h.id]=1; if(S.team.includes(null)){ S.team[S.team.indexOf(null)]=h.id; } return true; }
function doPull(n,cur){ const cost=cur==="tickets"?n:n*160; if(S[cur]<cost) return toast(cur==="tickets"?"Not enough 🎫":"Not enough 💎"); S[cur]-=cost;
  const res=[]; for(let i=0;i<n;i++){ const h=rollOne(); res.push([h,addHero(h)]); } bump("pull",n); save(true); pullAnim(res); }
function pullAnim(res){ const best=TIERS[Math.max(...res.map(([h])=>tierIx(h.rar)))]; const d=document.createElement("div"); d.id="pull"; document.body.appendChild(d);
  d.innerHTML=`<div class="gate" style="border-color:${RAR[best].c}"></div><div class="mu" style="margin-top:16px">The Sakura Gate opens…</div>`; sfx(tierIx(best)>=4?"ssr":"skill"); buzz();
  setTimeout(()=>{ d.innerHTML=`<div class="pgrid">${res.map(([h,isNew],i)=>`<div class="hc ${h.rar}" style="animation-delay:${i*0.08}s">${portrait(h)}<span class="el">${EL[h.el].i}</span><span class="st tag t${h.rar}" style="font-size:9px">${h.rar}</span>${isNew?'<span class="new">NEW</span>':`<span class="lv">+${RAR[h.rar].shard} shards</span>`}</div>`).join("")}</div>
    <div style="margin-top:14px;text-align:center">${res.filter(([h])=>tierIx(h.rar)>=4).map(([h])=>`<div style="color:${RAR[h.rar].c};font-weight:900">✨ ${h.rar} · ${h.name} ✨</div>`).join("")}</div><button class="btn" style="margin-top:16px;width:200px" id="pok">OK</button>`;
    d.querySelector("#pok").onclick=()=>{ d.remove(); render(); }; },1300); }
function vSummon(m){ const f=HB[featured()]; const left=3-(Math.floor(Date.now()/86400000)%3);
  m.innerHTML=`<div class="banner"><div style="position:relative;z-index:2;max-width:56%"><div class="tag tSSS">SSS RATE UP</div><div style="font-size:20px;font-weight:900;margin-top:4px;text-shadow:0 2px 4px #0006">${f.name}</div><div class="sm">${EL[f.el].i} ${CLS[f.cls].n}</div><div class="sm" style="margin-top:6px;opacity:.9">${f.bio}</div><div class="sm" style="margin-top:6px">Changes in ${left} day${left>1?"s":""}</div></div><div class="feat">${portrait(f,{nobg:true})}</div></div>
  <div class="card"><div class="row"><button class="btn grow" id="p1">Summon ×1<br><span class="sm">💎 160</span></button><button class="btn gold grow" id="p10">Summon ×10<br><span class="sm">💎 1600</span></button></div>
  <div class="row" style="margin-top:8px"><button class="btn alt grow" id="t1" ${S.tickets<1?"disabled":""}>🎫 ×1</button><button class="btn alt grow" id="t10" ${S.tickets<10?"disabled":""}>🎫 ×10</button><span class="cur">🎫 ${S.tickets}</span></div>
  <div class="sm mu" style="margin-top:10px">${RATES.map(([t,p])=>`<span class="tag t${t}">${t} ${(p*100).toFixed(1)}%</span>`).join(" ")}<br>SR or better every 10 pulls. SSR+ guaranteed by pull 80 (now ${S.pity}/80). SSS guaranteed by pull 200 (now ${S.pitySSS||0}/200) – 50% of SSS pulls are the rate-up heroine. Duplicates give shards to raise ★.</div></div>
  <h3>All heroines (${Object.keys(S.heroes).length}/${HEROES.length})</h3><div class="grid">${HEROES.slice().sort((a,b)=>tierIx(b.rar)-tierIx(a.rar)).map(h=>heroCard(h.id)).join("")}</div>`;
  $("p1").onclick=()=>doPull(1,"gems"); $("p10").onclick=()=>doPull(10,"gems"); $("t1").onclick=()=>doPull(1,"tickets"); $("t10").onclick=()=>doPull(10,"tickets");
  m.querySelectorAll(".grid .hc").forEach(el=>el.onclick=()=>heroSheet(el.dataset.h)); }

/* ---------- heroes ---------- */
function vHeroes(m){ const f=sub.heroes, t=sub.tier||"all", showAll=!!sub.all; const owned=Object.keys(S.heroes).length;
  const ids=HEROES.map(h=>h.id).filter(id=>(showAll||S.heroes[id])&&(f==="all"||HB[id].el===f)&&(t==="all"||HB[id].rar===t)).sort((a,b)=>(S.heroes[b]?1:0)-(S.heroes[a]?1:0)||(S.heroes[a]&&S.heroes[b]?power(b)-power(a):tierIx(HB[b].rar)-tierIx(HB[a].rar)));
  const byT=TIERS.map(x=>`<span class="tag t${x}">${x} ${HEROES.filter(h=>h.rar===x&&S.heroes[h.id]).length}/${HEROES.filter(h=>h.rar===x).length}</span>`).join(" ");
  m.innerHTML=`<div class="card"><div class="row"><b class="grow">📖 Collection ${owned}/${HEROES.length}</b><span style="color:var(--gd);font-weight:800">+${(colBonus()*100).toFixed(1)}% ATK/HP</span></div><div class="bar" style="margin:6px 0"><i style="width:${owned/HEROES.length*100}%;background:var(--pk)"></i></div><div class="sm">${byT}</div><div class="sm mu" style="margin-top:4px">Every heroine you own – and every ★ she gains – powers up your whole roster.</div></div>
   <div class="seg">${["all",...ELN].map(k=>`<button data-f="${k}" class="${f===k?"on":""}">${k==="all"?"All":EL[k].i}</button>`).join("")}</div>
   <div class="seg">${["all",...TIERS].map(k=>`<button data-t="${k}" class="${t===k?"on":""}">${k==="all"?"Any":k}</button>`).join("")}<button id="shAll" class="${showAll?"on":""}">${showAll?"👁 all":"owned"}</button></div>
   <div class="grid">${ids.map(id=>heroCard(id,S.team.includes(id)?'<span class="inT">TEAM</span>':"")).join("")}</div>`;
  m.querySelectorAll(".seg button[data-f]").forEach(b=>b.onclick=()=>{ sub.heroes=b.dataset.f; render(); });
  m.querySelectorAll(".seg button[data-t]").forEach(b=>b.onclick=()=>{ sub.tier=b.dataset.t; render(); });
  $("shAll").onclick=()=>{ sub.all=!sub.all; render(); };
  m.querySelectorAll(".grid .hc").forEach(el=>el.onclick=()=>heroSheet(el.dataset.h)); }
function heroSheet(id){ const h=HB[id], o=S.heroes[id]; delete S.newH[id];

  sheet(`<button class="x">✕</button><div class="row" style="align-items:flex-start"><div style="width:120px;flex:none" class="hc ${h.rar}">${portrait(h)}</div><div class="grow"><h2 style="margin:0 0 4px">${h.name}</h2><span class="tag t${h.rar}">${h.rar}</span> <span class="sm">${EL[h.el].i} ${EL[h.el].n} · ${CLS[h.cls].i} ${CLS[h.cls].n}</span><div style="color:var(--gd);margin-top:4px">${"★".repeat(o.stars)}${"☆".repeat(6-o.stars)}</div><div class="sm mu" style="margin-top:4px">${h.bio}</div><div style="margin-top:6px;font-weight:800">⚔️ Power ${fmt(power(id))}</div></div></div>
   <div class="card" style="margin-top:10px"><div class="row"><b class="grow">Lv ${o.lv} / ${cap}</b><span class="sm mu">${o.lv<cap?`next: 📜 ${fmt(need)} · 🪙 ${fmt(gn)}`:"level cap – raise ★"}</span></div>
    <div class="row" style="margin-top:8px"><button class="btn grow" id="l1" ${o.lv>=cap?"disabled":""}>Level +1</button><button class="btn alt grow" id="lm" ${o.lv>=cap?"disabled":""}>Level max</button></div>

   <div class="card"><b>✨ ${h.skill}</b><div class="sm mu">${SKD[h.cls].d}${RAR[h.rar].sk>1?` ${h.rar}: +${Math.round((RAR[h.rar].sk-1)*100)}% skill power.`:""}${h.rar==="SSS"?" Divine aura: the whole team gets +10% ATK while she fights.":""} Ready every ${SKD[h.cls].cd} actions.</div></div>
   <h3>Gear</h3>${["w","a","c"].map(gslot).join("")}
   <div class="row" style="margin-top:8px"><button class="btn alt grow" id="auto">Auto-equip best</button><button class="btn gray grow" id="uneq">Unequip all</button></div>`,l=>{
    const lvl=max=>{ let n=0; while(o.lv<cap&&S.exp>=xpNeed(o.lv)&&S.gold>=goldNeed(o.lv)&&(max||n<1)){ S.exp-=xpNeed(o.lv); S.gold-=goldNeed(o.lv); o.lv++; n++; } if(!n) return toast(S.exp<need?"Not enough 📜 EXP – battle or collect patrol rewards":"Not enough 🪙"); bump("lvup",n); sfx("heal"); heroSheet(id); render.keep=true; render(); };
    l.querySelector("#l1").onclick=()=>lvl(false); l.querySelector("#lm").onclick=()=>lvl(true);
    l.querySelector("#star").onclick=()=>{ o.shards-=sc; o.stars++; sfx("ssr"); toast(`${h.name} is now ★${o.stars}! Level cap ${lvCap(o.stars)}`); heroSheet(id); render.keep=true; render(); };
    l.querySelectorAll(".gi").forEach(el=>el.onclick=()=>pickGear(id,el.dataset.sl));

const gScore=(g)=>{ const m=1+g.lv*0.12; const w={atk:2.4,hp:0.25,def:1.6,spd:2,crit:6,cdmg:1.5}; return g.mv*m*w[g.main]+g.subs.reduce((a,[k,v])=>a+v*w[k],0); };
function autoEquip(id){ const o=S.heroes[id]; o.g=o.g||{}; for(const sl of ["w","a","c"]){ const cur=o.g[sl]&&S.gear.find(x=>x.u===o.g[sl]); const free=S.gear.filter(g=>g.s===sl&&(!gearOwner(g.u)||g.u===o.g[sl])).sort((a,b)=>gScore(b)-gScore(a))[0]; if(free&&(!cur||gScore(free)>gScore(cur))) o.g[sl]=free.u; } }
function pickGear(id,sl){ const o=S.heroes[id]; o.g=o.g||{}; const list=S.gear.filter(g=>g.s===sl).sort((a,b)=>gScore(b)-gScore(a));
  sheet(`<button class="x">✕</button><h2>${GSLOT[sl].n} for ${HB[id].name.split(" ")[0]}</h2>${o.g[sl]?`<button class="btn gray" id="un" style="width:100%;margin-bottom:8px">Unequip</button>`:""}${list.length?list.map(g=>{ const ow=gearOwner(g.u); return `<div class="gi ${g.r}" data-u="${g.u}"><span class="gico">${g.ic}</span><div class="grow"><b>${g.n}${g.lv?" +"+g.lv:""}</b> <span class="tag t${g.r}">${g.r}</span><div class="sm mu">${GEARSTAT[g.main]} ${fmtStat(g.main,g.mv*(1+g.lv*0.12))} · ${g.subs.map(([k,v])=>GEARSTAT[k]+" "+fmtStat(k,v)).join(" · ")}</div>${ow?`<div class="sm" style="color:var(--pk)">on ${HB[ow].name.split(" ")[0]}</div>`:""}</div></div>`; }).join(""):'<p class="mu">No gear of this type yet – clear stages to find some.</p>'}`,l=>{
    const un=l.querySelector("#un"); if(un) un.onclick=()=>{ delete o.g[sl]; heroSheet(id); render.keep=true; render(); };
    l.querySelectorAll(".gi").forEach(el=>el.onclick=()=>{ const u=+el.dataset.u; const ow=gearOwner(u); if(ow&&ow!==id) delete S.heroes[ow].g[sl]; o.g[sl]=u; heroSheet(id); render.keep=true; render(); }); }); }

function vGear(m){ const f=sub.gear; const list=S.gear.filter(g=>f==="all"||g.s===f).sort((a,b)=>GR.indexOf(b.r)-GR.indexOf(a.r)||b.lv-a.lv||gScore(b)-gScore(a));
  m.innerHTML=`<div class="seg">${[["all","All"],["w","🗡️ Weapon"],["a","👘 Armor"],["c","📿 Charm"]].map(([k,n])=>`<button data-f="${k}" class="${f===k?"on":""}">${n}</button>`).join("")}</div>
   <div class="row" style="margin-bottom:10px"><span class="mu sm grow">${S.gear.length} items</span><button class="btn gray sm" id="sellN">Sell unused N/R</button></div>
   ${list.map(g=>{ const ow=gearOwner(g.u); return `<div class="gi ${g.r}" data-u="${g.u}"><span class="gico">${g.ic}</span><div class="grow"><b>${g.n}${g.lv?" +"+g.lv:""}</b> <span class="tag t${g.r}">${g.r}</span><div class="sm mu">${GEARSTAT[g.main]} ${fmtStat(g.main,g.mv*(1+g.lv*0.12))}${g.subs.length?" · "+g.subs.map(([k,v])=>GEARSTAT[k]+" "+fmtStat(k,v)).join(" · "):""}</div>${ow?`<div class="sm" style="color:var(--pk)">equipped · ${HB[ow].name.split(" ")[0]}</div>`:""}</div></div>`; }).join("")||'<p class="mu">Your bag is empty. Clear stages to find gear!</p>'}`;

function gearSheet(u){ const g=S.gear.find(x=>x.u===u); if(!g) return closeSheet(); const ow=gearOwner(u), c=enhCost(g);

   <div class="card" style="margin-top:10px"><div class="stat"><span>Main · ${GEARSTAT[g.main]}</span><b>${fmtStat(g.main,g.mv*(1+g.lv*0.12))}</b></div>${g.subs.map(([k,v])=>`<div class="stat"><span>${GEARSTAT[k]}</span><b>${fmtStat(k,v)}</b></div>`).join("")}</div>
   <div class="sm mu">Every enhance: main stat +12%. At +3/+6/+9/+12 a random sub stat grows.</div>

  else h+=ACH.map(a=>{ const got=S.ach[a.id], ok=a.ok(); return `<div class="card row"><div class="grow"><b>${a.t}</b><div class="sm mu">${Object.entries(a.r).filter(([,b])=>b).map(([k,b])=>icon(k)+" "+fmt(b)).join(" ")}</div></div><button class="btn ${got?"gray":""}" data-a="${a.id}" ${got||!ok?"disabled":""}>${got?"Done":ok?"Claim":"—"}</button></div>`; }).join("");

  m.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ const a=ACH.find(x=>x.id===b.dataset.a); S.ach[a.id]=1; toast(grant(a.r)); render.keep=true; render(); });
  const al=$("all"); if(al) al.onclick=()=>{ S.daily.all=true; toast(grant({tickets:1,gems:100})); render(); }; }

/* ================= battle ================= */
let B=null;
function prepBattle(o){ tickStam(); const team=S.team.filter(Boolean); if(!team.length) return toast("Pick a team first");
  if(o.stage!=null){ const f=stageInfo(o.stage); if(S.stam<f.cost) return noStam(); }
  const go=()=>startBattle(o);
  if(o.stage!=null&&o.stage%SPC===0&&!S.seen["i"+Math.floor(o.stage/SPC)]){ S.seen["i"+Math.floor(o.stage/SPC)]=1; story(CH[Math.floor(o.stage/SPC)].intro,go); } else go(); }
function mkWaves(o){ const W=[]; let P,lvl,ch,els,mons,boss;
  if(o.tower){ const f=o.tower; P=Math.pow(1.047,Math.min(NST,16+f*1.3))*Math.pow(1.03,Math.max(0,16+f*1.3-NST))*1.15; lvl=Math.round(14+f*1.1); const c=CH[(f-1)%CH.length]; els=ELN; mons=c.mons; boss=c.boss; ch=c; }
  else { const f=stageInfo(o.stage); P=f.P; lvl=f.lvl; ch=f.ch; els=ch.el; mons=ch.mons; boss=ch.boss; }
  const isBoss=o.tower?o.tower%5===0:stageInfo(o.stage).boss; const nW=isBoss?3:o.tower?2:(stageInfo(o.stage).s<2?2:3);
  const mk=(type,bossy,el)=>({type,el,boss:bossy,name:(bossy?"👑 ":"")+MON[type].n,lvl,hp:Math.round(480*P*(bossy?7:1)),atk:Math.round(60*P*(bossy?1.5:1)),def:Math.round(26*P),spd:88+Math.random()*20+(bossy?6:0),crit:5,cdmg:50});
  for(let w=0;w<nW;w++){ const last=w===nW-1; if(last&&isBoss) W.push([mk(boss,true,pick(els))]); else { const n=w===0?2+Math.floor(Math.random()*2):3; const arr=[]; for(let k=0;k<n;k++) arr.push(mk(pick(mons),false,pick(els))); W.push(arr); } }
  return {W,ch}; }
function startBattle(o){ if(o.stage!=null){ S.stam-=stageInfo(o.stage).cost; } const {W,ch}=mkWaves(o);
  const ids=S.team.filter(Boolean), syn=synergy(ids), aura=1+0.1*ids.filter(id=>HB[id].rar==="SSS").length;
  const team=ids.map(id=>{ const s=stats(id); s.hp=Math.round(s.hp*(1+syn.b)); s.atk=Math.round(s.atk*(1+syn.b)*aura); return {id,h:HB[id],hero:true,...s,max:s.hp,el:HB[id].el,cls:HB[id].cls,en:0,cd:SKD[HB[id].cls].cd,shield:0,taunt:0,g:Math.random()*30,dead:false}; });
  B={o,W,wave:0,team,foes:[],ch,t:0,over:false,log:"",turn:null,busy:0,target:null};
  const d=document.createElement("div"); d.id="bt"; document.body.appendChild(d);
  d.innerHTML=`<svg class="bg" viewBox="0 0 100 160" preserveAspectRatio="xMidYMid slice"><rect width="100" height="160" fill="${ch.bg}"/><circle cx="78" cy="22" r="12" fill="#fff6" /><path d="M0 120 Q25 96 50 112 Q75 96 100 116 V160 H0Z" fill="#0004"/><g fill="#ffb3d1" opacity=".5">${Array.from({length:14},()=>`<circle cx="${Math.random()*100}" cy="${Math.random()*150}" r="${0.6+Math.random()*1.2}"/>`).join("")}</g><path d="M30 120 V84 M70 120 V84 M24 86 H76 M27 92 H73" stroke="#c0392b" stroke-width="3" opacity=".45"/></svg>
   <div id="btTop"><b id="wv"></b><span class="grow"></span><button class="sbtn ${S.auto?"on":""}" id="bAuto">AUTO</button><button class="sbtn" id="bSpd">${S.spd}×</button><button class="sbtn" id="bQuit">✕</button></div>
   <div id="foes"></div><div id="btLog"></div><div id="team"></div>`;
  $("bAuto").onclick=()=>{ S.auto=!S.auto; $("bAuto").classList.toggle("on",S.auto); };
  $("bSpd").onclick=()=>{ S.spd=S.spd>=3?1:S.spd+1; $("bSpd").textContent=S.spd+"×"; };
  $("bQuit").onclick=()=>{ if(B&&!B.over&&!confirm("Retreat? Stamina is not refunded.")) return; endBattle(false,true); };
  nextWave(); drawTeam(); loopBattle(); }
function nextWave(){ B.foes=B.W[B.wave].map(m=>({...m,max:m.hp,g:Math.random()*40,dead:false,en:0,burn:0})); B.target=null; drawFoes(); $("wv").textContent=`Wave ${B.wave+1}/${B.W.length}`; }
function drawFoes(){ $("foes").innerHTML=B.foes.map((f,i)=>`<div class="foe ${f.boss?"boss":""} ${f.dead?"dead":""} ${B.target===i?"tgt":""}" id="f${i}"><div class="nm">${EL[f.el].i} ${f.name} <span class="mu">Lv${f.lvl}</span></div>${monSvg(f.type,f.el)}<div class="hp"><i style="width:${f.hp/f.max*100}%"></i></div></div>`).join("");
  B.foes.forEach((f,i)=>{ const el=$("f"+i); el.onclick=()=>{ if(f.dead) return; B.target=B.target===i?null:i; drawFoes(); }; }); }
function drawTeam(){ $("team").innerHTML=B.team.map((u,i)=>`<div class="tm ${u.dead?"dead":""}" id="t${i}"><div class="pt">${portrait(u.h)}</div><div class="hp"><i style="width:${u.hp/u.max*100}%"></i></div><div class="en"><i style="width:${Math.min(1,u.en/u.cd)*100}%"></i></div><div class="sk">✨ ${u.h.skill}</div>${u.shield>0?'<span class="shd">🛡️</span>':""}</div>`).join("");
  B.team.forEach((u,i)=>{ $("t"+i).onclick=()=>{ if(u.dead||u.en<u.cd||B.over) return; u.queued=true; sfx("tap"); }; }); updTeam(); }
function updTeam(){ B.team.forEach((u,i)=>{ const el=$("t"+i); if(!el) return; el.classList.toggle("dead",u.dead); el.classList.toggle("ready",!u.dead&&u.en>=u.cd&&!S.auto); el.querySelector(".hp i").style.width=Math.max(0,u.hp/u.max*100)+"%"; el.querySelector(".en i").style.width=Math.min(1,u.en/u.cd)*100+"%"; const sh=el.querySelector(".shd"); if(u.shield>0&&!sh) el.insertAdjacentHTML("beforeend",'<span class="shd">🛡️</span>'); if(u.shield<=0&&sh) sh.remove(); }); }
function fx(el,txt,cls){ if(!el) return; const r=el.getBoundingClientRect(); const d=document.createElement("div"); d.className="fx "+(cls||""); d.textContent=txt; d.style.left=(r.left+r.width/2-20+rnd(-14,14))+"px"; d.style.top=(r.top+r.height*0.3)+"px"; document.body.appendChild(d); setTimeout(()=>d.remove(),1000); }
function hitEl(u){ return u.hero?$("t"+B.team.indexOf(u)):$("f"+B.foes.indexOf(u)); }
function dmg(a,d,mult,critBonus){ let x=a.atk*mult*(100/(100+d.def*0.9))*elemMod(a.el,d.el)*rnd(0.93,1.07); const cr=Math.random()*100<(a.crit+(critBonus||0)); if(cr) x*=1+a.cdmg/100;
  x=Math.max(1,Math.round(x)); if(d.shield>0){ const s=Math.min(d.shield,x); d.shield-=s; x-=s; } d.hp-=x; const el=hitEl(d); const em=elemMod(a.el,d.el);
  fx(el,(cr?"💥":"")+fmt(x+0),cr?"crit":em>1?"weak":""); if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); } sfx(cr?"crit":"hit");
  if(d.hp<=0){ d.hp=0; d.dead=true; } return x; }
const alive=a=>a.filter(u=>!u.dead);
function heroAct(u){ const foes=alive(B.foes); if(!foes.length) return; const sk=u.en>=u.cd&&(S.auto||u.queued); u.queued=false;
  const tgt=()=>{ const t=B.target!=null&&!B.foes[B.target].dead?B.foes[B.target]:null; return t||foes.slice().sort((a,b)=>a.hp-b.hp)[0]; };
  const P=RAR[u.h.rar].sk;
  if(!sk){ dmg(u,tgt(),1); u.en++; return; }
  u.en=0; sfx("skill"); B.log=`✨ ${u.h.name.split(" ")[0]}: ${u.h.skill}!`; fx(hitEl(u),"✨"+u.h.skill,"heal");
  switch(u.cls){
    case "blade": dmg(u,tgt(),2.6*P); break;
    case "guard": u.shield=Math.round(u.max*0.25*P); u.taunt=2; dmg(u,tgt(),1.0*P); break;
    case "archer": dmg(u,foes.slice().sort((a,b)=>a.hp-b.hp)[0],2.3*P,60); break;
    case "mage": foes.forEach(f=>dmg(u,f,1.25*P)); break;
    case "healer": alive(B.team).forEach(t=>{ const h=Math.round(u.atk*2.2*P); t.hp=Math.min(t.max,t.hp+h); t.burn=0; fx(hitEl(t),"+"+fmt(h),"heal"); }); sfx("heal"); break;
    case "ninja": for(let k=0;k<4;k++){ const a=alive(B.foes); if(!a.length) break; dmg(u,pick(a),0.85*P); } break; } }
function foeAct(f){ const t=alive(B.team); if(!t.length) return; const taunter=t.find(u=>u.taunt>0); const target=taunter||(Math.random()<0.6?t.slice().sort((a,b)=>a.hp/a.max-b.hp/b.max)[0]:pick(t));
  f.en++; if(f.boss&&f.en>=3){ f.en=0; B.log=`👑 ${f.name} unleashes a fury attack!`; t.forEach(u=>dmg(f,u,0.9)); return; }
  dmg(f,target,1); }
function loopBattle(){ if(!B||B.over) return; const steps=S.spd; for(let s=0;s<steps;s++){ if(B.over) break; tickBattle(); } requestAnimationFrame(()=>setTimeout(loopBattle,90)); }
function tickBattle(){ if(B.busy>0){ B.busy--; return; }
  const units=[...alive(B.team),...alive(B.foes)]; if(!units.length) return;
  // advance gauges until someone reaches 100
  let best=null; for(const u of units){ const need=(100-u.g)/u.spd; if(!best||need<best.n) best={u,n:need}; }
  for(const u of units) u.g+=u.spd*Math.max(0,best.n); const u=best.u; u.g=0;
  document.querySelectorAll(".act").forEach(e=>e.classList.remove("act")); const el=hitEl(u); if(el) el.classList.add("act");
  if(u.hero){ heroAct(u); if(u.taunt>0) u.taunt--; } else foeAct(u);
  B.busy=3; $("btLog").textContent=B.log; B.log="";
  B.foes.forEach((f,i)=>{ const e=$("f"+i); if(!e) return; e.querySelector(".hp i").style.width=(f.hp/f.max*100)+"%"; if(f.dead&&!e.classList.contains("dead")) e.classList.add("dead"); });
  updTeam();
  if(!alive(B.team).length) return endBattle(false);
  if(!alive(B.foes).length){ if(B.wave<B.W.length-1){ B.wave++; B.busy=8; setTimeout(()=>{ if(B&&!B.over){ nextWave(); } },350); } else endBattle(true); } }
function endBattle(win,quit){ if(!B) return; B.over=true; const o=B.o; const ko=B.team.filter(u=>u.dead).length;
  if(quit){ document.getElementById("bt").remove(); B=null; render(); return; }
  let rew="", afterStory=null;
  if(win){ sfx("win"); bump("win"); buzz();
    if(o.stage!=null){ const i=o.stage, first=!S.stars[i]; const st=ko===0?3:ko===1?2:1; S.stars[i]=Math.max(S.stars[i]||0,st); const g=goldRew(i), e=expRew(i); S.gold+=g; S.exp+=e; const gs=dropGear(i);
      rew=`<div style="color:var(--gd);font-size:30px;letter-spacing:4px">${"★".repeat(st)}${"☆".repeat(3-st)}</div>🪙 ${fmt(g)} · 📜 ${fmt(e)}${first?` · 💎 ${stageInfo(i).boss?150:30}`:""}${gs.map(x=>`<div class="sm">🎒 <span class="tag t${x.r}">${x.r}</span> ${x.n}</div>`).join("")}`;
      if(first) S.gems+=stageInfo(i).boss?150:30;
      if(first&&stageInfo(i).boss) afterStory=CH[Math.floor(i/SPC)].outro; }
    else { const f=o.tower; S.tower=Math.max(S.tower,f); bump("tower"); const gm=f%5===0?100:20; const g=Math.round(goldRew(Math.min(NST,16+f))*1.2); S.gems+=gm; S.gold+=g; const gs=[mkGear(Math.floor((16+f)/3))]; S.gear.push(...gs);
      rew=`🗼 Floor ${f} cleared!<br>💎 ${gm} · 🪙 ${fmt(g)}${gs.map(x=>`<div class="sm">🎒 <span class="tag t${x.r}">${x.r}</span> ${x.n}</div>`).join("")}`; } }
  const nextOk= o.stage!=null? (o.stage+1<NST&&o.stage+1<=cleared()) : true;
  const d=document.createElement("div"); d.id="layer2"; d.style.cssText="position:fixed;inset:0;z-index:45;background:#000a;display:flex;align-items:center;justify-content:center";
  d.innerHTML=`<div class="card" style="width:86%;max-width:380px;text-align:center"><h2 style="font-size:24px">${win?"🌸 Victory!":"💀 Defeat"}</h2>${win?rew:`<p class="mu">Level up your heroines, equip better gear, or bring an element that beats ${B.ch?B.ch.el.map(e=>EL[e].i).join(" "):"them"}.</p>`}
   <div class="row" style="margin-top:14px"><button class="btn gray grow" id="eb">Back</button>${win?(o.stage!=null?`<button class="btn alt grow" id="rp">Repeat ⚡</button>${nextOk?'<button class="btn grow" id="nx">Next ▶</button>':""}`:`<button class="btn grow" id="nx">Floor ${o.tower+1} ▶</button>`):`<button class="btn grow" id="rp">Retry</button>`}</div></div>`;
  document.body.appendChild(d);
  const close=()=>{ clearInterval(d.tm); d.remove(); const b=$("bt"); if(b) b.remove(); B=null; save(true); render(); };
  d.querySelector("#eb").onclick=()=>{ close(); if(afterStory) story(afterStory); };
  const rp=d.querySelector("#rp"); if(rp) rp.onclick=()=>{ close(); prepBattle(o); };
  const goNext=()=>{ close(); const nxt=()=>prepBattle(o.stage!=null?{stage:o.stage+1}:{tower:o.tower+1}); if(afterStory) story(afterStory,nxt); else nxt(); };
  const nx=d.querySelector("#nx"); if(nx) nx.onclick=goNext;
  // story stages: continue to the next stage by itself after 3 seconds (tap Back to stop)
  if(win&&o.stage!=null&&nx){ let c=3; nx.textContent=`Next ▶ ${c}`; d.tm=setInterval(()=>{ c--; if(c<=0){ clearInterval(d.tm); if(S.stam<stageInfo(o.stage+1).cost){ nx.textContent="Next ▶"; return; } goNext(); } else nx.textContent=`Next ▶ ${c}`; },1000); }
  save(true); }

/* ================= boot ================= */
function intro(){ if(S.seen.prologue) return; S.seen.prologue=1; S.seen.i0=1; story(CH[0].intro.concat([["sakura","Here – take this. 3200 Gate-crystals 💎 and 5 summon tickets 🎫. Call some friends! Then meet me at stage 1-1."]])); }
setInterval(()=>{ tickStam(); if(!B&&!$("layer").innerHTML) { topBar(); nav(); } },15000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) save(true); });
window.addEventListener("focus",()=>{ if(!B) render(); });
render(); intro();
window.__g={S:()=>S,stats,power,mkWaves,startBattle,doPull,heroSheet,stageInfo,endBattle,tickBattle,get B(){return B;},render,mkGear};
</script>
