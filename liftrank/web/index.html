<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>LiftRank</title>
<style>
:root{--bg:#0b0b10;--card:#16151d;--card2:#1f1d28;--line:#2c2a37;--txt:#f2f0f7;--mut:#8f8aa3;--acc:#ff8a1f;--acc2:#ffb44d;--ok:#3ddc84;--bad:#ff5a6a;--blue:#4cc3ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus{border-color:var(--acc)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px}
h1{font-size:22px;font-weight:800}h2{font-size:16px;font-weight:700;margin:22px 0 10px}
.mut{color:var(--mut)}.small{font-size:13px}.tiny{font-size:11px}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.btn{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#2a1300;border-radius:14px;padding:13px 16px;font-weight:800}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.full{width:100%}.btn:disabled{opacity:.4}
.btn.bad{background:transparent;border:1px solid #5a2430;color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:#3a2410;border-color:var(--acc);color:var(--acc2)}
.bar{height:7px;background:#0a0a0e;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,16,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 12px}
nav button .i{font-size:21px}nav button.on{color:var(--acc2)}
.muscle{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:9px;width:100%;text-align:left}
.badge{width:44px;height:44px;flex:none;display:grid;place-items:center}
.tag{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:6px;background:#3a2410;color:var(--acc2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.set{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:7px}
.set input{padding:9px;text-align:center}
.set .ck{height:40px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:800}
.set .ck.on{background:var(--ok);color:#03210f;border-color:var(--ok)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#2a1a0c;border:1px solid var(--acc);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;animation:pop .25s;max-width:92vw;text-align:center}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.exrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#14202a;border:1px solid var(--blue);border-radius:999px;padding:8px 14px;font-weight:800;z-index:30;display:flex;gap:10px;align-items:center}
.rankup{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,138,31,.35),rgba(0,0,0,.85));display:grid;place-items:center;z-index:70;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.glow{animation:glow 1.6s infinite}@keyframes glow{50%{filter:drop-shadow(0 0 14px var(--acc))}}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:8px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px}.seg button.on{border-color:var(--acc);background:#3a2410}
svg .m{transition:fill .4s}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<div id="layer"></div>
<div id="tm"></div>
<script>
(function(){
"use strict";
const LIFTRANK_WEB_VERSION = 1; // bump on every web update (the Android app reads this)
const NATIVE = (typeof window.AppNative!=="undefined") ? window.AppNative : null;

/* ================= ranks ================= */
const TIERS=[["Untrained","#4a4658"],["Bronze","#d0773a"],["Silver","#b9c6d8"],["Gold","#f5b92e"],["Platinum","#3fd6c6"],["Diamond","#5ab8ff"],["Master","#ff4f72"],["Legend","#c56cff"]];
const SUB=["III","II","I"];
function rankOf(level){ // level 0..8
  const l=Math.max(0,Math.min(7.999,level||0)), t=Math.floor(l), f=l-t;
  return {tier:t,name:TIERS[t][0],color:TIERS[t][1],sub:t===0?"":SUB[Math.min(2,Math.floor(f*3))],label:TIERS[t][0]+(t===0?"":" "+SUB[Math.min(2,Math.floor(f*3))]),pts:Math.round(level*155),frac:f};
}
function badge(level,size){
  const r=rankOf(level), s=size||40, c=r.color, n=r.tier;
  const gem=n>=5?`<path d="M20 9l6 7-6 13-6-13z" fill="#fff" opacity=".55"/>`:"";
  const stars=n>0?`<text x="20" y="26" text-anchor="middle" font-size="10" font-weight="900" fill="#1a1020">${r.sub}</text>`:`<text x="20" y="25" text-anchor="middle" font-size="12" font-weight="900" fill="#c9c4d8">–</text>`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 40 40"><path d="M20 2l15 6v11c0 9-6.5 15.5-15 19C11.5 34.5 5 28 5 19V8z" fill="${c}"/><path d="M20 2l15 6v11c0 9-6.5 15.5-15 19z" fill="#000" opacity=".15"/>${gem}${n>=5?"":stars}</svg>`;
}

/* ================= muscles & exercises ================= */
const MUSCLES=[
 ["chest","Chest","upper"],["shoulders","Shoulders","upper"],["biceps","Biceps","upper"],["triceps","Triceps","upper"],["forearms","Forearms","upper"],
 ["traps","Traps","upper"],["upperback","Upper back","upper"],["lats","Lats","upper"],
 ["abs","Abs","core"],["obliques","Obliques","core"],["lowerback","Lower back","core"],
 ["glutes","Glutes","lower"],["quads","Quads","lower"],["hamstrings","Hamstrings","lower"],["calves","Calves","lower"]];
const MNAME=Object.fromEntries(MUSCLES.map(m=>[m[0],m[1]]));
/* kind: w = weight×reps (ratio of 1RM to bodyweight), d = dumbbell weight per hand, r = bodyweight reps, t = seconds
   std: thresholds Bronze, Silver, Gold, Platinum, Diamond (male); prim / sec muscles; lower: lower-body lift (female factor) */
const EX=[
 ["bench","Bench press","w",[.5,.75,1,1.5,2],["chest"],["shoulders","triceps"]],
 ["incline","Incline bench press","w",[.4,.6,.85,1.2,1.6],["chest","shoulders"],["triceps"]],
 ["dbbench","Dumbbell bench press","d",[.2,.3,.45,.65,.85],["chest"],["shoulders","triceps"]],
 ["fly","Machine chest fly","w",[.25,.45,.7,1,1.3],["chest"],[]],
 ["pushup","Push-ups","r",[5,15,30,50,75],["chest"],["triceps","shoulders"]],
 ["dips","Dips","r",[1,6,13,25,40],["triceps","chest"],["shoulders"]],
 ["ohp","Overhead press","w",[.35,.5,.7,.9,1.15],["shoulders"],["triceps"]],
 ["dbpress","Dumbbell shoulder press","d",[.12,.2,.3,.42,.55],["shoulders"],["triceps"]],
 ["lateral","Lateral raise","d",[.05,.1,.15,.25,.35],["shoulders"],[]],
 ["reardelt","Rear delt fly","d",[.05,.1,.15,.22,.3],["shoulders","upperback"],[]],
 ["curl","Barbell curl","w",[.2,.4,.6,.85,1.15],["biceps"],["forearms"]],
 ["dbcurl","Dumbbell curl","d",[.1,.15,.25,.37,.5],["biceps"],["forearms"]],
 ["hammer","Hammer curl","d",[.1,.17,.27,.4,.52],["biceps","forearms"],[]],
 ["pushdown","Triceps pushdown","w",[.25,.4,.6,.85,1.1],["triceps"],[]],
 ["skull","Skull crusher","w",[.15,.3,.5,.75,1],["triceps"],[]],
 ["pullup","Pull-ups","r",[1,4,10,18,25],["lats"],["biceps","upperback"]],
 ["chinup","Chin-ups","r",[1,5,11,19,26],["lats","biceps"],["upperback"]],
 ["pulldown","Lat pulldown","w",[.5,.75,1,1.3,1.65],["lats"],["biceps"]],
 ["row","Barbell row","w",[.4,.6,.85,1.15,1.5],["upperback","lats"],["biceps","lowerback"]],
 ["cablerow","Seated cable row","w",[.4,.6,.85,1.15,1.45],["upperback"],["lats","biceps"]],
 ["dbrow","Dumbbell row","d",[.2,.35,.55,.8,1.05],["lats","upperback"],["biceps"]],
 ["deadlift","Deadlift","w",[1,1.25,1.75,2.5,3],["lowerback","glutes","hamstrings"],["traps","forearms","quads"],1],
 ["shrug","Barbell shrug","w",[.6,.9,1.3,1.8,2.3],["traps"],["forearms"]],
 ["squat","Squat","w",[.75,1,1.5,2,2.75],["quads","glutes"],["lowerback","hamstrings"],1],
 ["legpress","Leg press","w",[1.25,2,3,4.25,5.5],["quads"],["glutes"],1],
 ["rdl","Romanian deadlift","w",[.6,.9,1.25,1.75,2.25],["hamstrings"],["glutes","lowerback"],1],
 ["legcurl","Leg curl","w",[.25,.4,.65,.9,1.2],["hamstrings"],[],1],
 ["legext","Leg extension","w",[.4,.65,1,1.4,1.85],["quads"],[],1],
 ["hipthrust","Hip thrust","w",[.5,1,1.5,2.25,3],["glutes"],["hamstrings"],1],
 ["bulgarian","Bulgarian split squat","d",[.1,.25,.4,.6,.85],["quads","glutes"],[],1],
 ["calf","Standing calf raise","w",[.6,1,1.5,2.1,2.8],["calves"],[],1],
 ["cablecrunch","Cable crunch","w",[.3,.5,.8,1.1,1.5],["abs"],["obliques"]],
 ["legraise","Hanging leg raise","r",[1,5,12,20,30],["abs"],["obliques","forearms"]],
 ["plank","Plank","t",[20,45,90,150,240],["abs"],["obliques","lowerback"]],
 ["sideplank","Side plank","t",[15,30,60,90,150],["obliques"],["abs"]],
 ["backext","Back extension","r",[5,12,20,30,45],["lowerback"],["glutes","hamstrings"]],
 ["wristcurl","Wrist curl","w",[.15,.3,.45,.6,.8],["forearms"],[]]
].map(([id,name,kind,std,prim,sec,lower])=>({id,name,kind,std,prim,sec,lower:!!lower}));
const EXB=Object.fromEntries(EX.map(e=>[e.id,e]));
const QUICK=["bench","squat","deadlift","ohp","pullup","row","curl","pushdown","hipthrust","rdl","calf","legraise","plank","lateral","shrug"];

/* ================= helpers ================= */
const $app=document.getElementById("app"),$nav=document.getElementById("nav"),$layer=document.getElementById("layer");
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function sheet(html,bind){$layer.innerHTML='<div class="modal"><div class="sheet">'+html+'</div></div>';const m=$layer.querySelector(".modal");m.onclick=e=>{if(e.target===m)closeSheet();};bind&&bind($layer.querySelector(".sheet"));}
function closeSheet(){$layer.innerHTML="";}
const fmtDate=k=>new Date(k).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});

/* ================= state ================= */
const LS="liftrank_state_v1";
let state=null, view="rank", filter="all", side="front", workout=null;
function lsGet(){try{const s=localStorage.getItem(LS);return s?JSON.parse(s):null;}catch(e){return null;}}
function save(){state.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}nativeSync();}
function U(){return state.unit==="lb"?2.20462:1;}               // kg → display unit
const toKg=v=>+v/U(), showW=kg=>Math.round(kg*U()*10)/10;
const unitL=()=>state.unit==="lb"?"lb":"kg";

/* ================= ranking engine ================= */
const e1rm=(w,r)=>r<=1?w:w*(1+Math.min(r,12)/30);
function stdFor(ex){
  const f=state.sex==="f"?(ex.kind==="r"?0.45:ex.kind==="t"?0.85:ex.lower?0.7:0.55):1;
  return ex.std.map(x=>x*f);
}
function exValue(ex,set){ // value used for ranking
  if(ex.kind==="r") return +set.reps||0;
  if(ex.kind==="t") return +set.reps||0;          // seconds stored in reps
  return e1rm(+set.kg||0,+set.reps||0)/Math.max(30,state.bw||75);
}
function levelFor(ex,v){
  const s=stdFor(ex), top=s[4], t=[s[0],s[1],s[2],s[3],s[4],top*(ex.kind==="w"||ex.kind==="d"?1.12:1.3),top*(ex.kind==="w"||ex.kind==="d"?1.25:1.6),top*(ex.kind==="w"||ex.kind==="d"?1.4:2)];
  if(!(v>0)) return 0;
  if(v<t[0]) return v/t[0];
  for(let i=0;i<t.length-1;i++) if(v<t[i+1]) return 1+i+(v-t[i])/(t[i+1]-t[i]);
  return 7.999;
}
function valueForLevel(ex,L){ // inverse of levelFor (used for "next rank" targets)
  const s=stdFor(ex), top=s[4], m=ex.kind==="w"||ex.kind==="d";
  const t=[s[0],s[1],s[2],s[3],s[4],top*(m?1.12:1.3),top*(m?1.25:1.6),top*(m?1.4:2)];
  if(L<=1) return t[0]*L; const i=Math.min(6,Math.floor(L)-1), f=L-1-i; return t[i]+(t[i+1]-t[i])*f;
}
function bestPerExercise(){
  const best={};
  const consider=(exId,set,date)=>{ const ex=EXB[exId]; if(!ex) return; const v=exValue(ex,set); if(!(v>0)) return;
    if(!best[exId]||v>best[exId].v) best[exId]={v,set,date}; };
  (state.baseline||[]).forEach(b=>consider(b.ex,b,b.date));
  state.workouts.forEach(w=>w.ex.forEach(e=>e.sets.forEach(st=>{ if(st.done) consider(e.id,st,w.date); })));
  if(workout) workout.ex.forEach(e=>e.sets.forEach(st=>{ if(st.done) consider(e.id,st,workout.date); }));   // live sets count right away
  return best;
}
function muscleLevels(best){
  best=best||bestPerExercise();
  const lv={}, src={}; MUSCLES.forEach(m=>{lv[m[0]]=0;});
  for(const id in best){ const ex=EXB[id], L=levelFor(ex,best[id].v);
    ex.prim.forEach(m=>{ if(L>lv[m]){lv[m]=L;src[m]=id;} });
    ex.sec.forEach(m=>{ const s=L*0.8; if(s>lv[m]){lv[m]=s;src[m]=id+"*";} }); }
  return {lv,src};
}
const overall=lv=>MUSCLES.reduce((a,m)=>a+lv[m[0]],0)/MUSCLES.length;

/* ================= body map ================= */
const FRONT={
 chest:"M102,80 L132,77 Q141,93 133,111 Q117,119 102,113 Z",
 shoulders:"M131,73 Q150,74 153,95 L141,104 Q138,86 131,79 Z",
 biceps:"M141,106 Q154,119 151,146 L139,147 Q133,124 137,107 Z",
 forearms:"M139,151 L152,150 Q159,179 153,206 L145,207 Q137,181 139,151 Z",
 abs:"M102,117 L118,117 L118,178 Q110,187 102,187 Z",
 obliques:"M120,116 L133,113 Q137,150 129,181 L120,179 Z",
 quads:"M102,199 L127,192 Q139,240 131,290 L111,292 Q101,250 102,199 Z",
 calves:"M112,305 L128,303 Q134,340 126,380 L116,380 Q108,340 112,305 Z",
 traps:"M107,62 L124,70 L108,74 Z"};
const BACK={
 traps:"M100,58 L125,71 L117,97 L100,111 Z",
 shoulders:"M127,74 Q150,74 153,95 L141,104 Q137,86 127,80 Z",
 upperback:"M104,100 L126,93 L131,113 L106,119 Z",
 lats:"M106,121 L133,109 Q137,141 121,168 L106,161 Z",
 triceps:"M141,106 Q155,121 151,148 L139,148 Q133,124 137,107 Z",
 forearms:"M139,152 L152,151 Q159,180 153,206 L145,207 Q137,181 139,152 Z",
 lowerback:"M101,163 L120,170 L119,188 L101,188 Z",
 glutes:"M101,191 Q131,186 133,214 Q121,233 101,227 Z",
 hamstrings:"M104,233 L129,227 Q135,261 129,292 L110,292 Q102,262 104,233 Z",
 calves:"M110,305 Q133,300 133,331 Q128,366 120,380 L114,380 Q103,340 110,305 Z"};
function bodySVG(lv,which){
  const P=which==="back"?BACK:FRONT, base="#2a2733";
  const half=Object.entries(P).map(([m,d])=>{ const vis=filter==="all"||(MUSCLES.find(x=>x[0]===m)||[])[2]===filter;
    const c=vis?rankOf(lv[m]).color:"#25222d"; return `<path class="m" data-m="${m}" d="${d}" fill="${c}" stroke="#0b0b10" stroke-width="1.2"/>`; }).join("");
  const sil=`<ellipse cx="100" cy="32" rx="17" ry="21" fill="${base}"/><rect x="92" y="50" width="16" height="16" rx="5" fill="${base}"/>
    <path d="M100,66 L131,72 Q150,74 155,98 Q160,150 157,206 L144,214 Q136,180 136,140 L133,182 L130,196 Q141,250 133,296 Q138,340 128,382 L132,396 L106,396 L109,380 Q103,330 106,300 L100,240 L94,300 Q97,330 91,380 L94,396 L68,396 L72,382 Q62,340 67,296 Q59,250 70,196 L67,182 L64,140 Q64,180 56,214 L43,206 Q40,150 45,98 Q50,74 69,72 Z" fill="${base}"/>`;
  return `<svg viewBox="30 0 140 405" style="width:100%;max-width:170px;display:block;margin:0 auto">${sil}<g>${half}</g><g transform="translate(200,0) scale(-1,1)">${half}</g></svg>`;
}

/* ================= views ================= */
function render(){
  if(!state||!state.setup) return renderOnboarding();
  $nav.style.display="flex";
  const tabs=[["rank","🏆","Rankings"],["train","🏋️","Workout"],["history","📈","History"],["me","👤","Profile"]];
  $nav.innerHTML=tabs.map(([k,i,l])=>`<button data-v="${k}" class="${view===k?"on":""}"><span class="i">${i}</span>${l}${k==="train"&&workout?" •":""}</button>`).join("");
  $nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render();window.scrollTo(0,0);});
  ({rank:renderRank,train:renderTrain,history:renderHistory,me:renderMe})[view]();
  renderTimer();
}

/* ---------- rankings ---------- */
function renderRank(){
  const best=bestPerExercise(), {lv,src}=muscleLevels(best), ov=overall(lv), R=rankOf(ov);
  const list=MUSCLES.filter(m=>filter==="all"||m[2]===filter);
  const focus=MUSCLES.slice().sort((a,b)=>lv[a[0]]-lv[b[0]]).slice(0,3).map(m=>m[0]);
  const nextLv=Math.floor(ov*3+1)/3;
  $app.innerHTML=`
    <div class="row between" style="margin:4px 0 12px"><h1>Muscle rankings</h1>${apkUpdate&&NATIVE&&NATIVE.installApk?`<button class="chip on" id="apkgo">📦 Update</button>`:""}</div>
    <div class="card" style="background:radial-gradient(circle at 50% 0%,#2b1a10,var(--card) 60%)">
      <div class="row" style="justify-content:center;gap:8px;margin-bottom:6px">${["front","back"].map(s=>`<button class="chip ${side===s?"on":""}" data-side="${s}">${s==="front"?"Front":"Back"}</button>`).join("")}<button class="chip" id="both">Both</button></div>
      ${side==="both"?`<div class="row" style="gap:0">${["front","back"].map(s=>`<div style="flex:1">${bodySVG(lv,s)}</div>`).join("")}</div>`:bodySVG(lv,side)}
      <div class="legend">${TIERS.map(t=>`<span><i class="dot" style="background:${t[1]}"></i>${t[0]}</span>`).join("")}</div>
      <div class="center" style="margin-top:14px"><div class="small mut">Overall rank</div>
        <div class="row" style="justify-content:center;gap:8px;margin-top:4px"><span class="glow">${badge(ov,46)}</span><div style="text-align:left"><div style="font-size:24px;font-weight:900;color:${R.color}">${R.label}</div><div class="small mut">${R.pts} points</div></div></div>
        <div class="bar" style="margin:10px auto 0;max-width:240px"><i style="width:${Math.round(((ov*3)%1)*100)}%;background:${R.color}"></i></div>
        <div class="tiny mut" style="margin-top:4px">${ov>=7.99?"Maxed out 👑":"Next: "+rankOf(nextLv).label}</div></div>
    </div>
    <div class="row" style="gap:8px;margin:16px 0 12px;overflow-x:auto">${[["all","All"],["upper","Upper body"],["lower","Lower body"],["core","Core"]].map(([k,l])=>`<button class="chip ${filter===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>

function isPR(id,st){ const ex=EXB[id], v=exValue(ex,st); let best=0;
  if(workout) workout.ex.forEach(e=>{ if(e.id===id) e.sets.forEach(s=>{ if(s.done&&s!==st) best=Math.max(best,exValue(ex,s)); }); }); (state.baseline||[]).forEach(b=>{if(b.ex===id)best=Math.max(best,exValue(ex,b));});
  state.workouts.forEach(w=>w.ex.forEach(e=>{ if(e.id===id) e.sets.forEach(s=>{ if(s.done) best=Math.max(best,exValue(ex,s)); }); })); return v>best; }

  $app.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{state.unit=b.dataset.unit;save();render();});
  $app.querySelector("#base").onclick=()=>editBaseline(false);
  const ro=$app.querySelector("#remon"); ro&&(ro.onclick=()=>{state.rem=state.rem||{on:false,t:"18:00"};state.rem.on=!state.rem.on;if(state.rem.on){try{NATIVE.askPermission();}catch(e){}toast("Reminder at "+state.rem.t);}save();render();});
  const rt=$app.querySelector("#remt"); rt&&(rt.onchange=()=>{if(/^\d\d:\d\d$/.test(rt.value)){state.rem.t=rt.value;save();toast("Reminder at "+rt.value);}});
  const up=$app.querySelector("#upd"); up&&(up.onclick=()=>{try{NATIVE.checkUpdates();toast("Checking for updates…");}catch(e){}});
  $app.querySelector("#cp").onclick=async()=>{const txt=JSON.stringify(state);try{await navigator.clipboard.writeText(txt);toast("Backup copied");}catch(e){sheet('<h2 style="margin-top:0">Your backup</h2><textarea rows="8" readonly style="width:100%;background:var(--card2);color:var(--txt);border-radius:12px;padding:10px">'+esc(txt)+'</textarea><button class="btn full" style="margin-top:10px" id="dn">Done</button>',s=>{s.querySelector("#dn").onclick=closeSheet;});}};
  $app.querySelector("#rs").onclick=()=>sheet('<h2 style="margin-top:0">Restore backup</h2><textarea id="rt2" rows="8" style="width:100%;background:var(--card2);color:var(--txt);border-radius:12px;padding:10px" placeholder="Paste backup"></textarea><button class="btn full" style="margin-top:10px" id="rok">Restore</button>',s=>{s.querySelector("#rok").onclick=()=>{try{const d=JSON.parse(s.querySelector("#rt2").value);if(!d||!Array.isArray(d.workouts))throw 0;state=fix(d);save();closeSheet();render();toast("Restored ✓");}catch(e){toast("Not a LiftRank backup");}};});
}

/* ---------- onboarding ---------- */
let ob={step:0,name:"",sex:"m",bw:"",unit:"kg"};
function renderOnboarding(){
  $nav.style.display="none";
  if(ob.step===0){
    $app.innerHTML=`<div class="center" style="margin:44px 0 24px"><div style="font-size:60px">🏋️</div><h1 style="font-size:30px">LiftRank</h1><p class="mut" style="margin-top:6px">Rank every muscle from Untrained to Legend – based on your real lifts.</p></div>
      <label class="small mut">Your name</label><input id="nm" maxlength="24" value="${esc(ob.name)}" style="margin:4px 0 12px">
      <label class="small mut">Strength standards</label><div class="seg" style="margin:6px 0 12px">${[["m","Male"],["f","Female"]].map(([k,l])=>`<button data-sex="${k}" class="${ob.sex===k?"on":""}">${l}</button>`).join("")}</div>
      <label class="small mut">Units</label><div class="seg" style="margin:6px 0 12px">${["kg","lb"].map(k=>`<button data-unit="${k}" class="${ob.unit===k?"on":""}">${k}</button>`).join("")}</div>
      <label class="small mut">Bodyweight (${ob.unit})</label><input id="bw" inputmode="decimal" value="${esc(ob.bw)}" placeholder="e.g. ${ob.unit==="kg"?75:165}" style="margin:4px 0 18px">
      <button class="btn full" id="go">Continue</button>`;
    const keep=()=>{ob.name=$app.querySelector("#nm").value;ob.bw=$app.querySelector("#bw").value;};
    $app.querySelectorAll("[data-sex]").forEach(b=>b.onclick=()=>{keep();ob.sex=b.dataset.sex;render();});
    $app.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{keep();ob.unit=b.dataset.unit;render();});
    $app.querySelector("#go").onclick=()=>{ keep(); let bw=parseFloat(String(ob.bw).replace(",","."));
      if(!(bw>0)){ toast("Enter your bodyweight"); return; } if(ob.unit==="lb") bw=bw/2.20462; if(bw<30||bw>300){ toast("Enter a realistic bodyweight"); return; }
      state={v:1,name:ob.name.trim(),sex:ob.sex,unit:ob.unit,bw:Math.round(bw*10)/10,workouts:[],baseline:[],rest:90,rem:{on:false,t:"18:00"},created:Date.now(),setup:false};
      ob.step=1; save(); render(); };
    return;
  }
  editBaseline(true);
}
function editBaseline(first){
  const vals={}; (state.baseline||[]).forEach(b=>vals[b.ex]=b);
  const html=`<h1 style="margin:${first?"24px":"0"} 0 4px">Your best lifts</h1><p class="small mut" style="margin-bottom:12px">Enter what you can do right now (a recent best set). Skip anything you don't know – you can also just start logging workouts.</p>
    ${QUICK.map(id=>{ const ex=EXB[id], v=vals[id]||{}; return `<div class="row" style="margin-bottom:8px"><div style="flex:1"><b class="small">${esc(ex.name)}</b><div class="tiny mut">${ex.prim.map(m=>MNAME[m]).join(", ")}</div></div>
      ${ex.kind==="w"||ex.kind==="d"?`<input data-bk="${id}" inputmode="decimal" placeholder="${unitL()}" value="${v.kg?showW(v.kg):""}" style="width:76px;padding:9px">`:""}<input data-br="${id}" inputmode="numeric" placeholder="${ex.kind==="t"?"sec":"reps"}" value="${v.reps||""}" style="width:${ex.kind==="w"||ex.kind==="d"?62:110}px;padding:9px"></div>`; }).join("")}
    <button class="btn full" id="sv" style="margin-top:12px">${first?"Show my ranks 🏆":"Save"}</button>${first?`<button class="btn ghost full small" id="skip" style="margin-top:8px">Skip for now</button>`:""}`;
  const apply=root=>{ const out=[], t=todayKey();
    QUICK.forEach(id=>{ const ex=EXB[id], k=root.querySelector(`[data-bk="${id}"]`), r=root.querySelector(`[data-br="${id}"]`);
      const kg=k&&k.value!==""?toKg(parseFloat(k.value.replace(",","."))||0):0, reps=r&&r.value!==""?parseInt(r.value)||0:0;
      if((ex.kind==="w"||ex.kind==="d")?(kg>0&&reps>0):reps>0) out.push({ex:id,kg:Math.round(kg*100)/100,reps:reps||1,date:t}); });
    state.baseline=out; };
  if(first){
    $app.innerHTML=html;
    $app.querySelector("#sv").onclick=()=>{ apply($app); state.setup=true; save(); view="rank"; render(); window.scrollTo(0,0); toast(state.baseline.length?"Here are your ranks!":"Log a workout to get ranked"); };
    $app.querySelector("#skip").onclick=()=>{ state.setup=true; save(); view="rank"; render(); };
  } else sheet(html,s=>{ s.querySelector("#sv").onclick=()=>{ apply(s); save(); closeSheet(); render(); toast("Saved – ranks updated"); }; });
}

/* ================= Android bridge ================= */
let apkUpdate=null;
window.ascendApkUpdate=function(v){ apkUpdate=v; if(state&&state.setup&&view==="rank") render(); };
window.ascendToast=function(m){ toast(m); };
function nativeSync(){
  if(!NATIVE||!state||!state.setup) return;
  try{ const t=todayKey(), trained=state.workouts.some(w=>w.date===t)?1:0;
    NATIVE.report(t,trained,1,state.streakW||0,state.name||"");
    const r=state.rem||{on:false,t:"18:00"}; NATIVE.setReminders(JSON.stringify({m:{on:false,t:"08:00"},e:{on:!!r.on,t:r.t}})); }catch(e){}
}
function fix(s){ s.workouts=s.workouts||[]; s.baseline=s.baseline||[]; s.rest=s.rest||90; s.rem=s.rem||{on:false,t:"18:00"}; s.unit=s.unit||"kg"; s.sex=s.sex||"m"; return s; }

/* ================= boot ================= */
state=lsGet(); if(state) fix(state);
if(state&&state.active){ workout=state.active; }
render(); nativeSync();
try{ const seen=+localStorage.getItem("liftrank_seen_ver")||0; if(state&&seen&&seen<LIFTRANK_WEB_VERSION) setTimeout(()=>toast("✨ LiftRank updated"),400); localStorage.setItem("liftrank_seen_ver",String(LIFTRANK_WEB_VERSION)); }catch(e){}
window.addEventListener("focus",()=>{ if(state&&state.setup) render(); });
window.__lr={get state(){return state;},muscleLevels,levelFor,EXB,rankOf,valueForLevel};
})();
</script>
