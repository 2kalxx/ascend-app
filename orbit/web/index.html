<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Orbit Crush</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100%;overflow:hidden;touch-action:manipulation}
#game{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.coins{display:flex;align-items:center;gap:6px;font-size:26px;font-weight:900;letter-spacing:.5px}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,#f5a524 55%,#c97a0a);box-shadow:inset 0 0 0 3px #d98a12;display:grid;place-items:center;font-size:14px;color:#8a4b00;font-weight:900}
.coin.sm{width:18px;height:18px;font-size:9px;box-shadow:inset 0 0 0 2px #d98a12}
.icon{width:40px;height:40px;border-radius:12px;background:#151515;border:1px solid #2a2a2a;display:grid;place-items:center;font-size:18px;position:relative}
.icon.off{opacity:.4}.icon.off:after{content:"";position:absolute;width:26px;height:2.5px;background:#ff5a6a;transform:rotate(-45deg);border-radius:2px}
#stage{text-align:center;margin-top:4px;color:#9aa;font-size:13px;font-weight:800;letter-spacing:1px}
#stage b{color:#fff}#stage .best{color:#7a8;font-weight:700}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:46vh;overflow:auto;padding:4px 0 8px}
.lv{aspect-ratio:1;border-radius:12px;background:#1c1c1f;border:1px solid #333;color:#fff;font:inherit;font-weight:900;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lv small{font-size:9px;color:#ffd36a;letter-spacing:-1px}.lv.cur{border-color:#e8b33a;background:#2a2410}.lv.lock{opacity:.35}
.card .t .ic{font-size:15px}.card.new{border-color:#5ab8ff}
#flash{position:absolute;inset:0;pointer-events:none}
#pbar{height:5px;width:150px;margin:6px auto 0;background:#1b1b1b;border-radius:9px;overflow:hidden}#pbar i{display:block;height:100%;background:linear-gradient(90deg,#b6f23a,#33e39b);width:0}
#wrap{flex:1;display:grid;place-items:center;position:relative;min-height:0}
canvas{display:block;touch-action:none}
#rate{position:absolute;bottom:4px;left:0;right:0;text-align:center;color:#6c7;font-size:12px;font-weight:700}
#boost{position:absolute;top:6px;left:50%;transform:translateX(-50%);color:#ffd36a;font-weight:900;font-size:14px;opacity:0;transition:opacity .2s}
#cards{display:flex;gap:10px;overflow-x:auto;padding:10px 14px 14px;scrollbar-width:none}
#cards::-webkit-scrollbar{display:none}
.card{flex:none;width:96px;border-radius:14px;background:linear-gradient(#26262c,#18181c);border:2px solid #3a3a42;overflow:hidden;text-align:center;position:relative;transition:transform .08s}
.card:active{transform:scale(.95)}
.card .t{font-size:13px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-top:9px;font-variant:small-caps}
.card .l{font-size:10px;color:#9a9aa6;font-weight:700;letter-spacing:.5px}
.card .v{font-size:30px;font-weight:900;margin:4px 0 2px}
.card .b{height:5px;margin:0 12px 9px;background:#0e0e10;border-radius:9px;overflow:hidden}.card .b i{display:block;height:100%;background:#f5b02a}
.card .c{background:#3a3a44;padding:7px 0;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.card.ok{border-color:#e8b33a;box-shadow:0 0 14px rgba(245,176,42,.25)}
.card.ok .c{background:linear-gradient(#f6c247,#e09a14);color:#3a2100}
.card.max .c{background:#2a2a30;color:#888}
.hand{position:absolute;right:-6px;bottom:-4px;font-size:38px;pointer-events:none;animation:tap 1s ease-in-out infinite}
@keyframes tap{50%{transform:translate(-6px,-8px) scale(.92)}}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(10,10,12,.96);border:2px solid #e8b33a;border-radius:20px;padding:22px 20px;text-align:center;z-index:30;width:min(320px,86vw);animation:in .25s}
@keyframes in{from{opacity:0;transform:translate(-50%,-44%)}}
.pop h1{font-size:24px;margin:6px 0}
.btn{display:block;width:100%;margin-top:14px;padding:13px;border-radius:14px;border:0;font:inherit;font-weight:900;font-size:16px;background:linear-gradient(#f6c247,#e09a14);color:#3a2100}
.btn.g{background:#222;color:#ddd;border:1px solid #333}
.float{position:fixed;font-weight:900;color:#ffd36a;pointer-events:none;font-size:15px;animation:fl .9s ease-out forwards;z-index:5;text-shadow:0 1px 4px #000}
@keyframes fl{to{transform:translateY(-36px);opacity:0}}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40;display:flex;align-items:flex-end}
.menu .sh{background:#121214;border-top:1px solid #2a2a2a;border-radius:20px 20px 0 0;width:100%;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #222}
.tg{padding:7px 14px;border-radius:10px;border:1px solid #333;background:#1c1c1f;color:#ddd;font:inherit;font-weight:700}
.tg.on{background:#2a2410;border-color:#e8b33a;color:#ffd36a}
.rubyB{display:flex;align-items:center;gap:5px;height:40px;padding:0 11px;border-radius:12px;background:#1d0d14;border:1px solid #6b1f3a;color:#ff7aa2;font:inherit;font-weight:900;font-size:15px}
.rubyB.glow{box-shadow:0 0 14px rgba(255,60,120,.55);border-color:#ff4f8b}
.tree{position:fixed;inset:0;background:#08080a;z-index:45;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.tree h2{font-size:22px}.tree .hd{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-14px;background:#08080a;padding:6px 0 10px;z-index:2}
.br{margin:16px 0 0;padding-left:14px;border-left:3px solid var(--c)}
.br>h3{font-size:13px;letter-spacing:2px;color:var(--c);margin:0 0 8px -14px;padding-left:10px}
.node{display:flex;gap:10px;align-items:center;background:#141418;border:1px solid #2a2a30;border-radius:14px;padding:10px;margin:0 0 8px;position:relative}
.node:before{content:"";position:absolute;left:-15px;top:50%;width:14px;height:3px;background:var(--c)}
.node.root:before{display:none}
.node .ni{font-size:24px;width:34px;text-align:center}.node .nt{flex:1;min-width:0}
.node .nn{font-weight:900;font-size:15px}.node .nn small{color:#888;font-weight:700;font-size:11px;margin-left:4px}
.node .nd{font-size:12px;color:#aaa;margin-top:2px}.node .key{font-size:10px;color:#ffd36a;font-weight:900;letter-spacing:1px}
.node .pips{display:flex;gap:3px;margin-top:5px}.node .pips i{width:12px;height:4px;border-radius:2px;background:#333}.node .pips i.on{background:var(--c)}
.node button{min-width:62px;padding:9px 8px;border-radius:11px;border:0;font:inherit;font-weight:900;font-size:14px;background:#2a2a30;color:#777}
.node button.ok{background:linear-gradient(#ff6b9a,#d91e5b);color:#fff}
.node.lock{opacity:.4}.node.maxd{border-color:var(--c)}
</style>
</head>
<body>
<div id="game">
  <div id="top"><div style="display:flex;gap:8px"><button class="icon" id="menuB">☰</button><button class="rubyB" id="treeB">💎 <span id="rubyT">0</span></button></div><div class="coins"><div class="coin">◉</div><span id="coinT">0</span></div><div style="display:flex;gap:8px"><button class="icon" id="hapB">📳</button><button class="icon" id="sndB">🔊</button></div></div>
  <div id="stage"></div><div id="pbar"><i></i></div>
  <div id="wrap"><div id="boost">⚡ BOOST</div><canvas id="cv"></canvas><div id="rate"></div></div>
  <div id="cards"></div>
</div>
<div id="layer"></div>
<script>
(function(){
"use strict";
const ORBIT_WEB_VERSION = 6; // bump on every web update (the Android app reads this)
const NATIVE=(typeof window.AppNative!=="undefined")?window.AppNative:null;
function fmt(n){ n=Math.floor(n); if(n<1000) return String(n); const u=["K","M","B","T","Qa","Qi"]; let i=-1; while(n>=1000&&i<u.length-1){ n/=1000; i++; } return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i]; }
const mmss=t=>Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");

/* ================= upgrades (reset every level) ================= */
const UP=[
 {id:"size",  ic:"⚪",name:"Size",   start:1,max:40,base:4,  grow:1.45,show:l=>l},
 {id:"speed", ic:"💨",name:"Speed",  start:1,max:20,base:5,  grow:1.45,show:l=>"x"+(1+0.15*(l-1)).toFixed(1)},
 {id:"power", ic:"💥",name:"Power",  start:1,max:30,base:6,  grow:1.5, show:l=>l},
 {id:"income",ic:"💰",name:"Income", start:1,max:30,base:8,  grow:1.5, show:l=>"+"+l},
 {id:"bomb",  ic:"💣",name:"Bomb",   start:0,max:10,base:40, grow:1.75,show:l=>l?bombEvery(l).toFixed(1)+"s":"OFF"},
 {id:"laser", ic:"🔦",name:"Laser",  start:0,max:10,base:110,grow:1.9, show:l=>l?"Lv "+l:"OFF"},
 {id:"shards",ic:"✨",name:"Shards", start:0,max:10,base:35, grow:1.7, req:"shards",show:l=>l?(1+l)+"x":"OFF"},
 {id:"zap",   ic:"⚡",name:"Zap",    start:0,max:10,base:50, grow:1.75,req:"storm", show:l=>l?(l*1.5).toFixed(1)+"/s":"OFF"},
];
const costOf=(u,l)=>Math.ceil(u.base*Math.pow(u.grow,l-u.start)*(1-0.06*T("bargain")));
const visUP=()=>UP.filter(u=>!u.req||T(u.req)>0);
const ballRadius=l=>9+l*1.9;
const ballSpeed=l=>170*(1+0.15*(l-1));
const dpsOf=l=>12*Math.pow(1.28,l-1);
const bombEvery=l=>Math.max(1,6.2-0.55*l);
const bombRadius=l=>30+8*l;
const regrowDelay=()=>2;
const laserDps=l=>dpsOf(1)*0.45*l;
/* ================= Ascend tree (permanent, paid with rubies) ================= */
const BR=[{id:"ball",name:"BALL",c:"#7fd8ff"},{id:"eco",name:"ECONOMY",c:"#ffd36a"},{id:"boom",name:"EXPLOSIVES",c:"#ff8a3d"},{id:"beam",name:"LASER & STORM",c:"#ff4f6b"}];
const TREE=[
 {id:"root",br:null,ic:"✨",name:"Ascend",max:1,cost:()=>1,d:()=>"+10% coins in every level. Opens all branches."},
 {id:"heavy",br:"ball",req:"root",ic:"🏋️",name:"Heavy Ball",max:5,cost:l=>1+l,d:()=>"+15% ball damage per level"},
 {id:"bigstart",br:"ball",req:"heavy",ic:"⚪",name:"Big Start",max:5,cost:l=>2+l,d:()=>"Start every level with +1 Size per level"},
 {id:"fire",br:"ball",req:"heavy",ic:"🔥",name:"Fire Trail",max:3,cost:l=>5+2*l,key:1,d:()=>"Ball leaves a burning trail that damages blocks and stops them regrowing"},
 {id:"shards",br:"ball",req:"bigstart",ic:"✨",name:"Shards",max:1,cost:()=>7,key:1,d:()=>"New upgrade card: wall bounces fire piercing shards into the blocks"},
 {id:"homing",br:"ball",req:"bigstart",ic:"🧲",name:"Homing Ball",max:1,cost:()=>10,key:1,d:()=>"Ball curves toward the nearest blocks – great for the last stragglers"},
 {id:"rich",br:"eco",req:"root",ic:"💰",name:"Rich Start",max:5,cost:l=>1+l,d:()=>"Start every level with +25 coins per level"},
 {id:"golden",br:"eco",req:"root",ic:"🪙",name:"Golden Touch",max:5,cost:l=>2+l,d:()=>"+15% coins per level"},
 {id:"bargain",br:"eco",req:"golden",ic:"🏷️",name:"Bargain",max:5,cost:l=>2+2*l,d:()=>"Upgrades cost 6% less per level"},
 {id:"hunter",br:"eco",req:"bargain",ic:"💎",name:"Ruby Hunter",max:3,cost:l=>6+3*l,d:()=>"+1 extra ruby per level the first time you clear a level"},
 {id:"auto",br:"eco",req:"rich",ic:"🤖",name:"Auto-Buyer",max:1,cost:()=>9,key:1,d:()=>"Automatically buys the cheapest upgrade (switch on/off in ☰)"},
 {id:"bombkit",br:"boom",req:"root",ic:"💣",name:"Bomb Kit",max:3,cost:l=>2+l,d:()=>"Start every level with Bomb +1 per level"},
 {id:"bigboom",br:"boom",req:"bombkit",ic:"💥",name:"Big Boom",max:5,cost:l=>2+l,d:()=>"+12% bomb blast size per level"},
 {id:"chain",br:"boom",req:"bigboom",ic:"🧨",name:"Chain Reaction",max:5,cost:l=>4+2*l,key:1,d:()=>"Every destroyed block has a 3% chance per level to explode"},
 {id:"detonator",br:"boom",req:"bombkit",ic:"👆",name:"Detonator",max:1,cost:()=>9,key:1,d:()=>"Tapping the ring drops a bomb where you tap (4s cooldown) instead of boost"},
 {id:"laserkit",br:"beam",req:"root",ic:"🔦",name:"Laser Kit",max:3,cost:l=>3+l,d:()=>"Start every level with Laser +1 per level"},
 {id:"overclock",br:"beam",req:"root",ic:"⚡",name:"Overclock",max:3,cost:l=>2+l,d:()=>"Tap boost lasts +1s per level"},
 {id:"frost",br:"beam",req:"laserkit",ic:"❄️",name:"Frost",max:3,cost:l=>3+2*l,d:()=>"Regrown blocks come back 15% weaker per level (timer stays 2s)"},
 {id:"twin",br:"beam",req:"laserkit",ic:"✖️",name:"Twin Laser",max:1,cost:()=>10,key:1,d:()=>"A second laser beam sweeps across the first"},
 {id:"storm",br:"beam",req:"overclock",ic:"🌩️",name:"Storm",max:1,cost:()=>8,key:1,d:()=>"New upgrade card: Zap – lightning destroys random blocks"}
];
const T=id=>(S&&S.tree&&S.tree[id])||0;
const treeSpent=()=>TREE.reduce((a,n)=>{ let c=0; for(let l=0;l<T(n.id);l++) c+=n.cost(l); return a+c; },0);
const coinMult=()=>(1+0.1*T("root"))*(1+0.15*T("golden"));
const startLv=u=>u.start+(u.id==="size"?T("bigstart"):u.id==="bomb"?T("bombkit"):u.id==="laser"?T("laserkit"):0);
/* ================= persistent data: settings + best times only ================= */
const LS="orbit_state_v2";
let S=null, run=null;
function fresh(){ return {sound:true,haptic:true,unlocked:1,best:{},stars:{},hint:true,cur:null,rubies:0,tree:{},auto:true}; }
function load(){ try{ const s=JSON.parse(localStorage.getItem(LS)); if(s&&s.best){ const o=Object.assign(fresh(),s); if(s.rubies==null) o.rubies=Object.values(o.stars).reduce((a,b)=>a+b,0); return o; } }catch(e){}
  const f=fresh(); try{ const old=JSON.parse(localStorage.getItem("orbit_state_v1")); if(old){ f.sound=old.sound!==false; f.haptic=old.haptic!==false; f.unlocked=Math.max(1,old.stage||1); } }catch(e){} return f; }
let saveT=0; function save(force){ const now=Date.now(); if(!force&&now-saveT<2500) return; saveT=now; if(run) S.cur=packRun(); try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }

/* ================= arena ================= */
const R=200, GRID=46, CELL=2*R/GRID;
let cells=[], aliveCount=0, totalCells=0, layer=null, lctx=null, gt=0;
const PATTERNS=["full","rings","spiral","checker","cross","dots","waves","hollow","diamond","stripes"];
function inPattern(p,x,y,i,j){ const d=Math.hypot(x,y)/R, a=Math.atan2(y,x);
  switch(p){ case "rings": return Math.floor(d*7)%2===0||d>0.92; case "spiral": return Math.sin(a*3+d*14)>-0.35;
    case "checker": return ((Math.floor(i/4)+Math.floor(j/4))%2===0)||d<0.25; case "cross": return Math.abs(x)<R*0.28||Math.abs(y)<R*0.28||d>0.8;
    case "dots": return Math.hypot((i%8)-3.5,(j%8)-3.5)<3.2; case "waves": return Math.sin(x/22+Math.sin(y/30)*2)>-0.5;
    case "hollow": return d>0.35; case "diamond": return Math.abs(x)+Math.abs(y)<R*0.95||d>0.88; case "stripes": return Math.floor((x+y+400)/26)%2===0||d>0.9;
    default: return true; } }
const levelHP=lv=>Math.round(8*Math.pow(1.16,Math.min(lv,31)-1)*Math.pow(1.07,Math.max(0,lv-31)));
const PAL=[[[210,255,60],[40,230,120]],[[90,220,255],[150,90,255]],[[255,190,60],[255,80,120]],[[120,255,220],[40,140,255]],[[255,120,220],[255,220,90]],[[180,255,120],[255,240,90]]];
function cellColor(lv,d,f){ const [a,b]=PAL[(lv-1)%PAL.length], t=Math.min(1,d), k=0.4+0.6*f;
  return `rgb(${Math.round((a[0]+(b[0]-a[0])*(1-t))*k)},${Math.round((a[1]+(b[1]-a[1])*(1-t))*k)},${Math.round((a[2]+(b[2]-a[2])*(1-t))*k)})`; }
function buildCells(lv){
  const p=lv===1?"full":PATTERNS[(lv-1)%PATTERNS.length], hp=levelHP(lv);
  cells=[];
  for(let j=0;j<GRID;j++) for(let i=0;i<GRID;i++){ const x=-R+CELL*(i+0.5), y=-R+CELL*(j+0.5), d=Math.hypot(x,y);
    cells.push(d>R-CELL*0.6||!inPattern(p,x,y,i,j)?null:{x,y,d:d/R,max:hp,hp,alive:true,touch:0,grow:0}); }
  aliveCount=totalCells=cells.filter(Boolean).length;
}
function packRun(){ return {level:run.level,coins:run.coins,lv:run.lv,time:run.time,gt,a:cells.map(c=>c?(c.alive?Math.ceil(c.hp):-Math.round((gt-c.touch)*10)/10-0.01):null)}; }
function startLevel(lv,resume){
  cleared=false; document.querySelectorAll(".pop").forEach(x=>x.remove());
  run={level:lv,coins:25*T("rich"),lv:Object.fromEntries(UP.map(u=>[u.id,startLv(u)])),time:0};
  buildCells(lv); gt=0;
  if(resume&&resume.level===lv&&Array.isArray(resume.a)&&resume.a.length===cells.length){
    run.coins=resume.coins||0; run.lv=Object.assign(run.lv,resume.lv||{}); run.time=resume.time||0; gt=resume.gt||0; aliveCount=0;
    cells.forEach((c,k)=>{ if(!c) return; const v=resume.a[k]; if(v>0){ c.hp=Math.min(c.max,v); c.alive=true; aliveCount++; } else { c.alive=false; c.hp=0; c.touch=gt+(v||0); } });
  }
  balls=[]; syncBalls(); laserA=0; bombT=0; fires=[]; shards=[]; zaps=[]; chainQ=[]; zapT=0; detCD=0; drawLayer(); S.cur=packRun(); save(true); uiCards(true);
}
/* ================= rendering ================= */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let scale=1, cx=0, cy=0, size=0;
function resize(){ const wrap=document.getElementById("wrap"), w=wrap.clientWidth, h=wrap.clientHeight;
  size=Math.max(200,Math.min(w-28,h-28)); const dpr=Math.min(2.5,window.devicePixelRatio||1);
  cv.style.width=cv.style.height=size+"px"; cv.width=cv.height=Math.round(size*dpr);
  scale=cv.width/(2*R+24); cx=cy=cv.width/2;
  layer=document.createElement("canvas"); layer.width=layer.height=cv.width; lctx=layer.getContext("2d"); drawLayer(); }
function cellRect(c){ const s=CELL*scale, gap=Math.max(1,s*0.12); return [cx+(c.x-CELL/2)*scale+gap/2, cy+(c.y-CELL/2)*scale+gap/2, s-gap]; }
function drawCell(c){ if(!lctx) return; const [x,y,w]=cellRect(c); lctx.clearRect(x-1,y-1,w+2,w+2); if(!c.alive) return;
  lctx.fillStyle=cellColor(run.level,c.d,c.hp/c.max); const r=Math.max(1,w*0.24); lctx.beginPath(); lctx.moveTo(x+r,y); lctx.arcTo(x+w,y,x+w,y+w,r); lctx.arcTo(x+w,y+w,x,y+w,r); lctx.arcTo(x,y+w,x,y,r); lctx.arcTo(x,y,x+w,y,r); lctx.fill(); }
function drawLayer(){ if(!lctx) return; lctx.clearRect(0,0,layer.width,layer.height); cells.forEach(c=>{ if(c&&c.alive) drawCell(c); }); }

/* ================= gameplay ================= */
let balls=[], parts=[], rings=[], boostUntil=0, laserA=0, bombT=0, regrowT=0, cleared=false, fires=[], shards=[], zaps=[], chainQ=[], zapT=0, detCD=0, fireT=0, homeT=0, autoT=0;
function syncBalls(){ const n=1; while(balls.length<n){ const a=Math.random()*Math.PI*2; balls.push({x:Math.cos(a)*R*0.3,y:Math.sin(a)*R*0.3,a:Math.random()*Math.PI*2,trail:[]}); } balls.length=n; }
function hitCell(k,dmg){ const c=cells[k]; if(!c) return 0; c.touch=gt; if(!c.alive) return 0;
  const chip=Math.min(dmg,c.hp)/c.max*run.lv.income*0.5; c.hp-=dmg; if(c.hp<=0){ c.alive=false; c.hp=0; aliveCount--; drawCell(c); if(T("chain")&&chainQ.length<40&&Math.random()<0.03*T("chain")) chainQ.push([c.x,c.y]); if(parts.length<220) parts.push({x:c.x,y:c.y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,t:0.45,col:cellColor(run.level,c.d,1)}); return run.lv.income+chip; }
  if(Math.random()<0.2) drawCell(c); return chip; }

  L.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ const n=TREE.find(x=>x.id===b.dataset.n); if(!canBuyNode(n)) return; S.rubies-=n.cost(T(n.id)); S.tree[n.id]=T(n.id)+1; applyTree(); save(true); buzz(); if(S.sound){ tick(700,0.04); setTimeout(()=>tick(1050,0.05),70); } const sc=L.querySelector(".tree").scrollTop; openTree(); L.querySelector(".tree").scrollTop=sc; });
  L.querySelector("#tcl").onclick=()=>{ L.innerHTML=""; uiCards(true); };
  L.querySelector("#resp").onclick=()=>{ if(!treeSpent()) return; S.rubies+=treeSpent(); S.tree={}; applyTree(); save(true); openTree(); };
}
// tree changes apply right away to the running level (start bonuses only raise, never lower)
function applyTree(){ if(!run) return; for(const u of UP){ run.lv[u.id]=Math.max(Math.min(run.lv[u.id],u.max),u.req&&!T(u.req)?0:Math.min(u.max,startLv(u))); if(u.req&&!T(u.req)) run.lv[u.id]=0; } uiCards(true); }
$("treeB").onclick=openTree;
let apkUpdate=null;
window.ascendApkUpdate=v=>{ apkUpdate=v; floatText("📦 Update ready – see ☰",innerWidth/2-90,90); };
window.ascendToast=m=>floatText(m,innerWidth/2-80,90);
/* ================= boot & loop ================= */
S=load(); syncIcons();
resize();
if(S.cur&&S.cur.level) startLevel(S.cur.level,S.cur); else startLevel(Math.min(S.unlocked,S.unlocked));
window.addEventListener("resize",resize);
let lastT=performance.now(), uiT=0;
function frame(t){ const dt=Math.min(0.05,(t-lastT)/1000); lastT=t; if(run&&!document.querySelector(".pop,.menu,.tree")) step(dt); if(run){ render(); uiT+=dt; if(uiT>0.12){ uiT=0; uiTop(); uiCards(); save(); } } requestAnimationFrame(frame); }
requestAnimationFrame(frame);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) save(true); else lastT=performance.now(); });
window.addEventListener("pagehide",()=>save(true));
try{ const seen=+localStorage.getItem("orbit_seen_ver")||0; if(seen&&seen<ORBIT_WEB_VERSION) setTimeout(()=>popup(`<div style="font-size:44px">✨</div><h1>New: Rubies & Ascend tree!</h1><p style="color:#bbb">Clear levels to earn 💎 rubies (1 per star). Spend them in the Ascend tree (💎 button, top left) on permanent upgrades and new play styles: Fire Trail, Homing Ball, Detonator, Twin Laser, Shards, Zap, Auto-Buyer and more. You already got rubies for the stars you have.</p><button class="btn" id="ok">Let's go</button>`),400); localStorage.setItem("orbit_seen_ver",String(ORBIT_WEB_VERSION)); }catch(e){}
/* test hooks */
let simResult=null;
window.__oc={TREE,openTree,applyTree,get run(){return run;},get S(){return S;},get alive(){return aliveCount;},buy,startLevel,
  sim(seconds,autobuy){ simResult=null; const dt=1/30; for(let t=0;t<seconds;t+=dt){ step(dt,true); if(autobuy){ const c=cheapestUp(); if(c&&run.coins>=costOf(c,run.lv[c.id])){ run.coins-=costOf(c,run.lv[c.id]); run.lv[c.id]++; } } if(simResult) return simResult; } return {notCleared:true,alive:aliveCount,total:totalCells,lv:JSON.stringify(run.lv)}; }};
})();
</script>
