<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f17">
<title>Ascend – 66-Day Reset</title>
<style>
:root{
  --bg:#0d0f17;--card:#161a26;--card2:#1d2232;--line:#2a3045;--txt:#eef0f7;--mut:#8b93ad;
  --acc:#7c6cff;--acc2:#a78bfa;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;
  --mind:#60a5fa;--body:#34d399;--discipline:#f59e0b;--social:#f472b6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:650;margin:22px 0 10px}
.mut{color:var(--mut)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #5a2a33}
.btn.full{width:100%}
.btn:active{transform:scale(.98)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12px}
/* header */
.hero{background:linear-gradient(135deg,#2a2160,#1a1d33 60%);border:1px solid #33306a}
.lvl{font-size:13px;color:var(--acc2);font-weight:600;letter-spacing:.3px}
.bar{height:10px;background:#0b0d14;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(0,0,0,.25);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
/* quests */
.quest{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left;transition:.15s}
.quest .em{font-size:22px;width:30px;text-align:center}
.quest .nm{flex:1;min-width:0}
.quest .nm b{display:block;font-weight:600}
.quest .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.quest.done{background:#14251f;border-color:#1f4d3c}
.quest.done .ck{background:var(--ok);border-color:var(--ok);color:#06281c}
.quest.done .nm b{text-decoration:line-through;color:#a7f3d0}
.xp{font-size:12px;color:var(--warn);font-weight:600}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.daynav button{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.daynav button:disabled{opacity:.3}
/* grid */
.grid66{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.cell{aspect-ratio:1;border-radius:6px;background:var(--card2);display:grid;place-items:center;font-size:10px;color:var(--mut)}
.cell.today{outline:2px solid var(--acc2)}
.cell.future{opacity:.35}
/* attrs */
.attr{margin-bottom:12px}
.attr .bar{height:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,15,23,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 12px}
nav button .i{font-size:20px}
nav button.on{color:var(--acc2)}
/* misc */
.hlist .item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.hlist .item:last-child{border:0}
.moods{display:flex;gap:6px}
.moods button{flex:1;font-size:24px;padding:8px 0;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.moods button.on{border-color:var(--acc);background:#2a2560}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.seg button.on{border-color:var(--acc);background:#2a2560}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:#2a2560;border:1px solid var(--acc);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}}
.preset{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--card2);width:100%;text-align:left}
.preset.on{border-color:var(--acc);background:#221f4a}
.preset .ck{margin-left:auto;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.preset.on .ck{background:var(--acc);border-color:var(--acc)}
.sync{font-size:11px;color:var(--mut);text-align:center;margin-top:24px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<div id="layer"></div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const ASCEND_WEB_VERSION = 5; // bump on every web update (read by the Android app too)
const PROGRAM_DAYS = 66;
const LS_KEY = "ascend_state_v1";
const CATS = {
  mind:{label:"Mind",color:"var(--mind)",icon:"🧠"},
  body:{label:"Body",color:"var(--body)",icon:"💪"},
  discipline:{label:"Discipline",color:"var(--discipline)",icon:"⚔️"},
  social:{label:"Social",color:"var(--social)",icon:"🤝"}
};
const DIFF = {10:"Easy",20:"Medium",30:"Hard"};
const PRESETS = [
  ["💧","Drink 2L of water","body",10],["🏃","Exercise 30 min","body",30],["🚶","Walk 8,000 steps","body",20],
  ["🛏️","Sleep before 23:00","body",20],["🥗","Eat clean today","body",20],["🧊","Cold shower","discipline",20],
  ["⏰","Wake up before 7:00","discipline",20],["📵","Max 1h social media","discipline",30],["🚭","No smoking / vaping","discipline",30],
  ["🍬","No sugar / junk food","discipline",20],["🧹","Make bed & tidy 10 min","discipline",10],["📖","Read 20 pages","mind",20],
  ["🧘","Meditate 10 min","mind",10],["✍️","Journal","mind",10],["📚","Study / learn 45 min","mind",30],
  ["🇪🇸","Practice a language 15 min","mind",20],["📞","Reach out to a friend/family","social",10],["🙏","Write 3 things I'm grateful for","social",10]
];
const SIDE_POOL = [
  ["b1","🚶","Take a 20-minute walk without your phone","body",15],["b2","🧎","Do 30 push-ups (split up is fine)","body",20],
  ["b3","🧘","Stretch for 10 minutes","body",15],["b4","🪜","Take the stairs everywhere today","body",15],
  ["b5","🍎","Eat 3 portions of fruit or veg","body",15],["b6","🚰","No soft drinks or energy drinks today","body",15],
  ["b7","🏋️","Hold a 2-minute plank (total)","body",20],["b8","🌳","Spend 30 min outside","body",15],
  ["d1","🧹","Clean one area you've been avoiding","discipline",20],["d2","📵","No phone for the first hour after waking","discipline",25],
  ["d3","📴","Phone off 1 hour before bed","discipline",25],["d4","✅","Finish one task you've been putting off","discipline",25],
  ["d5","🗂️","Plan tomorrow in writing","discipline",15],["d6","🧺","Do the laundry / dishes right away","discipline",15],
  ["d7","🧊","End your shower 60 seconds cold","discipline",20],["d8","🎮","No gaming / streaming before 18:00","discipline",25],
  ["d9","💰","Spend nothing that isn't necessary","discipline",20],["d10","🛏️","In bed by 22:30","discipline",20],
  ["m1","📖","Read 10 pages of a book","mind",15],["m2","🎧","Listen to an educational podcast","mind",15],
  ["m3","✍️","Write down 3 goals for this month","mind",15],["m4","🧠","Learn one new fact and explain it to someone","mind",15],
  ["m5","📝","Review your notes from class / work for 20 min","mind",20],["m6","🇪🇸","Learn 10 new words in a language","mind",15],
  ["m7","🤔","10 minutes of quiet thinking – no input","mind",15],["m8","📚","Study 25 minutes without distraction","mind",20],
  ["s1","💬","Compliment someone honestly","social",10],["s2","📞","Call (not text) a friend or family member","social",15],
  ["s3","🤝","Help someone without being asked","social",15],["s4","🙏","Thank someone for something specific","social",10],
  ["s5","👋","Start a conversation with someone new","social",20],["s6","🍽️","Eat a meal without screens, with someone","social",15],
  ["s7","💌","Send a message to someone you haven't talked to in a while","social",15],["s8","😊","Smile at and greet 5 people","social",10]
];
const RANKS = [[1,"Rookie"],[3,"Apprentice"],[6,"Challenger"],[10,"Warrior"],[15,"Elite"],[21,"Champion"],[28,"Master"],[36,"Legend"],[45,"Ascended"]];
const MOODS = ["😞","😕","😐","🙂","😄"];
const EMOJIS = ["✅","💧","🏃","🚶","🛏️","🥗","🧊","⏰","📵","🚭","🍬","🧹","📖","🧘","✍️","📚","💻","🎸","🙏","📞","💰","🌅","🏋️","🚴","🎯","🔥"];

/* ---------- date helpers (local time) ---------- */
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const diffDays = (a,b) => Math.round((parseKey(b)-parseKey(a))/864e5);
const todayKey = () => keyOf(new Date());
const fmtDay = k => parseKey(k).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- state + persistence ---------- */
let state = null;
let view = "today";
let viewDay = todayKey();
let syncMode = "local"; // local | cloud | cloud-error
let remoteRef = null, writing = false, pending = false, writeTimer = null;

function lsGet(){ try{ const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function lsSet(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* fill in fields added in later versions so old data keeps working */
function migrate(s){
  if(!s) return s;
  s.side = s.side || {on:true,count:2,custom:[],off:[]};
  s.side.custom = s.side.custom||[]; s.side.off = s.side.off||[];
  if(![1,2,3].includes(s.side.count)) s.side.count=2;
  s.rem = s.rem || {m:{on:false,t:"08:00"}, e:{on:false,t:"20:00"}};
  s.health = s.health || {on:false};
  return s;
}
const NATIVE = (typeof window.AscendNative!=="undefined") ? window.AscendNative : null;
function nativeSync(){
  if(!NATIVE || !state) return;
  try{
    const t=todayKey(), hs=habitsFor(t), d=(state.log[t]||{}).d||{};
    NATIVE.report(t, hs.filter(h=>d[h.id]!=null).length, hs.length, streak(), state.name||"");
    NATIVE.setReminders(JSON.stringify(state.rem));
  }catch(e){}
}
function save(){
  state.updatedAt = Date.now();
  lsSet();
  nativeSync();
  if(remoteRef){ clearTimeout(writeTimer); writeTimer=setTimeout(flush,700); }
}
async function flush(){
  if(!remoteRef) return;
  if(writing){ pending=true; return; }
  writing=true;
  try{ await remoteRef.set({json: JSON.stringify(state), updatedAt: state.updatedAt}); syncMode="cloud"; }
  catch(e){ syncMode="cloud-error"; }
  writing=false; renderSync();
  if(pending){ pending=false; flush(); }
}

async function connectCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.doc("data/users/"+id+"/state");
    const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    let remote = null;
    if(snap.exists){ try{ remote = JSON.parse(snap.data().json); }catch(e){} }
    remoteRef = ref; syncMode="cloud";
    if(remote && (!state || (remote.updatedAt||0) > (state.updatedAt||0))){
      state = migrate(remote); lsSet(); render();
    } else if(state){ flush(); }
    renderSync();
  }catch(e){ syncMode = remoteRef ? "cloud-error" : "local"; renderSync(); }
}

/* ---------- derived values ---------- */
function habitsFor(k){
  const wd = parseKey(k).getDay();
  return state.habits.filter(h => !h.archived && (!h.days || h.days.length===0 || h.days.includes(wd)) && (!h.since || h.since<=k));
}
function dayLog(k){ return state.log[k] || {d:{}}; }
function dayRatio(k){
  const hs = habitsFor(k); if(!hs.length) return 0;
  const d = dayLog(k).d||{}; return hs.filter(h=>d[h.id]!=null).length / hs.length;
}
function isPerfect(k){ return habitsFor(k).length>0 && dayRatio(k)===1; }
function dayXP(k){
  const lg = state.log[k]||{}, d = lg.d||{}, s = lg.s||{}; let x=0;
  for(const id in d) x += d[id];
  for(const id in s) x += s[id];
  if(isPerfect(k)) x += 50;
  return x;
}
/* ---------- side quests (daily rotation) ---------- */
function sidePool(){
  const off = state.side.off||[];
  return SIDE_POOL.filter(p=>!off.includes(p[0])).map(p=>({id:p[0],emoji:p[1],name:p[2],cat:p[3],xp:p[4]}))
    .concat(state.side.custom||[]);
}
function seeded(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%100000)/100000; }; }
function pickSide(k, roll, exclude){
  const pool = sidePool().filter(p=>!(exclude||[]).includes(p.id));
  const rnd = seeded(k+"#"+roll), out=[], used=new Set();
  // avoid repeating yesterday's picks when possible
  const y = (state.log[addDays(k,-1)]||{}).sq||[]; const yIds=y.map(q=>q.id);
  let cand = pool.filter(p=>!yIds.includes(p.id)); if(cand.length < state.side.count) cand = pool;
  while(out.length < Math.min(state.side.count, cand.length)){
    const p = cand[Math.floor(rnd()*cand.length)];
    if(!used.has(p.id)){ used.add(p.id); out.push(Object.assign({},p)); }
  }
  return out;
}
/* Only today's side quests get created; they are stored so they never change afterwards. */
function ensureSide(k){
  if(!state.side.on || k!==todayKey()) return;
  const lg = state.log[k] || (state.log[k]={d:{}});
  if(!lg.sq){ lg.sq = pickSide(k, 0); save(); }
}
function totalXP(){ let x=0; for(const k in state.log) x+=dayXP(k); return x; }
function levelInfo(xp){
  let lvl=1, need=100, rest=xp;
  while(rest>=need){ rest-=need; lvl++; need=100+ (lvl-1)*25; }
  let rank=RANKS[0][1]; for(const [l,r] of RANKS) if(lvl>=l) rank=r;
  return {lvl, rest, need, rank};
}
const DAY_OK = 0.7; // a day "counts" for the streak at >=70% of quests
function streak(){
  let k=todayKey(), s=0;
  if(dayRatio(k) < DAY_OK) k = addDays(k,-1); // today still in progress
  while(diffDays(state.start,k)>=0 && dayRatio(k)>=DAY_OK){ s++; k=addDays(k,-1); }
  return s;
}
function bestStreak(){
  let best=0,cur=0,k=state.start; const t=todayKey();
  while(diffDays(k,t)>=0){ if(dayRatio(k)>=DAY_OK){cur++;best=Math.max(best,cur);} else if(k!==t) cur=0; k=addDays(k,1); }
  return best;
}
function habitStreak(h){
  let k=todayKey(), s=0, guard=0;
  const done = kk => ((state.log[kk]||{}).d||{})[h.id]!=null;
  const sched = kk => habitsFor(kk).some(x=>x.id===h.id);
  if(sched(k) && !done(k)) k=addDays(k,-1);
  while(guard++<1000 && diffDays(state.start,k)>=0){
    if(!sched(k)){ k=addDays(k,-1); continue; }
    if(done(k)){ s++; k=addDays(k,-1); } else break;
  }
  return s;
}
function habitRate(h){
  let sch=0,dn=0,k=state.start; const t=todayKey();
  while(diffDays(k,t)>=0){ if(habitsFor(k).some(x=>x.id===h.id)){ sch++; if(((state.log[k]||{}).d||{})[h.id]!=null) dn++; } k=addDays(k,1); }
  return sch? Math.round(dn/sch*100) : 0;
}
function attrXP(){
  const a={mind:0,body:0,discipline:0,social:0};
  const byId={}; state.habits.forEach(h=>byId[h.id]=h);
  for(const k in state.log){
    const lg=state.log[k], d=lg.d||{}, s=lg.s||{};
    for(const id in d){ const h=byId[id]; if(h&&a[h.cat]!=null) a[h.cat]+=d[id]; }
    (lg.sq||[]).forEach(q=>{ if(s[q.id]!=null && a[q.cat]!=null) a[q.cat]+=s[q.id]; });
  }
  return a;
}
function programDay(){ return Math.min(PROGRAM_DAYS, diffDays(state.start,todayKey())+1); }

/* ---------- UI helpers ---------- */
const $app = document.getElementById("app");
const $nav = document.getElementById("nav");
const $layer = document.getElementById("layer");
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),1800);
}
function closeSheet(){ $layer.innerHTML=""; }
function sheet(html, bind){
  $layer.innerHTML = '<div class="modal"><div class="sheet">'+html+'</div></div>';
  const m=$layer.querySelector(".modal");
  m.addEventListener("click",e=>{ if(e.target===m) closeSheet(); });
  bind && bind($layer.querySelector(".sheet"));
}
function confirmSheet(text, okLabel, onOk){
  sheet('<p style="margin-bottom:16px">'+esc(text)+'</p><div class="row"><button class="btn ghost full" data-x>Cancel</button><button class="btn danger full" data-ok>'+esc(okLabel)+'</button></div>', s=>{
    s.querySelector("[data-x]").onclick=closeSheet;
    s.querySelector("[data-ok]").onclick=()=>{ closeSheet(); onOk(); };
  });
}

/* ---------- onboarding ---------- */
let obPick = new Set([0,6,11,12,1]);
let obName = "";
function renderOnboarding(){
  $nav.style.display="none";
  $app.innerHTML = `
    <div style="text-align:center;margin:28px 0 22px">
      <div style="font-size:44px">🔥</div>
      <h1 style="font-size:26px;margin-top:6px">Ascend</h1>
      <p class="mut">Your 66-day reset. Daily quests, XP, levels, streaks – no paywall.</p>
    </div>
    <div class="field"><label>What should I call you?</label><input id="obn" maxlength="30" placeholder="Your name" value="${esc(obName)}"></div>
    <h2>Pick your daily quests <span class="mut small">(you can change them anytime)</span></h2>
    <div id="obl">${PRESETS.map((p,i)=>`
      <button class="preset ${obPick.has(i)?"on":""}" data-i="${i}">
        <span style="font-size:20px">${p[0]}</span>
        <span><b style="font-weight:600">${esc(p[1])}</b><br><span class="small mut">${CATS[p[2]].label} · ${DIFF[p[3]]} · +${p[3]} XP</span></span>
        <span class="ck">${obPick.has(i)?"✓":""}</span>
      </button>`).join("")}</div>
    <button class="btn full" id="obgo" style="margin:16px 0 30px">Start my 66 days →</button>`;
  $app.querySelector("#obn").oninput=e=>obName=e.target.value;
  $app.querySelectorAll(".preset").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; obPick.has(i)?obPick.delete(i):obPick.add(i); renderOnboarding(); });
  $app.querySelector("#obgo").onclick=()=>{
    if(!obPick.size){ toast("Pick at least one quest"); return; }
    const t=todayKey();
    state = { v:1, name:obName.trim(), start:t, createdAt:Date.now(), updatedAt:Date.now(),
      habits:[...obPick].sort((a,b)=>a-b).map(i=>({id:uid(),emoji:PRESETS[i][0],name:PRESETS[i][1],cat:PRESETS[i][2],xp:PRESETS[i][3],days:[],since:t})),
      log:{} };
    migrate(state); save(); view="today"; viewDay=t; render(); toast("Day 1 – let's go! 🔥");
  };
}

function bindToday(){

    const before=levelInfo(totalXP()).lvl, wasPerfect=isPerfect(viewDay);

function bindQuests(){

    const p=PRESETS.find(x=>x[1]===b.dataset.p); if(!p) return;
    state.habits.push({id:uid(),emoji:p[0],name:p[1],cat:p[2],xp:p[3],days:[],since:todayKey()}); save(); render(); toast("Quest added");
  });
  $app.querySelector("#sqon").onclick=()=>{ state.side.on=!state.side.on; save(); render(); };
  $app.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{ state.side.count=+b.dataset.sc; save(); render(); });
  $app.querySelectorAll("[data-sqt]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.sqt, off=state.side.off||(state.side.off=[]);
    if(off.includes(id)) state.side.off=off.filter(x=>x!==id);
    else { if(sidePool().length<=state.side.count){ toast("Keep at least "+state.side.count+" in the pool"); return; } off.push(id); }
    save(); render();
  });
  $app.querySelectorAll("[data-sqdel]").forEach(b=>b.onclick=()=>{
    if(sidePool().length<=state.side.count){ toast("Keep at least "+state.side.count+" in the pool"); return; }
    state.side.custom=state.side.custom.filter(q=>q.id!==b.dataset.sqdel); save(); render();

function editHabit(h){
  const isNew=!h;
  const f = h? JSON.parse(JSON.stringify(h)) : {id:uid(),emoji:"✅",name:"",cat:"discipline",xp:20,days:[],since:todayKey()};
  const dn=["Su","Mo","Tu","We","Th","Fr","Sa"];
  const draw=()=>{
    sheet(`
      <h2 style="margin-top:0">${isNew?"New quest":"Edit quest"}</h2>
      <div class="field"><label>Name</label><input id="hn" maxlength="60" value="${esc(f.name)}" placeholder="e.g. No phone after 22:00"></div>
      <div class="field"><label>Icon</label><div class="seg">${EMOJIS.map(e=>`<button data-em="${e}" class="${f.emoji===e?"on":""}">${e}</button>`).join("")}</div></div>
      <div class="field"><label>Attribute</label><div class="seg">${Object.keys(CATS).map(c=>`<button data-c="${c}" class="${f.cat===c?"on":""}">${CATS[c].icon} ${CATS[c].label}</button>`).join("")}</div></div>
      <div class="field"><label>Difficulty</label><div class="seg">${Object.keys(DIFF).map(x=>`<button data-x="${x}" class="${f.xp==x?"on":""}">${DIFF[x]} · ${x} XP</button>`).join("")}</div></div>
      ${HEALTH_OK?`<div class="field"><label>❤️ Auto-complete from Samsung Health / Health Connect</label><div class="seg">
        <button data-at="" class="${!f.auto?"on":""}">Off</button>${Object.keys(AUTO).map(k=>`<button data-at="${k}" class="${f.auto&&f.auto.type===k?"on":""}">${AUTO[k].icon} ${AUTO[k].label}</button>`).join("")}</div>
        ${f.auto?`<div class="row" style="margin-top:8px"><input id="av" ${f.auto.type==="sleep"?'type="time"':'type="number" inputmode="decimal" step="any" min="0"'} value="${esc(f.auto.val)}" style="max-width:150px"><span class="small mut">${f.auto.type==="sleep"?"asleep by":AUTO[f.auto.type].unit}</span></div>`:""}</div>`:""}
      <div class="field"><label>Days (none selected = every day)</label><div class="seg">${[1,2,3,4,5,6,0].map(d=>`<button data-d="${d}" class="${f.days.includes(d)?"on":""}">${dn[d]}</button>`).join("")}</div></div>
      <button class="btn full" id="hs" style="margin-top:6px">${isNew?"Add quest":"Save"}</button>
      ${isNew?"":`<div class="row" style="margin-top:10px"><button class="btn ghost full" id="ha">${f.archived?"Restore":"Archive"}</button><button class="btn danger full" id="hd">Delete</button></div>`}
    `, s=>{
      const nm=s.querySelector("#hn"); nm.oninput=()=>f.name=nm.value;
      s.querySelectorAll("[data-em]").forEach(b=>b.onclick=()=>{f.emoji=b.dataset.em;draw();});
      s.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{f.cat=b.dataset.c;draw();});
      s.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{f.xp=+b.dataset.x;draw();});
      s.querySelectorAll("[data-at]").forEach(b=>b.onclick=()=>{ const t=b.dataset.at; f.auto = t? {type:t,val:(f.auto&&f.auto.type===t)?f.auto.val:AUTO[t].def} : null; draw(); });
      const av=s.querySelector("#av"); av&&(av.oninput=()=>{ if(f.auto) f.auto.val = f.auto.type==="sleep"? av.value : (parseFloat(av.value)||0); });
      s.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const d=+b.dataset.d; f.days=f.days.includes(d)?f.days.filter(x=>x!==d):[...f.days,d]; draw();});
      s.querySelector("#hs").onclick=()=>{
        if(!f.name.trim()){ toast("Give it a name"); return; }
        f.name=f.name.trim();
        if(!f.auto) delete f.auto;
        if(isNew) state.habits.push(f); else { Object.assign(h,f); if(!f.auto) delete h.auto; }
        save(); closeSheet(); render(); toast(isNew?"Quest added":"Saved");
      };
      const ha=s.querySelector("#ha"); ha&&(ha.onclick=()=>{ h.archived=!h.archived; save(); closeSheet(); render(); });
      const hd=s.querySelector("#hd"); hd&&(hd.onclick=()=>confirmSheet("Delete \""+h.name+"\"? Its earned XP stays in your history, but attribute stats for it are lost.","Delete",()=>{
        state.habits=state.habits.filter(x=>x.id!==h.id); save(); render(); }));
    });
    const nm=$layer.querySelector("#hn"); if(nm && isNew && !f.name) nm.focus();
  };
  draw();
}

    <div class="row between"><span><b style="font-weight:600">Evening streak check</b><br><span class="small mut">Only if quests are still open that day</span></span>
      <button class="btn ${state.rem.e.on?"":"ghost"}" style="padding:7px 14px" data-ron="e">${state.rem.e.on?"On":"Off"}</button></div>
    ${state.rem.e.on?`<input type="time" data-rt="e" value="${esc(state.rem.e.t)}" style="margin-top:10px">`:""}
    <button class="btn ghost full small" id="rtest" style="margin-top:14px">Send a test notification</button>
  </div>`:""}
  ${HEALTH_OK?`
  <h2>❤️ Samsung Health / Health Connect</h2>
  <div class="card">
    ${state.health.status==="unsupported"?`<p class="small mut">Your app version needs an update for this – install the latest Ascend (banner on the Today screen).</p>`:
      (state.health.on&&(state.health.status==="install"||state.health.status==="update"))?`
    <p class="small" style="margin-bottom:10px">${state.health.status==="install"?"Your phone needs Google's free <b>Health Connect</b> app first (Android 13 and older). Install it, then come back and tap Connect.":"Health Connect needs an update. Update it, then tap Connect."}</p>
    <div class="row"><button class="btn full" id="hcget">${state.health.status==="install"?"Get Health Connect":"Update Health Connect"}</button><button class="btn ghost full" id="hc">Connect</button></div>
    <button class="btn danger full small" id="hcoff" style="margin-top:10px">Cancel</button>`:`
    <div class="row between"><span><b style="font-weight:600">${state.health.on&&state.health.status==="ok"?"Connected":"Auto-complete quests"}</b><br><span class="small mut">${state.health.on&&state.health.status==="ok"?(health&&health.date===todayKey()?"Today: "+(health.steps!=null?Number(health.steps).toLocaleString()+" steps":"no step data yet"):"Waiting for data…"):"Steps, workouts, sleep and water tick your quests automatically."}</span></span>
      <button class="btn ${state.health.on&&state.health.status==="ok"?"ghost":""}" style="padding:7px 14px" id="hc">${state.health.on&&state.health.status==="ok"?"Refresh":"Connect"}</button></div>
    ${state.health.on&&state.health.status==="error"?`<p class="small" style="color:var(--warn);margin-top:10px">Couldn't read Health Connect. Open Health Connect once, then tap Connect again.</p>`:""}
    ${state.health.on&&state.health.status==="denied"?`<p class="small" style="color:var(--warn);margin-top:10px">Permission not given. Tap Connect and allow Steps, Exercise, Sleep and Hydration.</p>`:""}
    ${state.health.on?`<p class="small mut" style="margin-top:10px">Set which quests auto-complete in <b>Quests → Edit</b>. In Samsung Health turn on <b>Settings → Health Connect</b> sync so your data shows up here.</p>
    <button class="btn danger full small" id="hcoff" style="margin-top:10px">Disconnect</button>`:""}`}
  </div>`:""}
  <h2>Updates</h2>
  <div class="card">
    <div class="row between"><span class="small mut">App ${esc(NATIVE?(NATIVE.apkVersion?NATIVE.apkVersion():"?"):"web")} · content v${ASCEND_WEB_VERSION}</span>
    ${NATIVE&&NATIVE.checkUpdates?'<button class="btn ghost" style="padding:7px 12px" id="upd">Check now</button>':''}</div>
    <p class="small mut" style="margin-top:8px">${NATIVE?"New features install automatically when you open the app.":"This web version is always up to date."}</p>
  </div>
  <h2>Backup</h2>
  <div class="card">
    <p class="small mut" style="margin-bottom:10px">Copy your data to keep a backup, or paste a backup to restore it.</p>
    <div class="row"><button class="btn ghost full" id="cp">Copy backup</button><button class="btn ghost full" id="rs">Restore…</button></div>
  </div>
  <h2>Start over</h2>
  <div class="card">
    <p class="small mut" style="margin-bottom:10px">New 66-day run from today. Keeps your quests, clears progress, XP and journal.</p>
    <button class="btn ghost full" id="nr">Start a new 66 days</button>
    <button class="btn danger full" id="wipe" style="margin-top:8px">Erase everything</button>
  </div>
  <p class="small mut" style="margin-top:20px;text-align:center">How it works: each quest gives XP (Easy 10 · Medium 20 · Hard 30). Finish all quests for +50. A day counts toward your streak at ≥70% done. 66 days is roughly how long a habit takes to stick.</p>`;
}
function bindSettings(){
  const sn=$app.querySelector("#sn"); sn.onchange=()=>{ state.name=sn.value.trim(); save(); toast("Saved"); };
  const sd=$app.querySelector("#sd"); sd.onchange=()=>{ if(sd.value && sd.value<=todayKey()){ state.start=sd.value; save(); toast("Start date updated"); } };
  $app.querySelectorAll("[data-ron]").forEach(b=>b.onclick=()=>{
    const r=state.rem[b.dataset.ron]; r.on=!r.on;
    if(r.on && NATIVE){ try{ NATIVE.askPermission(); }catch(e){} }
    save(); render(); if(r.on) toast("Reminder set for "+r.t);
  });
  $app.querySelectorAll("[data-rt]").forEach(i=>i.onchange=()=>{
    if(!/^\d\d:\d\d$/.test(i.value)) return;
    state.rem[i.dataset.rt].t=i.value; save(); toast("Reminder set for "+i.value);
  });
  const rt=$app.querySelector("#rtest"); rt&&(rt.onclick=()=>{ try{ NATIVE.askPermission(); NATIVE.test(); }catch(e){} });
  const hc=$app.querySelector("#hc"); hc&&(hc.onclick=()=>{
    const first=!state.health.on; state.health.on=true;
    if(first){ const n=guessAuto(); if(n) setTimeout(()=>toast("❤️ "+n+" quests set to auto-complete"),600); }
    save(); try{ NATIVE.healthConnect(); }catch(e){} render();
  });
  const hcget=$app.querySelector("#hcget"); hcget&&(hcget.onclick=()=>{ try{ NATIVE.healthInstall(); }catch(e){ toast("Search 'Health Connect' in the Play Store"); } });
  const hcoff=$app.querySelector("#hcoff"); hcoff&&(hcoff.onclick=()=>{ state.health.on=false; state.health.status=""; health=null; save(); render(); toast("Disconnected"); });
  const upd=$app.querySelector("#upd"); upd&&(upd.onclick=()=>{ try{ NATIVE.checkUpdates(); toast("Checking for updates…"); }catch(e){} });
  $app.querySelector("#cp").onclick=async()=>{
    const txt=JSON.stringify(state);
    try{ await navigator.clipboard.writeText(txt); toast("Backup copied – paste it into a note"); }
    catch(e){ sheet('<h2 style="margin-top:0">Your backup</h2><p class="small mut" style="margin-bottom:8px">Select all and copy this text:</p><textarea rows="8" readonly>'+esc(txt)+'</textarea><button class="btn full" style="margin-top:10px" data-x>Done</button>', s=>{ s.querySelector("[data-x]").onclick=closeSheet; const ta=s.querySelector("textarea"); ta.focus(); ta.select(); }); }
  };
  $app.querySelector("#rs").onclick=()=>sheet('<h2 style="margin-top:0">Restore backup</h2><textarea id="rt" rows="8" placeholder="Paste backup here"></textarea><button class="btn full" style="margin-top:10px" id="rok">Restore</button>', s=>{
    s.querySelector("#rok").onclick=()=>{
      try{ const d=JSON.parse(s.querySelector("#rt").value); if(!d||!Array.isArray(d.habits)||!d.log||!d.start) throw 0;
        state=migrate(d); save(); closeSheet(); render(); toast("Restored ✓"); }
      catch(e){ toast("That doesn't look like a valid backup"); }
    };
  });
  $app.querySelector("#nr").onclick=()=>confirmSheet("Start a new 66-day run from today? Progress, XP and journal will be cleared (copy a backup first if you want to keep them).","Start over",()=>{
    const t=todayKey(); state.start=t; state.log={}; state.habits.forEach(h=>h.since=t); save(); viewDay=t; view="today"; render(); toast("Fresh start 🔥");
  });
  $app.querySelector("#wipe").onclick=()=>confirmSheet("Erase all quests, progress and journal entries? This can't be undone.","Erase",()=>{
    state=null; try{localStorage.removeItem(LS_KEY);}catch(e){}
    if(remoteRef) remoteRef.delete().catch(()=>{});
    obPick=new Set([0,6,11,12,1]); obName=""; render();
  });
}

/* ---------- shell ---------- */
const TABS=[["today","🎯","Today"],["progress","📈","Progress"],["quests","📋","Quests"],["settings","⚙️","Settings"]];
function renderSync(){
  const el=document.getElementById("sync"); if(!el) return;
  el.textContent = syncMode==="cloud" ? "☁️ Synced to your Claude account" : syncMode==="cloud-error" ? "⚠️ Couldn't sync – saved on this device" : "💾 Saved on this device";
}
function render(){
  if(!state){ renderOnboarding(); return; }
  if(viewDay>todayKey()) viewDay=todayKey();
  if(diffDays(state.start,viewDay)<0) viewDay=state.start;
  ensureSide(todayKey());
  $nav.style.display="flex";
  $nav.innerHTML=TABS.map(([k,i,l])=>`<button data-v="${k}" class="${view===k?"on":""}"><span class="i">${i}</span>${l}</button>`).join("");
  $nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{ view=b.dataset.v; if(view==="today") viewDay=todayKey(); render(); window.scrollTo(0,0); });
  const body = view==="today"?renderToday(): view==="progress"?renderProgress(): view==="quests"?renderQuests(): renderSettings();
  $app.innerHTML = (view==="today"?apkBanner():"") + body + '<div class="sync" id="sync"></div>';
  const ag=$app.querySelector("#apkgo"); ag&&(ag.onclick=()=>{ try{ NATIVE.installApk(); toast("Downloading update…"); }catch(e){} });
  if(view==="today") bindToday(); else if(view==="quests") bindQuests(); else if(view==="settings") bindSettings();
  renderSync();
}

/* ---------- Health Connect (Samsung Health etc.) ---------- */
const AUTO = {
  steps:{label:"Steps",icon:"👣",unit:"steps",def:8000,txt:v=>"≥ "+Number(v).toLocaleString()+" steps"},
  exercise:{label:"Exercise",icon:"🏃",unit:"min",def:30,txt:v=>"≥ "+v+" min exercise"},
  sleep:{label:"Bedtime",icon:"🛏️",unit:"time",def:"23:00",txt:v=>"asleep by "+v},
  water:{label:"Water",icon:"💧",unit:"L",def:2,txt:v=>"≥ "+v+" L water"}
};
const AUTO_GUESS = [[/steps/i,"steps",8000],[/exercise|workout|train/i,"exercise",30],[/sleep|bed before/i,"sleep","23:00"],[/water|drink 2/i,"water",2]];
const HEALTH_OK = !!(NATIVE && NATIVE.healthConnect);
let health = null; // today's numbers from Health Connect
// minutes after 12:00 noon, so 23:30 < 00:30
const nightMin = t => { const [h,m]=String(t).split(":").map(Number); return ((h+12)%24)*60+(m||0); };
function autoMet(a, hd){
  if(!a||!hd) return false;
  if(a.type==="steps") return hd.steps!=null && hd.steps >= +a.val;
  if(a.type==="exercise") return hd.exerciseMin!=null && hd.exerciseMin >= +a.val;
  if(a.type==="water") return hd.waterL!=null && hd.waterL >= +a.val - 1e-9;
  if(a.type==="sleep") return !!hd.sleepStart && nightMin(hd.sleepStart) <= nightMin(a.val);
  return false;
}
function guessAuto(){
  let n=0;
  state.habits.forEach(h=>{ if(h.auto) return; for(const [re,type,val] of AUTO_GUESS){ if(re.test(h.name)){ h.auto={type,val}; n++; break; } } });
  return n;
}
window.ascendHealth = function(json){
  let d; try{ d = typeof json==="string" ? JSON.parse(json) : json; }catch(e){ return; }
  if(!d || !state) return;
  if(d.status && d.status!=="ok"){ state.health.status=d.status; render(); return; }
  health = d; state.health.status="ok";
  const t=todayKey(); if(d.date!==t) { render(); return; }
  const lg = state.log[t] || (state.log[t]={d:{}}); lg.d=lg.d||{}; lg.auto=lg.auto||{};
  const before=levelInfo(totalXP()).lvl, done=[];
  habitsFor(t).forEach(h=>{ if(h.auto && lg.d[h.id]==null && !(lg.noAuto||{})[h.id] && autoMet(h.auto,d)){ lg.d[h.id]=h.xp; lg.auto[h.id]=1; done.push(h.name); } });
  if(done.length){ save(); }
  render();
  const L=levelInfo(totalXP()).lvl;
  if(done.length) toast("❤️ Auto-completed: "+done.join(", ")+(L>before?" · Level "+L+"!":""));
};
function healthRefresh(){ if(HEALTH_OK && state && state.health.on){ try{ NATIVE.healthRefresh(); }catch(e){} } }
function healthStrip(){
  if(!health || health.date!==todayKey() || viewDay!==todayKey()) return "";
  const parts=[];
  if(health.steps!=null) parts.push("👣 "+Number(health.steps).toLocaleString());
  if(health.exerciseMin!=null) parts.push("🏃 "+health.exerciseMin+" min");
  if(health.waterL!=null && health.waterL>0) parts.push("💧 "+(Math.round(health.waterL*10)/10)+" L");
  if(health.sleepStart) parts.push("🛏️ "+health.sleepStart+(health.sleepHours?" · "+health.sleepHours+"h":""));
  return parts.length? `<div class="row small" style="justify-content:center;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--mut)">${parts.map(esc).join("<span>·</span>")}</div>`:"";
}

/* ---------- update hooks (called by the Android app) ---------- */
let apkUpdate = null;
window.ascendApkUpdate = function(ver){ apkUpdate = ver; if(state) render(); };
window.ascendToast = function(msg){ toast(msg); };
function apkBanner(){
  if(!apkUpdate || !NATIVE || !NATIVE.installApk) return "";
  return `<div class="card" style="margin-top:14px;border-color:var(--acc);background:#221f4a"><div class="row between">
    <span><b style="font-weight:600">📦 App update ready</b><br><span class="small mut">Tap install – your progress stays.</span></span>
    <button class="btn" style="padding:8px 14px" id="apkgo">Install</button></div></div>`;
}
/* roll over to a new day if the app stays open past midnight */
let lastDay=todayKey();
function checkDay(){ const t=todayKey(); if(t!==lastDay){ if(viewDay===lastDay) viewDay=t; lastDay=t; health=null; if(state) render(); } healthRefresh(); }
setInterval(healthRefresh, 15*60000);
setInterval(checkDay,60000);
window.addEventListener("focus",checkDay);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkDay(); });

state = migrate(lsGet());
render();
try{ const seen=+localStorage.getItem("ascend_seen_ver")||0;
  if(state && seen && seen<ASCEND_WEB_VERSION) setTimeout(()=>toast("✨ Ascend updated to v"+ASCEND_WEB_VERSION),400);
  localStorage.setItem("ascend_seen_ver",String(ASCEND_WEB_VERSION)); }catch(e){}
nativeSync();
healthRefresh();
connectCloud();
})();
</script>
